<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>다차원 역사 선형 비교 탐색기: Neo-Brutalism Edition</title>
    <style>
        /* 네오 브루탈리즘 다크 테마 변수 */
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --border-color: #ffffff;
            --text-color: #ffffff;
            --text-muted: #aaaaaa;
            
            /* 네오 브루탈리즘 특유의 쨍한 포인트 컬러 */
            --korea-color: #FF3366; /* 강렬한 핑크/레드 */
            --west-color: #33CCFF;  /* 네온 블루 */
            --world-color: #00FF66; /* 네온 그린 */
            --war-color: #FF9900;   /* 경고 오렌지 */
            
            --brutal-shadow: 6px 6px 0px rgba(255, 255, 255, 0.9);
            --brutal-border: 3px solid var(--border-color);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', 'Gothic A1', -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: radial-gradient(#333 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* ---------------- 네비게이션 ---------------- */
        header {
            background: var(--bg-color);
            border-bottom: var(--brutal-border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .title-area h1 {
            font-size: 1.8rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -1px;
            color: #FFF;
            text-shadow: 4px 4px 0px var(--korea-color);
        }

        .title-area p {
            font-size: 0.9rem;
            font-weight: bold;
            color: var(--world-color);
            margin-top: 5px;
        }

        .control-panel {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .search-input {
            background: #000;
            border: var(--brutal-border);
            color: white;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            font-weight: bold;
            width: 250px;
            outline: none;
            box-shadow: 4px 4px 0px var(--west-color);
            transition: all 0.2s;
        }

        .search-input:focus {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px var(--west-color);
        }

        .view-switch {
            display: flex;
            gap: 10px;
        }

        .switch-btn {
            background: #000;
            border: var(--brutal-border);
            color: #FFF;
            padding: 0.75rem 1.2rem;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 900;
            box-shadow: 4px 4px 0px #FFF;
            transition: all 0.2s ease;
            text-transform: uppercase;
        }

        .switch-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px #FFF;
        }

        .switch-btn.active {
            background: var(--world-color);
            color: #000;
            box-shadow: 4px 4px 0px var(--west-color);
            border-color: #000;
        }

        /* ---------------- 메인 컨텐츠 ---------------- */
        main {
            flex: 1;
            position: relative;
            overflow: hidden;
            display: flex;
        }

        /* [1] 평행선 뷰어 */
        #parallel-view-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            padding: 2rem;
            box-sizing: border-box;
            justify-content: flex-start;
            gap: 2rem;
            overflow-x: auto;
            overflow-y: auto;
            white-space: nowrap;
        }

        .parallel-lane {
            position: relative;
            height: 180px;
            min-height: 180px;
            background: #000;
            border: var(--brutal-border);
            min-width: 3500px; /* 타임라인 길이 연장 */
            box-shadow: 8px 8px 0px rgba(255,255,255,0.1);
        }

        .lane-title {
            position: absolute;
            left: 0;
            top: -15px;
            background: #000;
            padding: 4px 16px;
            font-size: 1rem;
            font-weight: 900;
            border: var(--brutal-border);
            box-shadow: 4px 4px 0px #FFF;
            z-index: 2;
        }

        /* 테마별 색상 매핑 */
        .lane-korea .lane-title { color: #000; background: var(--korea-color); box-shadow: 4px 4px 0px #FFF; }
        .lane-west .lane-title { color: #000; background: var(--west-color); }
        .lane-world .lane-title { color: #000; background: var(--world-color); }
        .lane-war .lane-title { color: #000; background: var(--war-color); }

        .lane-axis {
            position: absolute;
            top: 50%;
            left: 20px;
            right: 20px;
            height: 4px;
            background: #FFF;
            transform: translateY(-50%);
        }

        .linear-card {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: #000;
            border: var(--brutal-border);
            padding: 12px;
            width: 220px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            white-space: normal;
            box-shadow: 6px 6px 0px #FFF;
            z-index: 5;
        }

        .linear-card:hover {
            transform: translateY(-60%) scale(1.05);
            z-index: 10;
            box-shadow: 10px 10px 0px var(--korea-color);
        }

        /* 트랙별 카드 쉐도우 호버 포인트 */
        .lane-korea .linear-card:hover { box-shadow: 10px 10px 0px var(--korea-color); }
        .lane-west .linear-card:hover { box-shadow: 10px 10px 0px var(--west-color); }
        .lane-world .linear-card:hover { box-shadow: 10px 10px 0px var(--world-color); }
        .lane-war .linear-card:hover { box-shadow: 10px 10px 0px var(--war-color); }

        .card-image-thumb {
            width: 100%;
            height: 80px;
            object-fit: cover;
            border-bottom: 2px solid #FFF;
            margin-bottom: 8px;
            background-color: #333;
        }

        .card-year {
            font-size: 0.9rem;
            font-weight: 900;
            background: #FFF;
            color: #000;
            display: inline-block;
            padding: 2px 6px;
            margin-bottom: 6px;
        }

        .card-title {
            font-size: 1rem;
            font-weight: 900;
            line-height: 1.2;
            margin-bottom: 4px;
        }

        /* [2] 세로형 뷰어 */
        #vertical-view-container {
            width: 100%;
            height: 100%;
            overflow-y: auto;
            padding: 3rem 1rem;
            display: none;
        }

        .vertical-timeline {
            position: relative;
            max-width: 900px;
            margin: 0 auto;
        }

        .vertical-timeline::after {
            content: '';
            position: absolute;
            width: 6px;
            background: #FFF;
            top: 0; bottom: 0; left: 50%;
            margin-left: -3px;
        }

        .v-item {
            padding: 20px 40px;
            position: relative;
            width: 50%;
        }
        .v-item.left { left: 0; text-align: right; }
        .v-item.right { left: 50%; text-align: left; }

        .v-item::after {
            content: '';
            position: absolute;
            width: 24px;
            height: 24px;
            background: #000;
            border: 4px solid #FFF;
            border-radius: 0; /* 브루탈리즘 사각형 노드 */
            top: 30px; z-index: 1;
        }
        .v-item.left::after { right: -12px; }
        .v-item.right::after { left: -12px; }

        .v-content {
            background: #000;
            padding: 1.5rem;
            border: var(--brutal-border);
            box-shadow: 8px 8px 0px #FFF;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }
        .v-content:hover {
            transform: translate(-4px, -4px);
            box-shadow: 12px 12px 0px var(--west-color);
        }

        /* ---------------- 모달 및 사전 팝업 ---------------- */
        .modal {
            display: none;
            position: fixed;
            z-index: 100;
            left: 0; top: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .modal-content {
            background: #000;
            border: 4px solid #FFF;
            box-shadow: 12px 12px 0px var(--world-color);
            padding: 2rem;
            max-width: 700px;
            width: 100%;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
            animation: brutalPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes brutalPop {
            0% { transform: scale(0.8) translateY(20px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        .close-btn {
            position: absolute;
            top: 1rem; right: 1.5rem;
            font-size: 2.5rem;
            font-weight: 900;
            color: #FFF;
            cursor: pointer;
            line-height: 1;
        }
        .close-btn:hover { color: var(--korea-color); }

        .modal-hero-img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border: var(--brutal-border);
            margin-bottom: 1.5rem;
        }

        .modal-header-tag {
            display: inline-block;
            font-size: 1rem;
            font-weight: 900;
            background: #FFF;
            color: #000;
            padding: 4px 10px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .modal-title {
            font-size: 2rem;
            font-weight: 900;
            margin-bottom: 1rem;
            line-height: 1.2;
        }

        .modal-desc {
            color: #FFF;
            font-size: 1.1rem;
            line-height: 1.7;
            margin-bottom: 1.5rem;
            padding: 15px;
            background: rgba(255,255,255,0.05);
            border-left: 5px solid var(--west-color);
        }

        /* 사전(Dictionary) 툴팁 기능 */
        .dict-word {
            background: rgba(255, 255, 0, 0.2);
            border-bottom: 2px dashed #FFD700;
            cursor: help;
            font-weight: bold;
            color: #FFD700;
            position: relative;
        }

        .dict-tooltip {
            position: absolute;
            display: none;
            background: #000;
            border: 2px solid #FFF;
            box-shadow: 4px 4px 0px var(--korea-color);
            color: #FFF;
            padding: 10px;
            font-size: 0.9rem;
            width: 250px;
            z-index: 200;
            pointer-events: none;
            font-weight: normal;
        }

        .tag-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 2rem;
        }

        .keyword-tag {
            background: transparent;
            border: 2px solid #FFF;
            color: #FFF;
            font-size: 0.85rem;
            font-weight: bold;
            padding: 6px 12px;
            cursor: pointer;
        }
        .keyword-tag:hover {
            background: #FFF;
            color: #000;
        }

        /* 외부 링크 버튼 그룹 */
        .link-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .portal-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #000;
            border: 2px solid #000;
            padding: 12px;
            font-size: 1rem;
            font-weight: 900;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
            min-width: 150px;
        }

        .btn-google { background: #4285F4; box-shadow: 4px 4px 0px #FFF; color:#FFF; }
        .btn-wiki { background: #E5E5E5; box-shadow: 4px 4px 0px #FFF; }
        .btn-youtube { background: #FF0000; box-shadow: 4px 4px 0px #FFF; color:#FFF; }

        .portal-btn:hover {
            transform: translate(-3px, -3px);
            box-shadow: 7px 7px 0px #FFF;
        }
    </style>
</head>
<body>

    <header>
        <div class="title-area">
            <h1>CHRONOS: Brutal History</h1>
            <p>한국사 · 서양사 · 세계사 · 전쟁사 입체 탐색기</p>
        </div>

        <div class="control-panel">
            <input type="text" id="search-box" class="search-input" placeholder="키워드, 사건 실시간 검색...">
            <div class="view-switch">
                <button class="switch-btn active" id="btn-parallel" onclick="switchView('parallel')">평행(가로)</button>
                <button class="switch-btn" id="btn-vertical" onclick="switchView('vertical')">수직(세로)</button>
            </div>
        </div>
    </header>

    <main>
        <!-- 1. 다차원 평행 뷰어 (가로 스크롤) -->
        <div id="parallel-view-container">
            <!-- 한국사 -->
            <div class="parallel-lane lane-korea">
                <div class="lane-title">🇰🇷 한국사 (Korean History)</div>
                <div class="lane-axis"></div>
                <div id="korea-lane-content"></div>
            </div>
            <!-- 서양사 -->
            <div class="parallel-lane lane-west">
                <div class="lane-title">🏛️ 서양사 (Western History)</div>
                <div class="lane-axis"></div>
                <div id="west-lane-content"></div>
            </div>
            <!-- 세계사 -->
            <div class="parallel-lane lane-world">
                <div class="lane-title">🌍 세계사 (World History)</div>
                <div class="lane-axis"></div>
                <div id="world-lane-content"></div>
            </div>
            <!-- 전쟁사 -->
            <div class="parallel-lane lane-war">
                <div class="lane-title">⚔️ 전쟁사 (Military History)</div>
                <div class="lane-axis"></div>
                <div id="war-lane-content"></div>
            </div>
        </div>

        <!-- 2. 수직 타임라인 뷰어 -->
        <div id="vertical-view-container">
            <div class="vertical-timeline" id="vertical-timeline-content"></div>
        </div>
    </main>

    <!-- 공통 사전 툴팁 (Dictionary Tooltip) -->
    <div id="dictTooltip" class="dict-tooltip"></div>

    <!-- 모달 상세창 -->
    <div class="modal" id="infoModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <img src="" id="modalImg" class="modal-hero-img" alt="History Image">
            <div class="modal-header-tag" id="modalCategory">CATEGORY</div>
            <h2 class="modal-title" id="modalTitle">사건 타이틀</h2>
            <p class="modal-desc" id="modalDesc">사건 핵심 정밀 서술 본문...</p>
            
            <div class="tag-container" id="modalTags"></div>
            
            <div class="link-group">
                <a href="#" target="_blank" class="portal-btn btn-wiki" id="wikiLink">📖 위키백과</a>
                <a href="#" target="_blank" class="portal-btn btn-google" id="googleLink">🔍 구글 검색</a>
                <a href="#" target="_blank" class="portal-btn btn-youtube" id="youtubeLink">▶️ 유튜브 영상</a>
            </div>
        </div>
    </div>

    <script>

        // 뷰 전환
        function switchView(mode) {
            const parallelContainer = document.getElementById('parallel-view-container');
            const verticalContainer = document.getElementById('vertical-view-container');
            const btnParallel = document.getElementById('btn-parallel');
            const btnVertical = document.getElementById('btn-vertical');

            if (mode === 'parallel') {
                parallelContainer.style.display = 'flex';
                verticalContainer.style.display = 'none';
                btnParallel.classList.add('active');
                btnVertical.classList.remove('active');
            } else {
                parallelContainer.style.display = 'none';
                verticalContainer.style.display = 'block';
                btnParallel.classList.remove('active');
                btnVertical.classList.add('active');
            }
        }

        // 사전 단어 파싱 및 하이라이팅 함수
        function parseDictionary(text) {
            let parsedText = text;
            for (const [word, meaning] of Object.entries(dictionaryData)) {
                const regex = new RegExp(word, 'g');
                // 호버 시 툴팁을 띄울 수 있도록 span 태그 삽입
                parsedText = parsedText.replace(regex, `<span class="dict-word" onmousemove="showDict(event, '${meaning}')" onmouseout="hideDict()">${word}</span>`);
            }
            return parsedText;
        }

        // 툴팁 노출/숨김
        const dictTooltip = document.getElementById('dictTooltip');
        function showDict(e, meaning) {
            dictTooltip.innerHTML = meaning;
            dictTooltip.style.display = 'block';
            dictTooltip.style.left = (e.pageX + 15) + 'px';
            dictTooltip.style.top = (e.pageY + 15) + 'px';
        }
        function hideDict() {
            dictTooltip.style.display = 'none';
        }

        // 데이터 렌더링
        function initializeTimelineApp(filterQuery = '') {
            const lanes = {
                korea: document.getElementById('korea-lane-content'),
                west: document.getElementById('west-lane-content'),
                world: document.getElementById('world-lane-content'),
                war: document.getElementById('war-lane-content')
            };
            const verticalTimeline = document.getElementById('vertical-timeline-content');

            // 초기화
            Object.values(lanes).forEach(lane => lane.innerHTML = '');
            verticalTimeline.innerHTML = '';

            // 가로 스크롤 정렬을 위해 연도 순 정렬 모방 (이미 timelineX 기준)
            let verticalCount = 0;

            historyDatabase.forEach((event) => {
                const isMatch = event.title.includes(filterQuery) || 
                                event.desc.includes(filterQuery) || 
                                event.keywords.some(k => k.includes(filterQuery));
                if (!isMatch) return;

                // [1] 평행 뷰 카드 생성
                const card = document.createElement('div');
                card.className = 'linear-card';
                card.style.left = `${event.timelineX}px`;
                card.onclick = () => openModal(event);
                
                card.innerHTML = `
                    <img src="${event.imgUrl}" class="card-image-thumb" alt="${event.title}">
                    <span class="card-year">${event.year}</span>
                    <h4 class="card-title">${event.title}</h4>
                    <p style="font-size:0.8rem; color:#aaa; margin-top:5px; line-height:1.4; display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">${event.summary}</p>
                `;
                lanes[event.category].appendChild(card);

                // [2] 수직 뷰 생성
                const vItem = document.createElement('div');
                const sideClass = verticalCount % 2 === 0 ? 'left' : 'right';
                vItem.className = `v-item ${sideClass}`;
                
                let badgeColor = "var(--border-color)";
                if(event.category === 'korea') badgeColor = "var(--korea-color)";
                if(event.category === 'west') badgeColor = "var(--west-color)";
                if(event.category === 'world') badgeColor = "var(--world-color)";
                if(event.category === 'war') badgeColor = "var(--war-color)";
                
                vItem.innerHTML = `
                    <div class="v-content" style="border-color:${badgeColor}" onclick='openModal(${JSON.stringify(event).replace(/'/g, "&apos;")})'>
                        <span class="card-year" style="background:${badgeColor}; color:#000;">${event.year} - ${event.categoryKo}</span>
                        <h3 style="font-size:1.3rem; font-weight:900; margin:10px 0;">${event.title}</h3>
                        <p style="font-size:0.95rem; color:#ccc;">${event.summary}</p>
                    </div>
                `;
                verticalTimeline.appendChild(vItem);
                verticalCount++;
            });
        }

        // 모달 제어 및 외부 링크 연동
        function openModal(data) {
            // 헤더 테마 컬러 연동
            let catColor = "#FFF";
            if(data.category === 'korea') catColor = "var(--korea-color)";
            if(data.category === 'west') catColor = "var(--west-color)";
            if(data.category === 'world') catColor = "var(--world-color)";
            if(data.category === 'war') catColor = "var(--war-color)";
            
            const tagEl = document.getElementById('modalCategory');
            tagEl.innerText = data.categoryKo;
            tagEl.style.background = catColor;

            document.getElementById('modalImg').src = data.imgUrl;
            document.getElementById('modalTitle').innerText = `${data.year} : ${data.title}`;
            
            // 본문 삽입 및 사전 단어 파싱
            document.getElementById('modalDesc').innerHTML = parseDictionary(data.desc);

            // 키워드 태그 (클릭 시 자동 검색되도록)
            const tagContainer = document.getElementById('modalTags');
            tagContainer.innerHTML = '';
            data.keywords.forEach(keyword => {
                const tagEl = document.createElement('button');
                tagEl.className = 'keyword-tag';
                tagEl.innerText = `#${keyword}`;
                tagEl.onclick = () => {
                    document.getElementById('search-box').value = keyword;
                    initializeTimelineApp(keyword);
                    closeModal();
                };
                tagContainer.appendChild(tagEl);
            });

            // 포털 및 백과사전 외부 다이내믹 링크 세팅
            const searchQuery = encodeURIComponent(data.title);
            document.getElementById('wikiLink').href = `https://ko.wikipedia.org/wiki/${searchQuery}`;
            document.getElementById('googleLink').href = `https://www.google.com/search?q=${searchQuery}+역사`;
            document.getElementById('youtubeLink').href = `https://www.youtube.com/results?search_query=${searchQuery}+다큐멘터리`;

            document.getElementById('infoModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('infoModal').style.display = 'none';
        }

        // 검색 이벤트 리스너
        document.getElementById('search-box').addEventListener('input', (e) => {
            initializeTimelineApp(e.target.value.trim());
        });

        // 배경 클릭 시 모달 닫기
        window.onclick = function(e) {
            const modal = document.getElementById('infoModal');
            if (e.target === modal) closeModal();
        }

        window.onload = () => initializeTimelineApp();
    </script>
