<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인터랙티브 대전환 역사 연표</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --korea-color: #ef4444;
            --west-color: #3b82f6;
            --world-color: #10b981;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 2rem 1rem;
            line-height: 1.6;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            font-weight: 800;
            background: linear-gradient(to right, #f43f5e, #3b82f6, #10b981);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        /* 필터 버튼 */
        .filter-container {
            display: flex;
            justify-content: center;
            gap: 0.75rem;
            margin-bottom: 3rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 0.6rem 1.5rem;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .filter-btn:hover {
            transform: translateY(-2px);
        }

        .filter-btn.active[data-filter="all"] { background-color: var(--text-color); color: var(--bg-color); }
        .filter-btn.active[data-filter="korea"] { background-color: var(--korea-color); color: white; border-color: var(--korea-color); }
        .filter-btn.active[data-filter="west"] { background-color: var(--west-color); color: white; border-color: var(--west-color); }
        .filter-btn.active[data-filter="world"] { background-color: var(--world-color); color: white; border-color: var(--world-color); }

        /* 타임라인 구조 */
        .timeline {
            position: relative;
            margin: 0 auto;
        }

        .timeline::after {
            content: '';
            position: absolute;
            width: 4px;
            background-color: var(--border-color);
            top: 0;
            bottom: 0;
            left: 50%;
            margin-left: -2px;
        }

        /* 타임라인 아이템 */
        .timeline-item {
            padding: 10px 40px;
            position: relative;
            background-color: inherit;
            width: 50%;
            opacity: 1;
            transform: translateY(0);
            transition: all 0.5s ease;
        }

        .timeline-item.hide {
            display: none;
        }

        /* 홀수/짝수 배치 */
        .timeline-item.left { left: 0; text-align: right; }
        .timeline-item.right { left: 50%; text-align: left; }

        /* 중앙 원 */
        .timeline-item::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            right: -8px;
            background-color: var(--card-bg);
            border: 4px solid var(--border-color);
            top: 24px;
            border-radius: 50%;
            z-index: 1;
            transition: all 0.3s ease;
        }

        .timeline-item.right::after { left: -8px; }

        /* 카테고리별 테두리 및 원 색상 지정을 위한 변수 적용 */
        .timeline-item.korea::after { border-color: var(--korea-color); }
        .timeline-item.west::after { border-color: var(--west-color); }
        .timeline-item.world::after { border-color: var(--world-color); }

        /* 카드 콘텐츠 */
        .timeline-content {
            padding: 1.5rem;
            background-color: var(--card-bg);
            position: relative;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .timeline-content:hover {
            transform: scale(1.03);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            border-color: #64748b;
        }

        .timeline-item.korea .timeline-content:hover { border-color: var(--korea-color); }
        .timeline-item.west .timeline-content:hover { border-color: var(--west-color); }
        .timeline-item.world .timeline-content:hover { border-color: var(--world-color); }

        .time-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: #fff;
        }

        .korea .time-badge { background-color: var(--korea-color); }
        .west .time-badge { background-color: var(--west-color); }
        .world .time-badge { background-color: var(--world-color); }

        .event-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .event-summary {
            color: var(--text-muted);
            font-size: 0.95rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* 모달 팝업 */
        .modal {
            display: none;
            position: fixed;
            z-index: 100;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .modal-content {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 2.5rem 2rem;
            border-radius: 16px;
            max-width: 550px;
            width: 100%;
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: modalFade 0.3s ease;
        }

        @keyframes modalFade {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .close-btn {
            position: absolute;
            top: 1rem;
            right: 1.5rem;
            font-size: 1.8rem;
            color: var(--text-muted);
            cursor: pointer;
            transition: color 0.2s;
        }

        .close-btn:hover { color: var(--text-color); }

        .modal-badge {
            display: inline-block;
            padding: 0.3rem 1rem;
            border-radius: 4px;
            color: white;
            font-weight: 700;
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        .modal-title {
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 1rem;
        }

        .modal-desc {
            color: #cbd5e1;
            font-size: 1.05rem;
            line-height: 1.7;
        }

        /* 반응형 모바일 디자인 */
        @media screen and (max-width: 768px) {
            .timeline::after { left: 31px; }
            .timeline-item { width: 100%; padding-left: 70px; padding-right: 25px; text-align: left !important; }
            .timeline-item.right { left: 0; }
            .timeline-item::after { left: 23px !important; right: auto; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>인터랙티브 역사 연표 Viewer</h1>
        <p>노드를 클릭해 대전환점이 된 역사적 사건의 숨겨진 이야기를 탐색해 보세요.</p>
    </header>

    <!-- 카테고리 필터링 탭 -->
    <div class="filter-container">
        <button class="filter-btn active" data-filter="all">전체보기</button>
        <button class="filter-btn" data-filter="korea">한국사</button>
        <button class="filter-btn" data-filter="west">서양사</button>
        <button class="filter-btn" data-filter="world">세계사</button>
    </div>

    <!-- 타임라인 영역 -->
    <div class="timeline" id="timeline">
        <!-- 자바스크립트로 데이터 동적 바인딩 -->
    </div>
</div>

<!-- 상세 내용 모달 창 -->
<div class="modal" id="eventModal">
    <div class="modal-content">
        <span class="close-btn" id="closeModal">&times;</span>
        <div class="modal-badge" id="modalBadge">카테고리</div>
        <h2 class="modal-title" id="modalTitle">사건 제목</h2>
        <p class="modal-desc" id="modalDesc">사건 상세 설명이 이곳에 표시됩니다.</p>
    </div>
</div>
