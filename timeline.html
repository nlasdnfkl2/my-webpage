<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>평행 차원 역사 선형 비교 탐색기</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: rgba(22, 30, 49, 0.8);
            --border-color: #2a364f;
            --text-color: #f1f5f9;
            --text-muted: #64748b;
            --korea-color: #ef4444;
            --west-color: #3b82f6;
            --world-color: #10b981;
            --neon-glow: rgba(0, 240, 255, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 네비게이션 및 컨트롤 바 */
        header {
            background: rgba(15, 23, 42, 0.9);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .title-area h1 {
            font-size: 1.4rem;
            font-weight: 800;
            background: linear-gradient(to right, #00f0ff, #bd00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .title-area p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .control-panel {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        /* 뷰 모드 토글 스위치 */
        .view-switch {
            display: flex;
            background: #1e293b;
            padding: 4px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
        }

        .switch-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 6px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .switch-btn.active {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        /* 검색 인터페이스 */
        .search-wrapper {
            position: relative;
        }

        .search-input {
            background: #111827;
            border: 1px solid var(--border-color);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 0.85rem;
            width: 220px;
            outline: none;
            transition: all 0.3s;
        }

        .search-input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 8px rgba(59, 130, 246, 0.3);
        }

        /* 메인 컨텐츠 영역 */
        main {
            flex: 1;
            position: relative;
            overflow: hidden;
            display: flex;
        }

        /* [1번 뷰] 평행선 비교 대시보드 (Parallel View) */
        #parallel-view-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            padding: 2rem;
            box-sizing: border-box;
            justify-content: space-around;
            overflow-x: auto;
            white-space: nowrap;
        }

        .parallel-lane {
            position: relative;
            height: 160px;
            background: linear-gradient(to right, rgba(30, 41, 59, 0.2), rgba(15, 23, 42, 0.4));
            border-radius: 12px;
            border: 1px dashed var(--border-color);
            margin-bottom: 1rem;
            min-width: 2800px; /* 고정 선형 길이 보장 */
        }

        .lane-title {
            position: absolute;
            left: 20px;
            top: -12px;
            background: var(--bg-color);
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            border: 1px solid var(--border-color);
        }

        .lane-korea .lane-title { color: var(--korea-color); border-color: rgba(239, 68, 68, 0.4); }
        .lane-west .lane-title { color: var(--west-color); border-color: rgba(59, 130, 246, 0.4); }

        /* 시간대 타임라인 축 라인 */
        .lane-axis {
            position: absolute;
            top: 50%;
            left: 50px;
            right: 50px;
            height: 2px;
            background: rgba(255,255,255,0.1);
            transform: translateY(-50%);
        }

        /* 선형 타임라인 카드 */
        .linear-card {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: #1e293b;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 14px;
            width: 200px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            white-space: normal;
        }

        .linear-card:hover {
            transform: translateY(-55%) scale(1.05);
            z-index: 5;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }

        .lane-korea .linear-card:hover { border-color: var(--korea-color); }
        .lane-west .linear-card:hover { border-color: var(--west-color); }

        .linear-card .card-year {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            display: block;
            margin-bottom: 2px;
        }
        .lane-korea .linear-card .card-year { color: #fca5a5; }
        .lane-west .linear-card .card-year { color: #93c5fd; }

        .linear-card .card-title {
            font-size: 0.85rem;
            font-weight: 700;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* [2번 뷰] 기존 세로형 타임라인 뷰 */
        #vertical-view-container {
            width: 100%;
            height: 100%;
            overflow-y: auto;
            padding: 3rem 1rem;
            display: none;
        }

        .vertical-timeline {
            position: relative;
            max-width: 800px;
            margin: 0 auto;
        }

        .vertical-timeline::after {
            content: '';
            position: absolute;
            width: 2px;
            background: var(--border-color);
            top: 0; bottom: 0; left: 50%;
            margin-left: -1px;
        }

        .v-item {
            padding: 10px 30px;
            position: relative;
            width: 50%;
        }
        .v-item.left { left: 0; text-align: right; }
        .v-item.right { left: 50%; text-align: left; }

        .v-item::after {
            content: '';
            position: absolute;
            width: 12px;
            height: 12px;
            background: var(--bg-color);
            border: 3px solid var(--border-color);
            border-radius: 50%;
            top: 22px; z-index: 1;
        }
        .v-item.left::after { right: -6px; }
        .v-item.right::after { left: -6px; }

        .v-item.korea::after { border-color: var(--korea-color); }
        .v-item.west::after { border-color: var(--west-color); }

        .v-content {
            background: #141f32;
            padding: 1.25rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .v-content:hover {
            transform: scale(1.02);
        }

        .v-badge {
            font-size: 0.75rem;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
            color: white;
            margin-bottom: 6px;
            display: inline-block;
        }

        /* 모달 팝업 창 */
        .modal {
            display: none;
            position: fixed;
            z-index: 100;
            left: 0; top: 0; width: 100%; height: 100%;
            background: rgba(7, 10, 19, 0.85);
            backdrop-filter: blur(6px);
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .modal-content {
            background: #151f32;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2rem;
            max-width: 540px;
            width: 100%;
            position: relative;
            animation: fadeIn 0.25s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .close-btn {
            position: absolute;
            top: 1rem; right: 1.25rem;
            font-size: 1.5rem;
            color: var(--text-muted);
            cursor: pointer;
        }

        .modal-header-tag {
            font-size: 0.8rem;
            font-weight: 700;
            color: #3b82f6;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .modal-title {
            font-size: 1.4rem;
            font-weight: 800;
            margin-bottom: 1rem;
        }

        .modal-desc {
            color: #cbd5e1;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }

        /* 키워드 해시태그 배치 */
        .tag-container {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 1.5rem;
        }

        .keyword-tag {
            background: #1e293b;
            border: 1px solid #334155;
            color: #94a3b8;
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 4px;
        }

        /* 구글 검색 버튼 */
        .search-portal-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s;
        }

        .search-portal-btn:hover {
            background: #1d4ed8;
        }

        /* 하단 가이드 안내 */
        .footer-guide {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.8rem;
            color: var(--text-muted);
            pointer-events: none;
            z-index: 2;
        }
    </style>
</head>
<body>

    <header>
        <div class="title-area">
            <h1>평행선 차원 역사 다차원 탐색기</h1>
            <p>서양사와 한국사의 동시대적 변동 흐름을 평행선 위에서 직관적으로 대조하세요.</p>
        </div>

        <div class="control-panel">
            <div class="search-wrapper">
                <input type="text" id="search-box" class="search-input" placeholder="사건, 키워드 실시간 검색...">
            </div>
            <div class="view-switch">
                <button class="switch-btn active" id="btn-parallel" onclick="switchView('parallel')">평행선 모델</button>
                <button class="switch-btn" id="btn-vertical" onclick="switchView('vertical')">세로형 타임라인</button>
            </div>
        </div>
    </header>

    <main>
        <!-- 1. 평행 차원 뷰어 -->
        <div id="parallel-view-container">
            <!-- 한국사 평행선 트랙 -->
            <div class="parallel-lane lane-korea">
                <div class="lane-title">🇰🇷 대한민국·고대 한반도 차원 트랙</div>
                <div class="lane-axis"></div>
                <div id="korea-lane-content"></div>
            </div>

            <!-- 서양사 평행선 트랙 -->
            <div class="parallel-lane lane-west">
                <div class="lane-title">🇪🇺 서구 세계·지중해 문명 차원 트랙</div>
                <div class="lane-axis"></div>
                <div id="west-lane-content"></div>
            </div>
        </div>

        <!-- 2. 기존 세로형 타임라인 뷰어 -->
        <div id="vertical-view-container">
            <div class="vertical-timeline" id="vertical-timeline-content"></div>
        </div>
    </main>

    <div class="footer-guide" id="scroll-guide-text">
        💡 평행선 모델 모드입니다. 마우스 휠이나 트랙패드로 가로 스크롤하여 동시대 역사를 추적해 보세요.
    </div>

    <!-- 인터랙티브 탐색 모달 상자 -->
    <div class="modal" id="infoModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div class="modal-header-tag" id="modalCategory">CATEGORY</div>
            <h2 class="modal-title" id="modalTitle">사건 타이틀</h2>
            <p class="modal-desc" id="modalDesc">사건 핵심 정밀 서술 본문...</p>
            <div class="tag-container" id="modalTags"></div>
            <a href="#" target="_blank" class="search-portal-btn" id="googleLink">
                🌐 구글(Google) 포털 연동 실시간 입체 정밀 검색
            </a>
        </div>
    </div>

                desc: "크리스토퍼 콜럼버스의 항해선단이 아메리카 대륙에 당도하면서, 구대륙과 신대륙 간의 급격한 물적·인적 문명 대교류가 촉발되었습니다.",
                keywords: ["콜럼버스", "대항해시대", "신대륙개척", "글로벌통합", "스페인왕실"]
            },

                keywords: ["바스티유감옥", "구체제타파", "인권선언", "루이16세", "시민계급"]

            {

                timelineY: 2350, // 인덱스 편의

                summary: "전 민족적 독립 만세 투쟁과 민주공화정 선포",
                desc: "일제의 무단통치에 항거해 거국적으로 일어난 비폭력 독립 만세 성과를 안고 상하이에 대한민국 임시정부를 세워 민주공화제의 정통성을 확립했습니다.",
                keywords: ["유관순", "민족대표33인", "독립선언서", "대한민국임시정부", "민주공화정"]

            {
                year: "1939년",

                summary: "전쟁 폐허를 딛고 일어선 냉전 화합의 축제",
                desc: "한강의 기적과 민주화 성취를 전 세계에 과시함과 동시에, 오랜 동서 냉전 진영의 국가들이 대거 참여하여 평화의 기틀을 마련했습니다.",
                keywords: ["한강의기적", "냉전완화", "호돌이", "평화축제", "개발도상국도약"]

        // 뷰 전환 코어 함수
        function switchView(mode) {
            const parallelContainer = document.getElementById('parallel-view-container');
            const verticalContainer = document.getElementById('vertical-view-container');
            const btnParallel = document.getElementById('btn-parallel');
            const btnVertical = document.getElementById('btn-vertical');
            const guideText = document.getElementById('scroll-guide-text');

            if (mode === 'parallel') {
                parallelContainer.style.display = 'flex';
                verticalContainer.style.display = 'none';
                btnParallel.classList.add('active');
                btnVertical.classList.remove('active');
                guideText.innerText = "💡 평행선 모델 모드입니다. 마우스 휠이나 트랙패드로 가로 스크롤하여 동시대 역사를 추적해 보세요.";
            } else {
                parallelContainer.style.display = 'none';
                verticalContainer.style.display = 'block';
                btnParallel.classList.remove('active');
                btnVertical.classList.add('active');
                guideText.innerText = "💡 세로형 타임라인 모드입니다. 아래로 스크롤하며 인류 문명 발전사를 세로로 독파해 보세요.";
            }
        }

        // 데이터 동적 바인딩 시스템 (평행선 트랙 및 세로 타임라인 동시 빌드)
        function initializeTimelineApp(filterQuery = '') {
            const koreaLane = document.getElementById('korea-lane-content');
            const westLane = document.getElementById('west-lane-content');
            const verticalTimeline = document.getElementById('vertical-timeline-content');

            // 기존 노드 잔여물 완전 청소
            koreaLane.innerHTML = '';
            westLane.innerHTML = '';
            verticalTimeline.innerHTML = '';

            let verticalCount = 0;

            historyDatabase.forEach((event) => {
                // 실시간 쿼리 매칭 검색 스캔 연산 (사건명, 본문, 요약 태그 포괄 검색)
                const isMatch = event.title.includes(filterQuery) || 
                                event.desc.includes(filterQuery) || 
                                event.keywords.some(k => k.includes(filterQuery));
                
                if (!isMatch) return;

                // 1. 평행 차원 가로 선형 카드 컴포넌트 생성
                const card = document.createElement('div');
                card.className = 'linear-card';
                card.style.left = `${event.timelineX}px`;
                card.onclick = () => openModal(event);
                card.innerHTML = `
                    <span class="card-year">${event.year}</span>
                    <h4 class="card-title">${event.title}</h4>
                    <p style="font-size:0.75rem; color:#94a3b8; margin-top:3px; display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">${event.summary}</p>
                `;

                if (event.category === 'korea') {
                    koreaLane.appendChild(card);
                } else {
                    westLane.appendChild(card);
                }

                // 2. 세로형 타임라인 카드 컴포넌트 빌드업
                const vItem = document.createElement('div');
                const sideClass = verticalCount % 2 === 0 ? 'left' : 'right';
                vItem.className = `v-item ${sideClass} ${event.category}`;
                
                // 카테고리 색상 칩 바인딩
                const badgeColor = event.category === 'korea' ? 'var(--korea-color)' : 'var(--west-color)';
                
                vItem.innerHTML = `
                    <div class="v-content" onclick='openModal(${JSON.stringify(event).replace(/'/g, "&apos;")})'>
                        <span class="v-badge" style="background:${badgeColor}">${event.year} [${event.categoryKo}]</span>
                        <h3 style="font-size:1.1rem; font-weight:700; margin-bottom:4px;">${event.title}</h3>
                        <p style="font-size:0.85rem; color:#94a3b8;">${event.summary}</p>
                    </div>
                `;
                verticalTimeline.appendChild(vItem);
                verticalCount++;
            });
        }

        // 모달 상세 팝업 가동 엔진 및 다이내믹 구글 쿼리 인젝션
        function openModal(eventData) {
            document.getElementById('modalCategory').innerText = eventData.categoryKo;
            document.getElementById('modalCategory').style.color = eventData.category === 'korea' ? 'var(--korea-color)' : 'var(--west-color)';
            document.getElementById('modalTitle').innerText = `${eventData.year} - ${eventData.title}`;
            document.getElementById('modalDesc').innerText = eventData.desc;

            // 키워드 해시태그 버블 생성
            const tagContainer = document.getElementById('modalTags');
            tagContainer.innerHTML = '';
            eventData.keywords.forEach(keyword => {
                const tagEl = document.createElement('span');
                tagEl.className = 'keyword-tag';
                tagEl.innerText = `#${keyword}`;
                tagContainer.appendChild(tagEl);
            });

            // 구글 포털 자동 다이내믹 조합 쿼리 URL 전송 바인딩
            const searchQuery = encodeURIComponent(`${eventData.year} ${eventData.title}`);
            document.getElementById('googleLink').href = `https://www.google.com/search?q=${searchQuery}`;

            document.getElementById('infoModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('infoModal').style.display = 'none';
        }

        // 라이브 통합 디바운싱 실시간 검색 이벤트 바인딩
        document.getElementById('search-box').addEventListener('input', (e) => {
            initializeTimelineApp(e.target.value.trim());
        });

        // 윈도우 마우스 바깥 클릭 모달 소멸 처리 규칙
        window.onclick = function(e) {
            const modal = document.getElementById('infoModal');
            if (e.target === modal) closeModal();
        }

        // 앱 기동 초기화 호출
        window.onload = () => {
            initializeTimelineApp();
        };
    </script>
</body>
