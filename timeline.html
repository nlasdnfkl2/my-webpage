<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>문태양 - CHRONOS: 역사 연표 탐색기</title>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css');
    
    :root {
      --bg: #fdfbf7;
      --white: #ffffff;
      --black: #111111;
      --border: 3px solid var(--black);
      --border-thick: 4px solid var(--black);
      
      --yellow: #ffd83b;
      --red: #ff4757;
      --blue: #3e51ff;
      --green: #2ed573;
      --pink: #ff9ff3;
      --cyan: #48dbfb;

      --cat-korea: var(--red);
      --cat-west: var(--cyan);
      --cat-world: var(--green);
      --cat-war: var(--yellow);
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    
    body {
      font-family: "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background: var(--bg);
      color: var(--black);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      position: relative;
      padding-top: 70px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 상단 고정 바 (portfolio_main 통일) */
    .fixed-top-bar {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 60px;
      background: var(--yellow);
      border-bottom: var(--border-thick);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 24px;
      z-index: 2000;
      box-shadow: 0 4px 0 var(--black);
    }

    .fixed-top-bar .current-time {
      font-weight: 900;
      font-size: 0.95rem;
      background: var(--white);
      border: var(--border);
      padding: 4px 10px;
      box-shadow: 2px 2px 0 var(--black);
    }

    .fixed-top-bar .icon-group {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .fixed-top-bar .icon-btn {
      width: 38px; height: 38px;
      background: var(--white);
      border: var(--border);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 3px 3px 0 var(--black);
      cursor: pointer;
      font-weight: 900; font-size: 0.9rem;
      transition: all 0.1s ease;
      text-decoration: none;
      color: var(--black);
    }

    .fixed-top-bar .icon-btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 5px 5px 0 var(--black);
      background: var(--cyan);
    }

    .wrap {
      max-width: 1120px;
      width: 100%;
      margin: 0 auto;
      padding: 0 24px;
      flex: 1;
    }

    a { color: inherit; transition: all 0.2s ease; text-decoration: none; }

    /* 상단 브랜드 바 */
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px 0;
      border-bottom: var(--border-thick);
      font-size: 1rem;
      font-weight: 800;
      gap: 16px;
      flex-wrap: wrap;
    }

    .top b {
      font-size: 1.4rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      background: var(--black);
      color: var(--yellow);
      padding: 4px 12px;
      transform: skew(-5deg);
      display: inline-block;
    }

    .top nav {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .top nav a, .top nav button {
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 800;
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 6px 12px;
      color: var(--black);
    }

    .top nav a:hover, .top nav button:hover {
      background: var(--black);
      color: var(--bg);
    }

    /* 히어로 타이틀 영역 */
    .hero {
      padding: 56px 0 48px;
      border-bottom: var(--border-thick);
    }

    .hero .small {
      display: inline-block;
      font-size: 0.95rem;
      font-weight: 800;
      background: var(--cyan);
      border: var(--border);
      padding: 4px 12px;
      box-shadow: 4px 4px 0 var(--black);
      margin-bottom: 20px;
    }

    .hero h1 {
      font-size: clamp(2.1rem, 5vw, 3.4rem);
      line-height: 1.25;
      font-weight: 900;
    }

    .hero h1 span {
      display: inline-block;
      color: var(--black);
      background: var(--yellow);
      border: var(--border-thick);
      padding: 0 14px;
      box-shadow: 6px 6px 0 var(--black);
      transform: rotate(-2deg);
    }

    .hero p {
      max-width: 44em;
      margin-top: 24px;
      font-size: 1.05rem;
      font-weight: 600;
      border-left: 6px solid var(--black);
      padding-left: 18px;
    }

    /* 컨트롤 패널 */
    .control-panel {
      margin-top: 36px;
      background: var(--white);
      border: var(--border-thick);
      box-shadow: 6px 6px 0 var(--black);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .control-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .view-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tab-btn {
      background: var(--bg);
      border: var(--border);
      padding: 8px 14px;
      font-weight: 900;
      font-size: 0.9rem;
      cursor: pointer;
      box-shadow: 3px 3px 0 var(--black);
      transition: all 0.12s ease;
    }

    .tab-btn:hover:not(.active) {
      background: var(--yellow);
      transform: translate(-2px, -2px);
      box-shadow: 5px 5px 0 var(--black);
    }

    .tab-btn.active {
      background: var(--black);
      color: var(--yellow);
      transform: translate(1px, 1px);
      box-shadow: 2px 2px 0 var(--red);
    }

    .search-group {
      display: flex;
      gap: 10px;
      align-items: center;
      flex: 1;
      min-width: 260px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .search-wrap {
      position: relative;
      flex: 1;
      min-width: 210px;
      max-width: 340px;
    }

    .search-input {
      width: 100%;
      background: var(--bg);
      border: var(--border);
      color: var(--black);
      padding: 9px 36px 9px 14px;
      font-size: 0.95rem;
      font-weight: 800;
      box-shadow: 3px 3px 0 var(--black);
      outline: none;
      transition: all 0.12s ease;
    }

    .search-input:focus {
      background: var(--white);
      transform: translate(-2px, -2px);
      box-shadow: 5px 5px 0 var(--black);
    }

    .clear-search-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: var(--black);
      color: var(--white);
      border: none;
      width: 20px;
      height: 20px;
      font-size: 0.75rem;
      font-weight: 900;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .clear-search-btn.visible {
      display: flex;
    }

    .tool-btn {
      background: var(--white);
      color: var(--black);
      border: var(--border);
      padding: 9px 14px;
      font-weight: 900;
      font-size: 0.88rem;
      cursor: pointer;
      box-shadow: 3px 3px 0 var(--black);
      transition: all 0.12s ease;
      white-space: nowrap;
    }

    .tool-btn:hover {
      background: var(--cyan);
      transform: translate(-2px, -2px);
      box-shadow: 5px 5px 0 var(--black);
    }

    .tool-btn.active {
      background: var(--green);
      color: var(--black);
    }

    .tool-btn.random-btn {
      background: var(--pink);
    }

    .tool-btn.random-btn:hover {
      background: var(--yellow);
    }

    .sub-filter-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 14px;
      border-top: 2px dashed var(--black);
      gap: 12px;
      flex-wrap: wrap;
    }

    .era-filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .filter-label {
      font-size: 0.85rem;
      font-weight: 900;
      background: var(--black);
      color: var(--white);
      padding: 3px 10px;
    }

    .era-chip {
      background: var(--white);
      border: 2px solid var(--black);
      padding: 4px 10px;
      font-size: 0.82rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 2px 2px 0 var(--black);
      transition: all 0.1s;
    }

    .era-chip:hover:not(.active) {
      background: var(--yellow);
    }

    .era-chip.active {
      background: var(--cyan);
      font-weight: 900;
    }

    .status-strip {
      margin-top: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.88rem;
      font-weight: 800;
      background: var(--white);
      border: var(--border);
      padding: 8px 16px;
      box-shadow: 4px 4px 0 var(--black);
      gap: 12px;
      flex-wrap: wrap;
    }

    .count-badge {
      background: var(--yellow);
      border: 2px solid var(--black);
      padding: 2px 10px;
      font-weight: 900;
    }

    /* 메인 보드 영역 */
    main {
      padding: 36px 0 80px;
    }

    /* 1. 전체 보기 (멀티 타임라인 레인) */
    .board-multi {
      display: flex;
      flex-direction: column;
      gap: 44px;
    }

    .lane-section {
      position: relative;
    }

    .lane-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .lane-header {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 6px 16px;
      font-size: 1.05rem;
      font-weight: 900;
      color: var(--black);
      border: var(--border-thick);
      box-shadow: 4px 4px 0 var(--black);
    }

    .lane-header.korea { background: var(--cat-korea); color: var(--white); }
    .lane-header.west { background: var(--cat-west); }
    .lane-header.world { background: var(--cat-world); }
    .lane-header.war { background: var(--cat-war); }

    .lane-count {
      background: var(--black);
      color: var(--yellow);
      font-size: 0.8rem;
      padding: 1px 8px;
    }

    .lane-scroll-btns {
      display: flex;
      gap: 8px;
    }

    .scroll-arrow {
      width: 36px;
      height: 36px;
      background: var(--white);
      border: var(--border);
      box-shadow: 3px 3px 0 var(--black);
      font-weight: 900;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.1s;
    }

    .scroll-arrow:hover {
      background: var(--yellow);
      transform: translate(-2px, -2px);
      box-shadow: 5px 5px 0 var(--black);
    }

    .lane {
      position: relative;
      background: var(--white);
      border: var(--border-thick);
      box-shadow: 6px 6px 0 var(--black);
      display: flex;
      align-items: stretch;
      padding: 24px 20px;
      gap: 20px;
      overflow-x: auto;
      scroll-behavior: smooth;
    }

    .lane::-webkit-scrollbar {
      height: 12px;
    }
    .lane::-webkit-scrollbar-track {
      background: var(--bg);
      border-top: 3px solid var(--black);
    }
    .lane::-webkit-scrollbar-thumb {
      background: var(--black);
      border: 2px solid var(--bg);
    }

    .timeline-axis {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: 4px;
      background: var(--black);
      z-index: 1;
      pointer-events: none;
    }

    .lane-empty {
      position: relative;
      z-index: 2;
      background: var(--bg);
      border: var(--border);
      padding: 20px 28px;
      font-weight: 800;
      margin: 0 auto;
    }

    /* 2. 단일 카테고리 그리드 보기 */
    .board-single {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 24px;
    }

    /* 카드 디자인 (portfolio_main 앱 카드 스타일 통일) */
    .event-card {
      position: relative;
      z-index: 5;
      background: var(--white);
      border: var(--border-thick);
      box-shadow: 6px 6px 0 var(--black);
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .board-multi .event-card {
      min-width: 265px;
      width: 265px;
      flex-shrink: 0;
    }

    .board-single .event-card {
      width: 100%;
    }

    .event-card:hover {
      transform: translate(-4px, -4px);
      box-shadow: 10px 10px 0 var(--black);
      z-index: 15;
    }

    .card-top-bar {
      height: 32px;
      border-bottom: var(--border-thick);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      background: var(--cyan);
    }

    .event-card.cat-korea .card-top-bar { background: var(--cat-korea); color: var(--white); }
    .event-card.cat-west .card-top-bar { background: var(--cat-west); }
    .event-card.cat-world .card-top-bar { background: var(--cat-world); }
    .event-card.cat-war .card-top-bar { background: var(--cat-war); }

    .card-dots {
      display: flex;
      gap: 6px;
    }

    .card-dot {
      width: 9px;
      height: 9px;
      border: 2px solid var(--black);
      border-radius: 50%;
      background: var(--white);
    }

    .card-body {
      padding: 18px;
      display: flex;
      flex-direction: column;
      flex: 1;
      background: var(--white);
    }

    .event-card:hover .card-body {
      background: #fffdf5;
    }

    .card-meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .e-year {
      display: inline-block;
      background: var(--black);
      color: var(--yellow);
      padding: 2px 10px;
      font-weight: 900;
      font-size: 0.85rem;
    }

    .wiki-badge {
      background: var(--pink);
      color: var(--black);
      padding: 1px 8px;
      font-size: 0.72rem;
      font-weight: 900;
      border: 2px solid var(--black);
      box-shadow: 2px 2px 0 var(--black);
    }

    .e-title {
      font-size: 1.18rem;
      font-weight: 900;
      line-height: 1.35;
      margin-bottom: 8px;
      color: var(--black);
    }

    .e-summary {
      font-size: 0.9rem;
      color: #222;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      font-weight: 600;
      flex: 1;
    }

    .card-keywords {
      margin-top: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .mini-tag {
      font-size: 0.75rem;
      font-weight: 800;
      background: var(--bg);
      border: 2px solid var(--black);
      padding: 1px 7px;
    }

    /* 상세 모달 */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(17, 17, 17, 0.78);
      backdrop-filter: blur(4px);
      justify-content: center;
      align-items: center;
      z-index: 3000;
      padding: 20px;
    }

    .modal-content {
      background: var(--white);
      border: var(--border-thick);
      padding: 36px;
      max-width: 760px;
      width: 100%;
      position: relative;
      max-height: 88vh;
      overflow-y: auto;
      box-shadow: 12px 12px 0 var(--black);
    }

    .close-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      font-size: 1.6rem;
      font-weight: 900;
      cursor: pointer;
      color: var(--black);
      background: var(--red);
      color: var(--white);
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: var(--border);
      box-shadow: 3px 3px 0 var(--black);
      transition: all 0.1s;
    }

    .close-btn:hover {
      background: var(--black);
      color: var(--yellow);
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 var(--black);
    }

    .m-cat {
      display: inline-block;
      padding: 4px 14px;
      font-weight: 900;
      color: var(--black);
      font-size: 0.9rem;
      margin-bottom: 14px;
      border: var(--border);
      box-shadow: 3px 3px 0 var(--black);
    }

    .m-title {
      font-size: clamp(1.5rem, 3.5vw, 2.1rem);
      font-weight: 900;
      margin-bottom: 18px;
      line-height: 1.25;
      padding-right: 44px;
    }

    .m-desc {
      font-size: 1.05rem;
      line-height: 1.75;
      margin-bottom: 22px;
      border: var(--border);
      background: var(--bg);
      padding: 20px;
      font-weight: 600;
      box-shadow: 4px 4px 0 var(--black);
    }

    .tag-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 24px;
    }

    .tag {
      border: var(--border);
      background: var(--white);
      padding: 6px 14px;
      font-weight: 900;
      font-size: 0.88rem;
      cursor: pointer;
      box-shadow: 3px 3px 0 var(--black);
      transition: 0.1s;
    }

    .tag:hover {
      background: var(--yellow);
      transform: translate(-2px, -2px);
      box-shadow: 5px 5px 0 var(--black);
    }

    .related-section {
      margin-bottom: 24px;
      padding-top: 18px;
      border-top: 3px solid var(--black);
    }

    .related-title {
      font-size: 0.95rem;
      font-weight: 900;
      margin-bottom: 10px;
    }

    .related-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .related-chip {
      background: #ffeaa7;
      border: 2px solid var(--black);
      padding: 6px 12px;
      font-size: 0.85rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 3px 3px 0 var(--black);
      transition: 0.1s;
    }

    .related-chip:hover {
      background: var(--cyan);
      transform: translate(-2px, -2px);
      box-shadow: 4px 4px 0 var(--black);
    }

    .btn-group {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }

    .p-btn {
      flex: 1;
      min-width: 180px;
      padding: 14px;
      text-align: center;
      text-decoration: none;
      color: var(--black);
      font-weight: 900;
      font-size: 1rem;
      border: var(--border-thick);
      transition: 0.1s;
    }

    .btn-w { background: var(--yellow); box-shadow: 4px 4px 0 var(--black); }
    .btn-g { background: var(--cyan); box-shadow: 4px 4px 0 var(--black); }

    .p-btn:hover {
      transform: translate(-3px, -3px);
      box-shadow: 7px 7px 0 var(--black);
      background: var(--black);
      color: var(--white);
    }

    footer {
      padding: 30px 0;
      color: var(--white);
      background: var(--black);
      font-size: 0.9rem;
      font-weight: 800;
      text-align: center;
      border-top: var(--border-thick);
      margin-top: auto;
    }

    @media (max-width: 768px) {
      .hero { padding: 36px 0 32px; }
      .modal-content { padding: 24px 20px; }
      .search-group { width: 100%; justify-content: flex-start; }
      .search-wrap { max-width: none; }
    }
  </style>
</head>
<body>

  <!-- 상단 고정 바 (portfolio_main 통일) -->
  <div class="fixed-top-bar">
    <div class="current-time" id="currentTimeDisplay">--:--:--</div>
    <div class="icon-group">
      <a href="index.html" class="icon-btn" title="포트폴리오 메인으로">

      </a>

      { id: 'war', name: '전쟁사 (WAR)', color: 'var(--cat-war)', textColor: '#111111' }
    ];

    let apiEnabled = true;
    let currentViewMode = 'all';
    let currentEraFilter = 'all';
    let sortAscending = true;
    let currentWikiResults = [];
    let activeSearchRequestId = 0;
    const wikiCache = new Map();

    // 연도 문자열을 정렬 가능한 숫자로 변환
    function parseYearValue(yearStr) {
      if (!yearStr) return 999999;
      const str = String(yearStr).trim();
      const bcMatch = str.match(/(?:BC|기원전)\s*(\d+)/i);
      if (bcMatch) return -parseInt(bcMatch[1], 10);
      const adMatch = str.match(/(-?\d+)/);
      if (adMatch) return parseInt(adMatch[1], 10);
      return 999999;
    }

    function matchesEra(yearStr, era) {
      if (era === 'all') return true;
      const y = parseYearValue(yearStr);
      if (y === 999999) return true;
      if (era === 'ancient') return y <= 500;
      if (era === 'medieval') return y > 500 && y <= 1800;
      if (era === 'modern') return y > 1800;
      return true;
    }

    function sortEvents(list) {
      return [...list].sort((a, b) => {
        const ya = parseYearValue(a.year);
        const yb = parseYearValue(b.year);
        return sortAscending ? ya - yb : yb - ya;
      });
    }

    function getFilteredEvents() {
      const q = document.getElementById('searchBox').value.trim().toLowerCase();
      let localMatched = coreData;

      if (q) {
        localMatched = coreData.filter(ev =>
          ev.title.toLowerCase().includes(q) ||
          ev.summary.toLowerCase().includes(q) ||
          ev.desc.toLowerCase().includes(q) ||
          ev.year.toLowerCase().includes(q) ||
          ev.keywords.some(k => k.toLowerCase().includes(q))
        );
      }

      const combined = apiEnabled && q.length >= 2
        ? [...localMatched, ...currentWikiResults]
        : localMatched;

      const eraFiltered = combined.filter(ev => matchesEra(ev.year, currentEraFilter));
      return sortEvents(eraFiltered);
    }

    function renderBoard() {
      const main = document.getElementById('mainBoard');
      const dataToRender = getFilteredEvents();
      main.innerHTML = '';

      const visibleCount = currentViewMode === 'all'
        ? dataToRender.length
        : dataToRender.filter(ev => ev.category === currentViewMode).length;
      document.getElementById('resultCountBadge').textContent = `총 ${visibleCount}건`;

      if (currentViewMode === 'all') {
        const boardDiv = document.createElement('div');
        boardDiv.className = 'board-multi';

        lanesInfo.forEach(info => {
          const laneEvents = dataToRender.filter(ev => ev.category === info.id);

          const section = document.createElement('section');
          section.className = 'lane-section';

          const topBar = document.createElement('div');
          topBar.className = 'lane-top-bar';
          topBar.innerHTML = `
            <div class="lane-header ${info.id}">
              <span>${info.name}</span>
              <span class="lane-count">${laneEvents.length}건</span>
            </div>
            <div class="lane-scroll-btns">
              <button type="button" class="scroll-arrow" data-dir="-1" aria-label="${info.name} 이전으로 스크롤">&larr;</button>
              <button type="button" class="scroll-arrow" data-dir="1" aria-label="${info.name} 다음으로 스크롤">&rarr;</button>
            </div>
          `;

          const lane = document.createElement('div');
          lane.className = 'lane';
          lane.id = 'lane-' + info.id;

          const axis = document.createElement('div');
          axis.className = 'timeline-axis';
          lane.appendChild(axis);

          if (laneEvents.length === 0) {
            const empty = document.createElement('div');
            empty.className = 'lane-empty';
            empty.textContent = '조건에 일치하는 사건이 없습니다.';
            lane.appendChild(empty);
          } else {
            laneEvents.forEach(ev => {
              lane.appendChild(createCardElement(ev));
            });
          }

          // 좌우 스크롤 버튼 및 세로 휠 가로 이동 지원
          topBar.querySelectorAll('.scroll-arrow').forEach(btn => {
            btn.addEventListener('click', () => {
              const dir = Number(btn.dataset.dir);
              lane.scrollBy({ left: dir * 560, behavior: 'smooth' });
            });
          });

          lane.addEventListener('wheel', (e) => {
            if (Math.abs(e.deltaY) > Math.abs(e.deltaX) && lane.scrollWidth > lane.clientWidth) {
              e.preventDefault();
              lane.scrollLeft += e.deltaY;
            }
          }, { passive: false });

          section.appendChild(topBar);
          section.appendChild(lane);
          boardDiv.appendChild(section);
        });

        main.appendChild(boardDiv);
      } else {
        const boardDiv = document.createElement('div');
        boardDiv.className = 'board-single';

        const filtered = dataToRender.filter(ev => ev.category === currentViewMode);
        if (filtered.length === 0) {
          boardDiv.innerHTML = `
            <div style="grid-column: 1/-1; text-align:center; padding: 48px 20px; background: var(--white); border: var(--border-thick); box-shadow: 6px 6px 0 var(--black); font-weight: 900; font-size: 1.1rem;">
              선택한 조건에 일치하는 역사 사건이 없습니다.
            </div>`;
        } else {
          filtered.forEach(ev => {
            boardDiv.appendChild(createCardElement(ev));
          });
        }
        main.appendChild(boardDiv);
      }
    }

    function createCardElement(ev) {
      const card = document.createElement('article');
      card.className = `event-card cat-${ev.category}`;
      card.setAttribute('tabindex', '0');
      card.setAttribute('role', 'button');
      card.onclick = () => openModal(ev);
      card.onkeydown = (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          openModal(ev);
        }
      };

      const badge = ev.isApi ? '<span class="wiki-badge">위키백과</span>' : '';
      const keywordsHtml = (ev.keywords || [])
        .slice(0, 3)
        .map(k => `<span class="mini-tag">#${k}</span>`)
        .join('');

      card.innerHTML = `
        <div class="card-top-bar">
          <div class="card-dots">
            <span class="card-dot"></span>
            <span class="card-dot"></span>
            <span class="card-dot"></span>
          </div>
          <span style="font-size:0.75rem; font-weight:900;">${ev.year}</span>
        </div>
        <div class="card-body">
          <div class="card-meta-row">
            <span class="e-year">${ev.year}</span>
            ${badge}
          </div>
          <h3 class="e-title">${ev.title}</h3>
          <p class="e-summary">${ev.summary}</p>
          <div class="card-keywords">${keywordsHtml}</div>
        </div>
      `;
      return card;
    }

    async function fetchWikipediaData(query) {
      if (!query || query.length < 2) return [];
      if (wikiCache.has(query)) {
        return wikiCache.get(query);
      }

      const url = `https://ko.wikipedia.org/w/api.php?action=query&format=json&prop=extracts&exintro=1&explaintext=1&generator=search&gsrsearch=${encodeURIComponent(query)}&gsrlimit=8&origin=*`;
      const response = await fetch(url);
      const data = await response.json();

      if (!data.query || !data.query.pages) {
        wikiCache.set(query, []);
        return [];
      }

      const newEvents = [];
      Object.values(data.query.pages).forEach(page => {
        const extract = (page.extract || '').trim();
        if (!extract || extract.includes('동음이의어 문서')) return;

        const bcYearMatch = extract.match(/(기원전\s*\d{1,4})년/);
        const adYearMatch = extract.match(/(\d{1,4})년/);
        let yearStr = '연도 미상';
        if (bcYearMatch) {
          yearStr = 'BC ' + bcYearMatch[1].replace(/[^0-9]/g, '');
        } else if (adYearMatch) {
          yearStr = adYearMatch[1];
        }

        let cat = 'world';
        const combinedText = page.title + ' ' + extract;
        if (/한국|조선|고려|신라|백제|고구려|발해|대한제국/.test(combinedText)) cat = 'korea';
        else if (/전쟁|전투|대첩|해전|공세|항쟁/.test(combinedText)) cat = 'war';
        else if (/유럽|로마|프랑스|영국|미국|그리스|독일|러시아/.test(combinedText)) cat = 'west';

        newEvents.push({
          category: cat,
          year: yearStr,
          title: page.title,
          summary: extract.length > 90 ? extract.substring(0, 90) + '...' : extract,
          desc: extract,
          keywords: [query, '위키백과'],
          isApi: true
        });
      });

      wikiCache.set(query, newEvents);
      return newEvents;
    }

    // 탭 전환
    document.querySelectorAll('#viewTabs .tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#viewTabs .tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentViewMode = btn.dataset.view;
        renderBoard();
      });
    });

    // 시대 필터
    document.querySelectorAll('#eraFilters .era-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        document.querySelectorAll('#eraFilters .era-chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        currentEraFilter = chip.dataset.era;
        renderBoard();
      });
    });

    // 정렬 순서 토글
    document.getElementById('sortToggleBtn').addEventListener('click', function () {
      sortAscending = !sortAscending;
      this.textContent = sortAscending ? '연대순 ↑' : '최신순 ↓';
      renderBoard();
    });

    // 위키 확장 토글
    document.getElementById('apiToggle').addEventListener('click', function () {
      apiEnabled = !apiEnabled;
      this.classList.toggle('active', apiEnabled);
      this.textContent = apiEnabled ? '위키 확장 ON' : '위키 확장 OFF';

      const q = document.getElementById('searchBox').value.trim();
      if (apiEnabled && q.length >= 2) {
        triggerSearch(q);
      } else {
        currentWikiResults = [];
        document.getElementById('status-text').textContent = apiEnabled
          ? '검색어 입력 시 기본 DB와 위키백과 자료를 함께 탐색합니다.'
          : '기본 탑재 역사 데이터베이스 전용 모드입니다.';
        renderBoard();
      }
    });

    // 검색 처리
    let searchTimer = null;
    const searchBox = document.getElementById('searchBox');
    const clearSearchBtn = document.getElementById('clearSearchBtn');

    function triggerSearch(q) {
      clearTimeout(searchTimer);
      clearSearchBtn.classList.toggle('visible', q.length > 0);
      const reqId = ++activeSearchRequestId;

      if (!q) {
        currentWikiResults = [];
        document.getElementById('status-text').textContent = '기본 역사 데이터베이스 전체 목록을 표시하고 있습니다.';
        renderBoard();
        return;
      }

      currentWikiResults = [];
      renderBoard();

      if (apiEnabled && q.length >= 2) {
        document.getElementById('status-text').textContent = `'${q}' 관련 위키백과 문서를 함께 조회하는 중...`;
        searchTimer = setTimeout(async () => {
          try {
            const apiData = await fetchWikipediaData(q);
            if (reqId !== activeSearchRequestId) return;
            currentWikiResults = apiData;
            document.getElementById('status-text').textContent = apiData.length > 0
              ? `'${q}' 검색 완료 (위키백과 자료 ${apiData.length}건 포함)`
              : `'${q}' 기본 DB 검색 결과입니다.`;
            renderBoard();
          } catch (err) {
            if (reqId !== activeSearchRequestId) return;
            console.error(err);
            document.getElementById('status-text').textContent = '외부 문서를 불러오지 못해 기본 DB 결과만 표시합니다.';
          }
        }, 450);
      } else {
        document.getElementById('status-text').textContent = `'${q}' 기본 역사 데이터베이스 검색 결과입니다.`;
      }
    }

    searchBox.addEventListener('input', (e) => {
      triggerSearch(e.target.value.trim());
    });

    clearSearchBtn.addEventListener('click', () => {
      searchBox.value = '';
      triggerSearch('');
      searchBox.focus();
    });

    // 랜덤 역사 사건
    document.getElementById('randomEventBtn').addEventListener('click', () => {
      const pool = getFilteredEvents();
      const targetPool = pool.length > 0 ? pool : coreData;
      const randomEv = targetPool[Math.floor(Math.random() * targetPool.length)];
      openModal(randomEv);
    });

    // 모달 열기 및 연관 사건 연결
    function openModal(ev) {
      const catInfo = lanesInfo.find(c => c.id === ev.category) || lanesInfo[0];
      const mCat = document.getElementById('mCat');
      mCat.textContent = catInfo.name;
      mCat.style.background = catInfo.color;
      mCat.style.color = catInfo.textColor;

      document.getElementById('mTitle').textContent = `${ev.year} · ${ev.title}`;
      document.getElementById('mDesc').textContent = ev.desc;

      const tagsWrap = document.getElementById('mTags');
      tagsWrap.innerHTML = '';
      (ev.keywords || []).forEach(k => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'tag';
        b.textContent = '#' + k;
        b.onclick = () => {
          searchBox.value = k;
          triggerSearch(k);
          closeModal();
        };
        tagsWrap.appendChild(b);
      });

      // 연관 사건 찾기 (키워드 겹침 또는 같은 카테고리 인접 연도)
      const relatedSection = document.getElementById('relatedSection');
      const relatedList = document.getElementById('relatedList');
      relatedList.innerHTML = '';

      const evYear = parseYearValue(ev.year);
      const relatedEvents = coreData
        .filter(item => item.title !== ev.title)
        .map(item => {
          const sharedKeywords = (item.keywords || []).filter(k => (ev.keywords || []).includes(k)).length;
          const sameCat = item.category === ev.category ? 1 : 0;
          const yearDiff = Math.abs(parseYearValue(item.year) - evYear);
          return { item, score: sharedKeywords * 10 + sameCat * 2 - Math.min(yearDiff / 500, 2) };
        })
        .filter(entry => entry.score > 1)
        .sort((a, b) => b.score - a.score)
        .slice(0, 4);

      if (relatedEvents.length > 0) {
        relatedSection.style.display = 'block';
        relatedEvents.forEach(({ item }) => {
          const chip = document.createElement('button');
          chip.type = 'button';
          chip.className = 'related-chip';
          chip.textContent = `${item.year} · ${item.title}`;
          chip.onclick = () => openModal(item);
          relatedList.appendChild(chip);
        });
      } else {
        relatedSection.style.display = 'none';
      }

      const encodedTitle = encodeURIComponent(ev.title);
      document.getElementById('mWiki').href = `https://ko.wikipedia.org/wiki/${encodedTitle}`;
      document.getElementById('mGoogle').href = `https://www.google.com/search?q=${encodedTitle}`;

      document.getElementById('modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('modal').style.display = 'none';
    }

    document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
    window.addEventListener('click', (e) => {
      if (e.target === document.getElementById('modal')) closeModal();
    });
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && document.getElementById('modal').style.display === 'flex') {
        closeModal();
      }
    });

    renderBoard();
  </script>
</body>
</html>
