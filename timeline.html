<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHRONOS: Brutal History DB Explorer</title>
    <style>
        /* Neo-Brutalism Variables */
        :root {
            --bg: #121212;
            --surface: #000000;
            --border: #FFFFFF;
            --text: #FFFFFF;
            
            --cat-korea: #FF3366;
            --cat-west: #33CCFF;
            --cat-world: #00FF66;
            --cat-war: #FF9900;
            
            --brutal-b: 4px solid var(--border);
            --brutal-s: 8px 8px 0px rgba(255,255,255,0.2);
            --brutal-s-hover: 12px 12px 0px #FFF;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
        body { background: var(--bg); color: var(--text); overflow: hidden; height: 100vh; display: flex; flex-direction: column; background-image: radial-gradient(#444 1px, transparent 1px); background-size: 24px 24px; }
        
        /* Header */
        header { background: var(--surface); border-bottom: var(--brutal-b); padding: 1.5rem; display: flex; justify-content: space-between; align-items: center; z-index: 20; }
        .brand h1 { font-size: 2.2rem; font-weight: 900; text-transform: uppercase; letter-spacing: -2px; text-shadow: 4px 4px 0px var(--cat-korea); margin-bottom: 5px; }
        .brand p { color: var(--cat-world); font-weight: bold; font-size: 1rem; }
        
        .controls { display: flex; gap: 1rem; align-items: center; }
        
        /* Wiki API Toggle */
        .api-toggle-btn {
            background: #E5E5E5; color: #000; border: var(--brutal-b); padding: 10px 15px; font-weight: 900; cursor: pointer; box-shadow: 4px 4px 0px #FFF; transition: 0.2s;
        }
        .api-toggle-btn.active { background: #FF3366; color: #FFF; }
        
        .search-input { background: #000; border: var(--brutal-b); color: #FFF; padding: 12px; font-size: 1.1rem; width: 300px; font-weight: bold; box-shadow: 4px 4px 0px var(--cat-west); outline: none; }
        .search-input:focus { transform: translate(-2px, -2px); box-shadow: 6px 6px 0px var(--cat-west); }
        
        /* Layout */
        main { flex: 1; display: flex; overflow-x: auto; overflow-y: auto; padding: 2rem; gap: 2.5rem; flex-direction: column; }
        
        /* Lanes */
        .lane { position: relative; min-height: 200px; background: rgba(0,0,0,0.8); border: var(--brutal-b); min-width: 100%; box-shadow: var(--brutal-s); display: flex; align-items: center; padding: 0 20px; gap: 20px; overflow-x: auto; }
        .lane-header { position: absolute; left: -4px; top: -20px; padding: 5px 20px; font-size: 1.2rem; font-weight: 900; color: #000; border: var(--brutal-b); z-index: 10; box-shadow: 4px 4px 0px #FFF; }
        
        #lane-korea .lane-header { background: var(--cat-korea); }
        #lane-west .lane-header { background: var(--cat-west); }
        #lane-world .lane-header { background: var(--cat-world); }
        #lane-war .lane-header { background: var(--cat-war); }
        
        .timeline-axis { position: absolute; left: 0; right: 0; top: 50%; height: 4px; background: #FFF; z-index: 1; }
        
        /* Card */
        .event-card { position: relative; z-index: 5; background: #000; border: var(--brutal-b); min-width: 250px; width: 250px; padding: 15px; cursor: pointer; transition: 0.2s; box-shadow: 6px 6px 0px #FFF; }
        .event-card:hover { transform: translateY(-10px); z-index: 15; }
        #lane-korea .event-card:hover { box-shadow: 10px 10px 0px var(--cat-korea); }
        #lane-west .event-card:hover { box-shadow: 10px 10px 0px var(--cat-west); }
        #lane-world .event-card:hover { box-shadow: 10px 10px 0px var(--cat-world); }
        #lane-war .event-card:hover { box-shadow: 10px 10px 0px var(--cat-war); }
        
        .e-year { display: inline-block; background: #FFF; color: #000; padding: 3px 8px; font-weight: 900; font-size: 0.9rem; margin-bottom: 10px; }
        .e-title { font-size: 1.2rem; font-weight: 900; line-height: 1.3; margin-bottom: 8px; }
        .e-summary { font-size: 0.85rem; color: #AAA; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        
        .api-badge { background: #FF9900; color: #000; padding: 2px 5px; font-size: 0.7rem; font-weight: 900; float: right; }

        /* Modal */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); justify-content: center; align-items: center; z-index: 100; padding: 1rem; }
        .modal-content { background: #000; border: 4px solid #FFF; padding: 3rem; max-width: 800px; width: 100%; position: relative; max-height: 90vh; overflow-y: auto; box-shadow: 15px 15px 0px var(--cat-world); }
        .close-btn { position: absolute; top: 1.5rem; right: 2rem; font-size: 3rem; font-weight: 900; cursor: pointer; color: #FFF; line-height: 1; }
        .close-btn:hover { color: var(--cat-korea); }
        
        .m-cat { display: inline-block; padding: 5px 15px; font-weight: 900; color: #000; font-size: 1.1rem; margin-bottom: 15px; }
        .m-title { font-size: 2.5rem; font-weight: 900; margin-bottom: 15px; line-height: 1.2; }
        .m-desc { font-size: 1.2rem; line-height: 1.8; margin-bottom: 25px; padding-left: 20px; border-left: 6px solid #FFF; background: rgba(255,255,255,0.05); padding: 20px; }
        .tag-wrap { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 30px; }
        .tag { border: 2px solid #FFF; padding: 5px 12px; font-weight: bold; cursor: pointer; }
        .tag:hover { background: #FFF; color: #000; }
        
        .btn-group { display: flex; gap: 15px; }
        .p-btn { flex: 1; padding: 15px; text-align: center; text-decoration: none; color: #000; font-weight: 900; font-size: 1.1rem; border: 2px solid #000; transition: 0.2s; }
        .btn-g { background: #4285F4; color: #FFF; box-shadow: 5px 5px 0px #FFF; }
        .btn-w { background: #E5E5E5; box-shadow: 5px 5px 0px #FFF; }
        .p-btn:hover { transform: translate(-3px, -3px); box-shadow: 8px 8px 0px #FFF; }

        /* Status Bar */
        .status-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--cat-world); color: #000; padding: 8px 20px; font-weight: 900; font-size: 0.9rem; z-index: 50; display: flex; justify-content: space-between; border-top: var(--brutal-b); }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <h1>CHRONOS: BRUTAL DB</h1>
            <p>자체 탑재 200+ Core Database & Live Wikipedia 연동</p>
        </div>
        <div class="controls">
            <button id="apiToggle" class="api-toggle-btn active">🌐 LIVE WIKI 연동 ON</button>
            <input type="text" id="searchBox" class="search-input" placeholder="사건명, 인물, 키워드 검색...">
        </div>
    </header>

    <main id="mainBoard">
        <!-- 동적으로 랜더링 됨 -->
    </main>

    <div class="status-bar">
        <span id="status-text">SYSTEM READY | 내장 데이터와 위키백과를 동시에 스캔합니다.</span>
        <span>Made with Neo-Brutalism</span>
    </div>

    <!-- Modal -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div class="m-cat" id="mCat">CATEGORY</div>
            <h2 class="m-title" id="mTitle">TITLE</h2>
            <div class="m-desc" id="mDesc">DESC</div>
            <div class="tag-wrap" id="mTags"></div>
            <div class="btn-group">
                <a href="#" target="_blank" class="p-btn btn-w" id="mWiki">📖 위키백과 읽기</a>
                <a href="#" target="_blank" class="p-btn btn-g" id="mGoogle">🔍 구글 검색</a>
            </div>
        </div>
    </div>

    <script>
        // 1. 내장 Core Data (Python에서 주입됨)

양 전쟁의 판도 변화", "desc": "미 해군이 암호 해독을 통해 일본 항공모함 4척을 격침시키며 방어에서 공세로 전환한 해전.", "keywords": ["미드웨이", "항공모함", "태평양전쟁"]}, {"category": "war", "year": "1942", "title": "스탈린그라드 전투", "summary": "나치 독일군의 파멸적 패배", "desc": "독일 제6군이 스탈린그라드 시가전 중 소련군에 완전히 포위되어 항복하며 독소전쟁의 전세가 뒤집힘.", "keywords": ["스탈린그라드", "독소전쟁", "시가전"]}, {"category": "war", "year": "1950", "title": "인천 상륙 작전", "summary": "한국전쟁 전세 역전의 명장면", "desc": "맥아더 장군의 지휘로 조수간만의 차를 극복하고 후방을 기습해 북한군의 병참선을 끊어냄.", "keywords": ["인천상륙작전", "맥아더", "한국전쟁"]}, {"category": "war", "year": "1968", "title": "테트 공세(구정 공세)", "summary": "베트남 전쟁의 심리적 전환", "desc": "북베트남과 베트콩이 명절을 기해 동시다발적 기습을 감행, 미국 내 반전 여론을 들끓게 만듦.", "keywords": ["테트공세", "베트남전쟁", "베트콩"]}];
        
        let apiEnabled = true;
        document.getElementById('apiToggle').onclick = function() {
            apiEnabled = !apiEnabled;
            this.classList.toggle('active');
            this.innerText = apiEnabled ? '🌐 LIVE WIKI 연동 ON' : '📴 LIVE WIKI 연동 OFF';
            document.getElementById('status-text').innerText = apiEnabled ? '외부 DB(Wikipedia API) 실시간 검색 기능이 활성화되었습니다.' : '내장 코어 DB 전용 모드로 전환되었습니다.';
        };

        // 카테고리 정의
        const lanesInfo = [
            { id: 'korea', name: '🇰🇷 한국사 (KOREA)', color: 'var(--cat-korea)' },
            { id: 'west', name: '🏛️ 서양사 (WEST)', color: 'var(--cat-west)' },
            { id: 'world', name: '🌍 세계사 (WORLD)', color: 'var(--cat-world)' },
            { id: 'war', name: '⚔️ 전쟁사 (WAR)', color: 'var(--cat-war)' }
        ];

        // 메인 렌더러
        function renderBoard(dataToRender) {
            const main = document.getElementById('mainBoard');
            main.innerHTML = '';

            // 레인 생성
            const lanes = {};
            lanesInfo.forEach(info => {
                const lane = document.createElement('div');
                lane.className = 'lane';
                lane.id = 'lane-' + info.id;
                lane.innerHTML = `<div class="lane-header">${info.name}</div><div class="timeline-axis"></div>`;
                lanes[info.id] = lane;
                main.appendChild(lane);
            });

            // 카드 부착
            dataToRender.forEach(ev => {
                const card = document.createElement('div');
                card.className = 'event-card';
                card.onclick = () => openModal(ev);
                
                let badge = ev.isApi ? '<span class="api-badge">WIKI</span>' : '';
                
                card.innerHTML = `
                    <span class="e-year">${ev.year}</span> ${badge}
                    <h4 class="e-title">${ev.title}</h4>
                    <p class="e-summary">${ev.summary}</p>
                `;
                
                if(lanes[ev.category]) {
                    lanes[ev.category].appendChild(card);
                }
            });
        }

        // 위키백과 API 호출 로직 (Live Sync)
        async function fetchWikipediaData(query) {
            if (!query || query.length < 2) return [];
            try {
                document.getElementById('status-text').innerText = `📡 위키백과 DB에서 '${query}' 실시간 스캔 중...`;
                
                const url = `https://ko.wikipedia.org/w/api.php?action=query&format=json&prop=extracts&exintro=1&explaintext=1&generator=search&gsrsearch=${encodeURIComponent(query)}&gsrlimit=10&origin=*`;
                const response = await fetch(url);
                const data = await response.json();
                
                if (!data.query || !data.query.pages) {
                    document.getElementById('status-text').innerText = `✅ WIKI 스캔 완료 (결과 없음)`;
                    return [];
                }

                const newEvents = [];
                Object.values(data.query.pages).forEach(page => {
                    // 연도 파싱 (정규식: ~년)
                    const yearMatch = page.extract ? page.extract.match(/([가-힣\s]*\d{1,4})년/) : null;
                    const yearStr = yearMatch ? yearMatch[1].trim() + '년' : '연도 미상';
                    
                    // 카테고리 자동 분류 알고리즘
                    let cat = 'world';
                    const t = page.title + (page.extract||'');
                    if (t.includes('한국') || t.includes('조선') || t.includes('고려') || t.includes('신라') || t.includes('백제')) cat = 'korea';
                    else if (t.includes('전쟁') || t.includes('전투') || t.includes('대첩')) cat = 'war';
                    else if (t.includes('유럽') || t.includes('로마') || t.includes('프랑스') || t.includes('영국') || t.includes('미국')) cat = 'west';

                    newEvents.push({
                        category: cat,
                        year: yearStr,
                        title: page.title,
                        summary: page.extract ? page.extract.substring(0, 80) + '...' : '설명 없음',
                        desc: page.extract || '위키백과 본문이 없습니다.',
                        keywords: [query, "위키백과", "LiveDB"],
                        isApi: true
                    });
                });
                
                document.getElementById('status-text').innerText = `✅ WIKI 스캔 완료 (${newEvents.length}건 추가됨)`;
                return newEvents;
            } catch (error) {
                document.getElementById('status-text').innerText = `⚠️ API 연동 에러 발생`;
                console.error(error);
                return [];
            }
        }

        // 디바운스 검색 처리기
        let timeout = null;
        document.getElementById('searchBox').addEventListener('input', (e) => {
            clearTimeout(timeout);
            const q = e.target.value.trim();
            
            // 1차: 로컬 필터링 즉시 렌더
            let localMatched = coreData;
            if(q) {
                localMatched = coreData.filter(ev => 
                    ev.title.includes(q) || ev.desc.includes(q) || ev.keywords.some(k => k.includes(q))
                );
            }
            renderBoard(localMatched);

            // 2차: Live API 딜레이 호출 (API 켜져있고 검색어가 있을 때)
            if (apiEnabled && q.length >= 2) {
                timeout = setTimeout(async () => {
                    const apiData = await fetchWikipediaData(q);
                    // 로컬결과 + 위키결과 합치기
                    if(apiData.length > 0) {
                        renderBoard([...localMatched, ...apiData]);
                    }
                }, 600); // 0.6초 딜레이
            } else if (!q) {
                document.getElementById('status-text').innerText = 'SYSTEM READY | 전체 코어 데이터 표시 중';
            }
        });

        // 모달 제어
        function openModal(ev) {
            const catInfo = lanesInfo.find(c => c.id === ev.category);
            document.getElementById('mCat').innerText = catInfo.name;
            document.getElementById('mCat').style.background = catInfo.color;
            document.getElementById('mTitle').innerText = `${ev.year} : ${ev.title}`;
            document.getElementById('mDesc').innerText = ev.desc;
            
            const tags = document.getElementById('mTags');
            tags.innerHTML = '';
            ev.keywords.forEach(k => {
                const b = document.createElement('button');
                b.className = 'tag';
                b.innerText = '#' + k;
                b.onclick = () => {
                    document.getElementById('searchBox').value = k;
                    document.getElementById('searchBox').dispatchEvent(new Event('input'));
                    closeModal();
                };
                tags.appendChild(b);
            });

            const q = encodeURIComponent(ev.title);
            document.getElementById('mWiki').href = `https://ko.wikipedia.org/wiki/${q}`;
            document.getElementById('mGoogle').href = `https://www.google.com/search?q=${q}`;
            
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        window.onclick = function(e) {
            if(e.target === document.getElementById('modal')) closeModal();
        }

        // 초기 랜더링
        window.onload = () => renderBoard(coreData);

    </script>
</body>
</html>
