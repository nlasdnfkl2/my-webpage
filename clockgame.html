<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>문태양 - 초등학교 저학년 시계 읽기 연습 앱</title>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css');
    
    :root {
      --bg: #fdfbf7;
      --black: #111111;
      --border: 3px solid var(--black);
      --border-thick: 4px solid var(--black);
      
      --yellow: #ffd83b;
      --red: #ff4757;
      --blue: #3e51ff;
      --green: #2ed573;
      --pink: #ff9ff3;
      --cyan: #48dbfb;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background: var(--bg); 
      color: var(--black); 
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      position: relative;
      padding-top: 70px;
    }
    
    .fixed-top-bar {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 60px;
      background: var(--yellow);
      border-bottom: var(--border-thick);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 24px;
      z-index: 2000;
      box-shadow: 0 4px 0 var(--black);
    }

    .fixed-top-bar .current-time {
      font-weight: 900;
      font-size: 0.95rem;
      background: white;
      border: var(--border);
      padding: 4px 10px;
      box-shadow: 2px 2px 0 var(--black);
    }

    .fixed-top-bar .icon-group {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .fixed-top-bar .icon-btn {
      width: 38px; height: 38px;
      background: white;
      border: var(--border);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 3px 3px 0 var(--black);
      cursor: pointer;
      font-weight: 900; font-size: 0.9rem;
      transition: all 0.1s ease;
      text-decoration: none;
      color: var(--black);
      position: relative;
    }

    .fixed-top-bar .icon-btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 5px 5px 0 var(--black);
      background: var(--cyan);
    }

    .wrap { max-width: 900px; margin: 0 auto; padding: 0 24px 80px; }
    a { color: inherit; text-decoration: none; }
    
    .top {
      display: flex; justify-content: space-between; align-items: baseline;
      padding: 24px 0; 
      border-bottom: var(--border-thick);
      font-size: 1rem; font-weight: 800;
    }
    .top b { 
      font-size: 1.4rem; 
      letter-spacing: 0.05em; 
      text-transform: uppercase; 
      background: var(--black); 
      color: var(--yellow);
      padding: 4px 12px;
      transform: skew(-5deg);
    }
    .top nav { display: flex; gap: 24px; }
    .top nav a { position: relative; padding: 4px 8px; }
    .top nav a:hover { background: var(--black); color: var(--bg); }

    .hero { padding: 60px 0 40px; border-bottom: var(--border-thick); }
    .hero .small { 
      display: inline-block; font-size: 1rem; font-weight: 800; 
      background: var(--cyan); border: var(--border); padding: 4px 12px;
      box-shadow: 4px 4px 0 var(--black); margin-bottom: 20px;
    }
    .hero h1 {
      font-size: clamp(2rem, 5vw, 3.5rem);
      line-height: 1.2; font-weight: 900;
    }
    .hero h1 span { 
      display: inline-block;
      color: var(--black); 
      background: var(--yellow);
      border: var(--border-thick);
      padding: 0 16px;
      box-shadow: 6px 6px 0 var(--black);
    }
    .hero p { 
      max-width: 38em; margin-top: 20px; font-size: 1.05rem; font-weight: 600;
      border-left: 6px solid var(--black); padding-left: 20px;
    }

    .game-card {
      background: white;
      border: var(--border-thick);
      box-shadow: 8px 8px 0 var(--black);
      padding: 40px;
      margin-top: 48px;
    }

    .screen { display: none; }
    .screen.active { display: block; }

    .start-screen h2 { font-size: 1.8rem; font-weight: 900; margin-bottom: 16px; }
    .setting-group {
      margin-bottom: 20px;
      background: #f9f6ef;
      border: var(--border);
      padding: 16px;
      box-shadow: 4px 4px 0 var(--black);
    }
    .setting-group label { display: block; font-weight: 900; margin-bottom: 8px; }
    .setting-options { display: flex; gap: 12px; flex-wrap: wrap; }
    
    .option-chip {
      padding: 8px 16px;
      background: white;
      border: var(--border);
      font-weight: 900;
      cursor: pointer;
      box-shadow: 2px 2px 0 var(--black);
      transition: all 0.1s;
    }
    .option-chip.selected {
      background: var(--yellow);
      transform: translate(-2px, -2px);
      box-shadow: 4px 4px 0 var(--black);
    }

    .btn {
      font-family: inherit;
      font-size: 1.1rem;
      font-weight: 900;
      padding: 14px 28px;
      background: var(--yellow);
      border: var(--border);
      box-shadow: 4px 4px 0 var(--black);
      cursor: pointer;
      transition: all 0.1s;
    }
    .btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0 var(--black);
      background: var(--cyan);
    }
    .btn-green { background: var(--green); }
    .btn-red { background: var(--red); color: white; }

    /* 아날로그 시계 스타일 */
    .clock-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 30px;
    }

    .analog-clock {
      width: 220px;
      height: 220px;
      background: white;
      border: 6px solid var(--black);
      border-radius: 50%;
      position: relative;
      box-shadow: 6px 6px 0 var(--black);
      margin-bottom: 20px;
    }

    .clock-number {
      position: absolute;
      width: 30px;
      height: 30px;
      text-align: center;
      line-height: 30px;
      font-weight: 900;
      font-size: 1.1rem;
    }

    /* 시계 바늘 */
    .hand {
      position: absolute;
      bottom: 50%;
      left: 50%;
      transform-origin: bottom center;
      border-radius: 4px;
    }
    .hour-hand {
      width: 6px;
      height: 55px;
      background: var(--black);
      transform: translateX(-50%) rotate(0deg);
      z-index: 2;
    }
    .minute-hand {
      width: 4px;
      height: 75px;
      background: var(--red);
      transform: translateX(-50%) rotate(0deg);
      z-index: 3;
    }
    .clock-center {
      position: absolute;
      top: 50%; left: 50%;
      width: 14px; height: 14px;
      background: var(--black);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      z-index: 4;
    }

    .game-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--pink);
      border: var(--border);
      padding: 12px 20px;
      font-weight: 900;
      font-size: 1.1rem;
      box-shadow: 4px 4px 0 var(--black);
      margin-bottom: 24px;
    }

    .answer-form {
      display: flex;
      gap: 12px;
      justify-content: center;
      align-items: center;
    }
    .answer-form input {
      width: 80px;
      padding: 12px;
      font-size: 1.2rem;
      font-weight: 900;
      border: var(--border-thick);
      box-shadow: 3px 3px 0 var(--black);
      text-align: center;
      background: white;
    }

    .feedback-box {
      margin-top: 16px;
      font-weight: 900;
      font-size: 1.1rem;
      text-align: center;
      min-height: 30px;
    }

    footer { 
      padding: 40px 0; color: white; background: var(--black);
      font-size: 1rem; font-weight: 800; text-align: center;
      border-top: var(--border-thick); margin-top: 80px;
    }
  </style>
</head>
<body>

<div class="fixed-top-bar">
  <div class="current-time" id="currentTimeDisplay">--:--:--</div>
  <div class="icon-group">
    <a href="https://github.com/nlasdnfkl2" target="_blank" rel="noopener noreferrer" class="icon-btn" title="GitHub">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"></path><path d="M9 18c-4.51 2-5-2-7-2"></path></svg>
    </a>
    <a href="mailto:nn80300@naver.com" class="icon-btn" title="Email">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"></rect><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></svg>
    </a>
    <a href="https://blog.naver.com/nn80300" target="_blank" rel="noopener noreferrer" class="icon-btn" title="Blog">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"></path><path d="M6 6h10"></path><path d="M6 10h10"></path></svg>
    </a>
    <div class="icon-btn music-wrap" id="muteToggleBtn" title="음소거 토글" style="cursor: pointer;">
      <svg id="soundOnIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
      <svg id="soundOffIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display: none;"><line x1="1" y1="1" x2="23" y2="23"></line><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
    </div>
  </div>
</div>

<div id="youtubePlayerContainer" style="display:none;"></div>

<div class="wrap">
  <div class="top">
    <b>문태양</b>
    <nav>
      <a href="#clockGame">실습 14 · 시계 읽기 연습 앱</a>
    </nav>
  </div>

  <header class="hero">
    <p class="small">실습 14 · 11주차 중급 데이터 학습 도구</p>
    <h1>초등학교 저학년 시계 읽기 연습 앱</h1>
    <p>분침의 이동 각도에 따라 시침이 연동되어 움직이는 아날로그 시계를 보고 시각을 올바르게 읽는 연습을 반복하는 수학 보조 교구 웹 앱입니다.</p>
  </header>

  <div class="game-card" id="clockGame">
    
    <!-- 1. 시작 화면 -->
    <div class="screen start-screen active" id="startScreen">
      <h2>난이도 선택</h2>
      
      <div class="setting-group">
        <label>시계 읽기 단계 선택</label>
        <div class="setting-options" id="levelOptions">
          <div class="option-chip selected" data-val="1">1단계: 정시 읽기</div>
          <div class="option-chip" data-val="2">2단계: 30분 단위</div>
          <div class="option-chip" data-val="3">3단계: 5분 단위</div>
          <div class="option-chip" data-val="4">4단계: 1분 단위</div>
        </div>
      </div>

      <button class="btn btn-green" id="startBtn">연습 시작하기</button>
    </div>

    <!-- 2. 게임 플레이 화면 -->
    <div class="screen play-screen" id="playScreen">
      <div class="game-header-bar">
        <div>맞힌 정답: <span id="correctCount">0</span>개</div>
        <div>시도한 문제: <span id="totalCount">0</span>개</div>
      </div>

      <div class="clock-container">
        <div class="analog-clock" id="analogClock">
          <div class="hand hour-hand" id="hourHand"></div>
          <div class="hand minute-hand" id="minuteHand"></div>
          <div class="clock-center"></div>
        </div>
      </div>

      <form class="answer-form" id="answerForm">
        <input type="number" id="hourInput" placeholder="시" min="1" max="12"> 시 
        <input type="number" id="minuteInput" placeholder="분" min="0" max="59"> 분
        <button type="submit" class="btn">정답 확인</button>
      </form>

      <div class="feedback-box" id="feedbackBox"></div>
    </div>

  </div>

  <footer>
    © 문태양. 바이브코딩 실습 14 포트폴리오.
  </footer>
</div>

<script>
  let ytPlayer;
  let isUserPaused = false;
  function onYouTubeIframeAPIReady() {
    ytPlayer = new YT.Player('youtubePlayerContainer', {
      height: '0', width: '0',
      videoId: 'PkVmztKY9PU',
      playerVars: { 'autoplay': 1, 'loop': 1, 'playlist': 'PkVmztKY9PU', 'controls': 0 },
      events: {
        'onReady': (event) => { event.target.playVideo(); event.target.setVolume(50); }
      }
    });
  }
  const tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  document.getElementsByTagName('script')[0].parentNode.insertBefore(tag, document.getElementsByTagName('script')[0]);

  document.addEventListener("DOMContentLoaded", () => {
    const timeDisplay = document.getElementById('currentTimeDisplay');
    function updateClock() {
      const now = new Date();
      timeDisplay.textContent = `${now.getFullYear()}.${String(now.getMonth() + 1).padStart(2, '0')}.${String(now.getDate()).padStart(2, '0')} ${now.toLocaleTimeString('ko-KR', { hour12: false })}`;
    }
    updateClock();
    setInterval(updateClock, 1000);

    const muteToggleBtn = document.getElementById('muteToggleBtn');
    const soundOnIcon = document.getElementById('soundOnIcon');
    const soundOffIcon = document.getElementById('soundOffIcon');
    let isMuted = false;
    muteToggleBtn.addEventListener('click', () => {
      if (!ytPlayer || typeof ytPlayer.isMuted !== 'function') return;
      if (isMuted) {
        ytPlayer.unMute();
        soundOnIcon.style.display = 'block';
        soundOffIcon.style.display = 'none';
        isMuted = false;
      } else {
        ytPlayer.mute();
        soundOnIcon.style.display = 'none';
        soundOffIcon.style.display = 'block';
        isMuted = true;
      }
    });

    window.addEventListener('blur', () => { if (ytPlayer?.pauseVideo) ytPlayer.pauseVideo(); });
    window.addEventListener('focus', () => { if (!isUserPaused && ytPlayer?.playVideo) ytPlayer.playVideo(); });

    // 실습 14: 시계 읽기 앱 로직
    let selectedLevel = 1;
    let targetHour = 12;
    let targetMinute = 0;
    let correctTotal = 0;
    let tryTotal = 0;

    // 시계 숫자 배치 생성
    const clockElem = document.getElementById('analogClock');
    for (let i = 1; i <= 12; i++) {
      const num = document.createElement('div');
      num.className = 'clock-number';
      const angle = (i * 30) * (Math.PI / 180);
      const radius = 75;
      const x = 110 + radius * Math.sin(angle) - 15;
      const y = 110 - radius * Math.cos(angle) - 15;
      num.style.left = `${x}px`;
      num.style.top = `${y}px`;
      num.textContent = i;
      clockElem.appendChild(num);
    }

    document.querySelectorAll('#levelOptions .option-chip').forEach(chip => {
      chip.addEventListener('click', (e) => {
        document.querySelectorAll('#levelOptions .option-chip').forEach(c => c.classList.remove('selected'));
        e.target.classList.add('selected');
        selectedLevel = parseInt(e.target.dataset.val);
      });
    });

    const startBtn = document.getElementById('startBtn');
    const startScreen = document.getElementById('startScreen');
    const playScreen = document.getElementById('playScreen');
    const hourHand = document.getElementById('hourHand');
    const minuteHand = document.getElementById('minuteHand');
    const answerForm = document.getElementById('answerForm');
    const hourInput = document.getElementById('hourInput');
    const minuteInput = document.getElementById('minuteInput');
    const feedbackBox = document.getElementById('feedbackBox');
    const correctCountElem = document.getElementById('correctCount');
    const totalCountElem = document.getElementById('totalCount');

    startBtn.addEventListener('click', () => {
      startScreen.classList.remove('active');
      playScreen.classList.add('active');
      generateNewProblem();
    });

    function generateNewProblem() {
      targetHour = Math.floor(Math.random() * 12) + 1;
      if (selectedLevel === 1) {
        targetMinute = 0;
      } else if (selectedLevel === 2) {
        targetMinute = Math.random() < 0.5 ? 0 : 30;
      } else if (selectedLevel === 3) {
        targetMinute = Math.floor(Math.random() * 12) * 5;
      } else {
        targetMinute = Math.floor(Math.random() * 60);
      }

      updateClockHands(targetHour, targetMinute);
      hourInput.value = '';
      minuteInput.value = '';
      feedbackBox.textContent = '';
      hourInput.focus();
    }

    function updateClockHands(h, m) {
      const minAngle = m * 6; // 분당 6도
      const hourAngle = (h % 12) * 30 + m * 0.5; // 시간당 30도 + 분에 따른 시침 연동 각도

      minuteHand.style.transform = `translateX(-50%) rotate(${minAngle}deg)`;
      hourHand.style.transform = `translateX(-50%) rotate(${hourAngle}deg)`;
    }

    answerForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const userH = parseInt(hourInput.value);
      const userM = parseInt(minuteInput.value);

      if (isNaN(userH) || isNaN(userM)) {
        feedbackBox.textContent = "시와 분을 모두 올바르게 입력해주세요!";
        feedbackBox.style.color = "var(--red)";
        return;
      }

      tryTotal++;
      totalCountElem.textContent = tryTotal;

      if (userH === targetHour && userM === targetMinute) {
        correctTotal++;
        correctCountElem.textContent = correctTotal;
        feedbackBox.textContent = "🎉 정답입니다! 멋져요! 다음 문제로 넘어갑니다.";
        feedbackBox.style.color = "var(--green)";
        setTimeout(generateNewProblem, 1500);
      } else {
        feedbackBox.textContent = `❌ 아쉽네요. 정답은 ${targetHour}시 ${targetMinute}분 입니다. 다시 도전해 보세요!`;
        feedbackBox.style.color = "var(--red)";
      }
    });
  });
</script>

</body>
</html>
