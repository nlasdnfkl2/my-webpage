<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기억력 짝맞추기 게임</title>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700&family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- 폭죽 파티클 라이브러리[cite: 2] -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --bg-color: #FCFAF8;
            --text-main: #2C2C2C;
            --text-muted: #888888;
            --accent-color: #E65100; /* 오렌지 포인트 */
            --border-color: #E5E0D8;
            --card-bg: #FFFFFF;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Noto Sans KR', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 2rem 1rem;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            width: 100%;
            max-width: 600px;
            margin-bottom: 1.5rem;
        }

        h1 {
            font-family: 'Nanum Myeongjo', serif;
            font-size: 1.8rem;
            margin: 0 0 1rem 0;
            color: var(--text-main);
        }

        /* 글래스모피즘 스타일의 대시보드 */
        .dashboard {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(229, 224, 216, 0.5);
            padding: 1rem 1.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }

        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        select {
            padding: 0.5rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-family: inherit;
            color: var(--text-main);
            background-color: #FFF;
            cursor: pointer;
            font-weight: 600;
        }

        .stats {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }

        .score-board {
            font-size: 1.2rem;
            font-weight: 700;
        }
        
        .score-board span { color: var(--accent-color); }
        
        .combo-board {
            font-size: 0.9rem;
            color: var(--accent-color);
            font-weight: 700;
            opacity: 0;
            transition: opacity 0.3s, transform 0.2s;
        }
        
        .combo-board.active {
            opacity: 1;
            transform: scale(1.1);
        }

        .btn-icon {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.95rem;
            transition: color 0.2s;
            font-weight: 600;
        }
        .btn-icon:hover { color: var(--accent-color); }

        /* 타이머 진행바 */
        .progress-container {
            width: 100%;
            height: 6px;
            background-color: var(--border-color);
            border-radius: 3px;
            overflow: hidden;
            display: none;
        }
        .progress-bar {
            height: 100%;
            background-color: var(--accent-color);
            width: 100%;
            transition: width 1s linear;
        }

        /* 게임 보드 및 카드 애니메이션[cite: 2] */
        .game-board {
            display: grid;
            gap: 12px;
            max-width: 600px;
            width: 100%;
            perspective: 1000px;
        }

        .card {
            aspect-ratio: 1 / 1.1;
            position: relative;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
        }

        .card.flipped, .card.matched {
            transform: rotateY(180deg);
        }

        @keyframes wiggle {
            0%, 100% { transform: rotateY(180deg) rotateZ(0); }
            25% { transform: rotateY(180deg) rotateZ(-5deg); }
            75% { transform: rotateY(180deg) rotateZ(5deg); }
        }
        .card.error { animation: wiggle 0.4s; }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            border: 2px solid var(--border-color);
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            font-weight: 700;
            text-align: center;
            padding: 0.5rem;
            box-sizing: border-box;
            background-color: var(--card-bg);
            word-break: keep-all;
        }

        .card-front {
            transform: rotateY(180deg);
            position: relative; /* 로딩 스피너 위치 기준 */
        }

        .card-back {
            background-color: var(--bg-color);
            background-image: radial-gradient(var(--border-color) 2px, transparent 2px);
            background-size: 15px 15px;
        }

        .card-back i {
            font-size: 2.5rem;
            color: rgba(230, 81, 0, 0.4);
        }

        /* 실제 그림 이미지 및 로딩 스피너 스타일 */
        .card-image {
            width: 3.5rem;
            height: 3.5rem;
            object-fit: contain;
            margin-bottom: 0.3rem;
            opacity: 0;
            transition: opacity 0.3s ease;
            user-select: none;
            -webkit-user-drag: none;
        }
        .card-image.loaded {
            opacity: 1;
        }

        .loading-spinner {
            position: absolute;
            width: 1.5rem;
            height: 1.5rem;
            border: 3px solid var(--border-color);
            border-top-color: var(--accent-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        /* 텍스트 스타일 */
        .card-text { font-size: 1.1rem; }
        .card-text.kdc-num { font-family: 'Nanum Myeongjo', serif; font-size: 1.8rem; color: var(--accent-color); }
        .card-text.kdc-desc { font-size: 1rem; }

        @media (max-width: 480px) {
            .card-image { width: 2.5rem; height: 2.5rem; }
            .card-text { font-size: 0.9rem; }
            .card-text.kdc-num { font-size: 1.3rem; }
            .card-text.kdc-desc { font-size: 0.8rem; }
        }

        /* 모달 디자인 */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(252, 250, 248, 0.85);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 100;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 2.5rem;
            border: 1px solid var(--border-color);
            text-align: center;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
        }

        .modal-content h2 {
            font-family: 'Nanum Myeongjo', serif;
            color: var(--accent-color);
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>짝맞추기 탐험대</h1>
        <div class="dashboard">
            <div class="controls-row">
                <!-- 주제 및 난이도 변경[cite: 2] -->
                <div style="display: flex; gap: 0.5rem;">
                    <select id="themeSelect">
                        <option value="animal">동물 그림 (초등 저학년)</option>
                        <option value="kdc">도서관 탐험 (KDC 분류법)</option>
                    </select>
                    <select id="difficultySelect">
                        <option value="4">쉬움 (4쌍)</option>
                        <option value="6" selected>보통 (6쌍)</option>
                        <option value="8">어려움 (8쌍)</option>
                    </select>
                </div>
                <button class="btn-icon" id="restartBtn">
                    <i class="ph ph-arrow-counter-clockwise"></i> 다시 시작
                </button>
            </div>
            
            <div class="controls-row" style="margin-top: 0.5rem;">
                <div class="stats">
                    <div class="score-board">점수: <span id="scoreDisplay">0</span></div>
                    <div class="combo-board" id="comboDisplay">2 COMBO! 🔥</div>
                </div>
                <div id="loadingText" style="font-size: 0.85rem; color: var(--accent-color); display: none;">
                    그림을 불러오는 중...
                </div>
            </div>
            <!-- 암기 시간 진행바 -->
            <div class="progress-container" id="progressContainer">
                <div class="progress-bar" id="progressBar"></div>
            </div>
        </div>
    </header>

    <main class="game-board" id="gameBoard"></main>

    <div class="modal-overlay" id="successModal">
        <div class="modal-content">
            <i class="ph ph-medal" style="font-size: 3.5rem; color: var(--accent-color);"></i>
            <h2>성공! 참 잘했어요!</h2>
            <p style="font-size: 1.2rem; margin-top: 0.5rem;">최종 점수: <strong style="color: var(--accent-color);" id="finalScore">0</strong>점</p>
            <button class="btn-icon" id="modalRestartBtn" style="margin: 2rem auto 0; font-size: 1.1rem; color: var(--text-main);">
                <i class="ph ph-play-circle"></i> 한 번 더 하기
            </button>
        </div>
    </div>

<script>
    // 주제 1: 아이콘 폰트 대신 실제 Twemoji SVG(컬러 그림) URL 사용[cite: 2]
    const animalData = [
        { id: 1, pair1: { image: 'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f436.svg', text: '' }, pair2: { text: '강아지' } },
        { id: 2, pair1: { image: 'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f431.svg', text: '' }, pair2: { text: '고양이' } },
        { id: 3, pair1: { image: 'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f426.svg', text: '' }, pair2: { text: '새' } },
        { id: 4, pair1: { image: 'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f41f.svg', text: '' }, pair2: { text: '물고기' } },
        { id: 5, pair1: { image: 'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f430.svg', text: '' }, pair2: { text: '토끼' } },
        { id: 6, pair1: { image: 'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f422.svg', text: '' }, pair2: { text: '거북이' } },
        { id: 7, pair1: { image: 'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f41e.svg', text: '' }, pair2: { text: '무당벌레' } },
        { id: 8, pair1: { image: 'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f98b.svg', text: '' }, pair2: { text: '나비' } }
    ];

    // 주제 2: 도서관 KDC 주류
    const kdcData = [
        { id: 1, pair1: { text: '000', type: 'kdc-num' }, pair2: { text: '백과사전\n(총류)', type: 'kdc-desc' } },
        { id: 2, pair1: { text: '100', type: 'kdc-num' }, pair2: { text: '생각/마음\n(철학)', type: 'kdc-desc' } },
        { id: 3, pair1: { text: '300', type: 'kdc-num' }, pair2: { text: '사회/직업\n(사회과학)', type: 'kdc-desc' } },
        { id: 4, pair1: { text: '400', type: 'kdc-num' }, pair2: { text: '자연/과학\n(자연과학)', type: 'kdc-desc' } },
        { id: 5, pair1: { text: '500', type: 'kdc-num' }, pair2: { text: '기술/컴퓨터\n(기술과학)', type: 'kdc-desc' } },
        { id: 6, pair1: { text: '600', type: 'kdc-num' }, pair2: { text: '예술/체육\n(예술)', type: 'kdc-desc' } },
        { id: 7, pair1: { text: '800', type: 'kdc-num' }, pair2: { text: '동화/시\n(문학)', type: 'kdc-desc' } },
        { id: 8, pair1: { text: '900', type: 'kdc-num' }, pair2: { text: '역사/인물\n(역사)', type: 'kdc-desc' } }
    ];

    const gameBoard = document.getElementById('gameBoard');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const comboDisplay = document.getElementById('comboDisplay');
    const themeSelect = document.getElementById('themeSelect');
    const difficultySelect = document.getElementById('difficultySelect');
    const successModal = document.getElementById('successModal');
    const progressContainer = document.getElementById('progressContainer');
    const progressBar = document.getElementById('progressBar');
    const loadingText = document.getElementById('loadingText');
    
    let flippedCards = [];
    let matchedPairs = 0;
    let score = 0;
    let combo = 0;
    let isLocked = true;
    let totalPairs = 6;
    let audioCtx;

    function playSound(type) {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        if (type === 'match') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25 + (combo * 50), audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(880 + (combo * 50), audioCtx.currentTime + 0.1);
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.start(); osc.stop(audioCtx.currentTime + 0.2);
        } else if (type === 'error') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.start(); osc.stop(audioCtx.currentTime + 0.2);
        }
    }

    function createCardHTML(cardData) {
        let html = '';
        // 실제 그림 이미지가 있는 경우 스피너와 함께 렌더링
        if (cardData.image) {
            html += `<div class="loading-spinner"></div>`;
            html += `<img src="${cardData.image}" class="card-image" alt="그림">`;
        }
        if (cardData.text) {
            const cssClass = cardData.type ? `card-text ${cardData.type}` : 'card-text';
            html += `<span class="${cssClass}">${cardData.text.replace('\n', '<br>')}</span>`;
        }
        return html;
    }

    function initGame() {
        gameBoard.innerHTML = '';
        flippedCards = [];
        matchedPairs = 0;
        score = 0;
        combo = 0;
        isLocked = true;
        
        scoreDisplay.textContent = score;
        comboDisplay.classList.remove('active');
        successModal.classList.remove('active');
        
        totalPairs = parseInt(difficultySelect.value);
        let cols = totalPairs === 8 ? 4 : (totalPairs === 4 ? 4 : 4); 
        if (totalPairs === 6) cols = 4;
        gameBoard.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;

        const baseData = themeSelect.value === 'animal' ? animalData : kdcData;
        const selectedData = [...baseData].sort(() => 0.5 - Math.random()).slice(0, totalPairs);
        
        let deck = [];
        selectedData.forEach(item => {
            deck.push({ id: item.id, ...item.pair1 });
            deck.push({ id: item.id, ...item.pair2 });
        });

        deck.sort(() => 0.5 - Math.random());

        deck.forEach((cardData, index) => {
            const cardElement = document.createElement('div');
            cardElement.classList.add('card', 'flipped'); 
            cardElement.dataset.id = cardData.id;

            cardElement.innerHTML = `
                <div class="card-face card-back"><i class="ph ph-star"></i></div>
                <div class="card-face card-front">${createCardHTML(cardData)}</div>
            `;
            
            cardElement.addEventListener('click', () => flipCard(cardElement));
            gameBoard.appendChild(cardElement);
        });

        checkImagesLoaded();
    }

    // 그림 이미지가 모두 로딩되었는지 확인 후 타이머 시작
    function checkImagesLoaded() {
        const images = gameBoard.querySelectorAll('.card-image');
        let loadedCount = 0;
        
        if (images.length === 0) {
            startMemorizePhase();
            return;
        }

        loadingText.style.display = 'block';

        images.forEach(img => {
            if (img.complete) {
                imageLoaded(img);
            } else {
                img.addEventListener('load', () => imageLoaded(img));
                img.addEventListener('error', () => imageLoaded(img)); // 오류 시에도 진행
            }
        });

        function imageLoaded(img) {
            img.classList.add('loaded');
            
            // 로딩 스피너 제거
            const spinner = img.previousElementSibling;
            if(spinner && spinner.classList.contains('loading-spinner')) {
                spinner.style.display = 'none';
            }

            loadedCount++;
            if (loadedCount === images.length) {
                loadingText.style.display = 'none';
                startMemorizePhase();
            }
        }
    }

    function startMemorizePhase() {
        progressContainer.style.display = 'block';
        progressBar.style.width = '100%';
        progressBar.style.transition = 'none';

        setTimeout(() => {
            progressBar.style.transition = 'width 3s linear';
            progressBar.style.width = '0%';
        }, 50);

        setTimeout(() => {
            document.querySelectorAll('.card').forEach(card => card.classList.remove('flipped'));
            progressContainer.style.display = 'none';
            isLocked = false;
        }, 3000);
    }

    function flipCard(card) {
        if (isLocked) return;
        if (card === flippedCards[0]) return;
        if (card.classList.contains('matched')) return;

        card.classList.add('flipped');
        flippedCards.push(card);

        if (flippedCards.length === 2) checkMatch();
    }

    function checkMatch() {
        isLocked = true;
        const [card1, card2] = flippedCards;
        const isMatch = card1.dataset.id === card2.dataset.id;

        if (isMatch) {
            playSound('match');
            card1.classList.add('matched');
            card2.classList.add('matched');
            
            combo++;
            score += 10 * combo;
            scoreDisplay.textContent = score;
            
            if (combo > 1) {
                comboDisplay.textContent = `${combo} COMBO! 🔥`;
                comboDisplay.classList.add('active');
            }

            matchedPairs++;
            resetBoard();

            if (matchedPairs === totalPairs) setTimeout(gameWin, 500);
        } else {
            playSound('error');
            card1.classList.add('error');
            card2.classList.add('error');
            
            combo = 0;
            comboDisplay.classList.remove('active');
            score = Math.max(0, score - 2);
            scoreDisplay.textContent = score;
            
            setTimeout(() => {
                card1.classList.remove('flipped', 'error');
                card2.classList.remove('flipped', 'error');
                resetBoard();
            }, 1000);
        }
    }

    function resetBoard() {
        [flippedCards, isLocked] = [[], false];
    }

    function gameWin() {
        document.getElementById('finalScore').textContent = score;
        successModal.classList.add('active');
        
        var duration = 3 * 1000;
        var end = Date.now() + duration;

        (function frame() {
            confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#E65100', '#2C2C2C', '#FCFAF8'] });
            confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#E65100', '#2C2C2C', '#FCFAF8'] });
            if (Date.now() < end) requestAnimationFrame(frame);
        }());
    }

    document.getElementById('restartBtn').addEventListener('click', initGame);
    document.getElementById('modalRestartBtn').addEventListener('click', initGame);
    themeSelect.addEventListener('change', initGame);
    difficultySelect.addEventListener('change', initGame);

    initGame();
</script>
</body>
</html>
