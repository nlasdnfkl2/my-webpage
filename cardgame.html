<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기억력 짝맞추기 게임 - Neo Brutalism</title>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@800;900&family=Noto+Sans+KR:wght@700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- 폭죽 파티클 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --bg: #dfdcd3;
            --ink: #111111;
            --yellow: #ffde00;
            --pink: #ff007b;
            --cyan: #00f0ff;
            --green: #00ff55;
            --border: 4px solid var(--ink);
            --shadow: 8px 8px 0 var(--ink);
            --shadow-hover: 12px 12px 0 var(--ink);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg);
            color: var(--ink);
            font-family: 'Noto Sans KR', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 2rem 1rem;
            background-image: radial-gradient(var(--ink) 1.5px, transparent 1.5px);
            background-size: 24px 24px;
        }

        header {
            text-align: center;
            width: 100%;
            max-width: 600px;
            margin-bottom: 2rem;
        }

        h1 {
            font-family: 'Nanum Myeongjo', serif;
            font-size: 2.5rem;
            font-weight: 900;
            margin-bottom: 1rem;
            color: var(--ink);
            text-shadow: 3px 3px 0 var(--cyan);
            transform: skew(-2deg);
        }

        .dashboard {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            background: #fff;
            border: var(--border);
            padding: 1.5rem;
            box-shadow: var(--shadow);
            border-radius: 0;
        }

        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.8rem;
        }

        select {
            padding: 0.6rem 1rem;
            border: 3px solid var(--ink);
            border-radius: 0;
            font-family: inherit;
            color: var(--ink);
            background-color: var(--yellow);
            cursor: pointer;
            font-weight: 900;
            box-shadow: 4px 4px 0 var(--ink);
            transition: 0.1s;
        }
        select:hover { background: var(--pink); color: #fff; }

        .stats {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }

        .score-board {
            font-size: 1.3rem;
            font-weight: 900;
            background: var(--ink);
            color: var(--yellow);
            padding: 4px 12px;
            border: 2px solid var(--ink);
        }
        .score-board span { color: var(--green); }
        
        .combo-board {
            font-size: 1rem;
            background: var(--pink);
            color: #fff;
            font-weight: 900;
            padding: 4px 10px;
            border: 2px solid var(--ink);
            box-shadow: 2px 2px 0 var(--ink);
            opacity: 0;
            transform: scale(0.9);
            transition: opacity 0.2s, transform 0.2s;
        }
        
        .combo-board.active {
            opacity: 1;
            transform: scale(1.1) rotate(2deg);
        }

        .btn-icon {
            background: #fff;
            border: 3px solid var(--ink);
            color: var(--ink);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 1rem;
            font-weight: 900;
            padding: 0.5rem 1rem;
            box-shadow: 4px 4px 0 var(--ink);
            transition: all 0.1s;
        }
        .btn-icon:hover { background: var(--green); transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--ink); }
        .btn-icon:active { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--ink); }

        .progress-container {
            width: 100%;
            height: 10px;
            background-color: #fff;
            border: 2px solid var(--ink);
            overflow: hidden;
            display: none;
        }
        .progress-bar {
            height: 100%;
            background-color: var(--pink);
            width: 100%;
            transition: width 1s linear;
        }

        .game-board {
            display: grid;
            gap: 16px;
            max-width: 600px;
            width: 100%;
            perspective: 1000px;
        }

        .card {
            aspect-ratio: 1 / 1.1;
            position: relative;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.4, 0.2, 0.2, 1);
        }

        .card.flipped, .card.matched {
            transform: rotateY(180deg);
        }

        @keyframes brutalWiggle {
            0%, 100% { transform: rotateY(180deg) rotateZ(0); }
            25% { transform: rotateY(180deg) rotateZ(-8deg); }
            75% { transform: rotateY(180deg) rotateZ(8deg); }
        }
        .card.error { animation: brutalWiggle 0.4s; }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: var(--border);
            box-shadow: 4px 4px 0 var(--ink);
            font-weight: 900;
            text-align: center;
            padding: 0.5rem;
            box-sizing: border-box;
            background-color: #fff;
            word-break: keep-all;
        }

        .card-front {
            transform: rotateY(180deg);
            background-color: var(--yellow);
        }

        .card-back {
            background-color: var(--cyan);
            background-image: radial-gradient(var(--ink) 2px, transparent 2px);
            background-size: 16px 16px;
        }

        .card-back i {
            font-size: 2.5rem;
            color: var(--ink);
        }

        .card-image {
            width: 3.8rem;
            height: 3.8rem;
            object-fit: contain;
            margin-bottom: 0.4rem;
            opacity: 0;
            transition: opacity 0.3s ease;
            user-select: none;
            -webkit-user-drag: none;
        }
        .card-image.loaded { opacity: 1; }

        .loading-spinner {
            position: absolute;
            width: 2rem;
            height: 2rem;
            border: 4px solid var(--ink);
            border-top-color: var(--pink);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        .card-text { font-size: 1.1rem; }
        .card-text.kdc-num { font-family: 'Nanum Myeongjo', serif; font-size: 2rem; color: var(--pink); -webkit-text-stroke: 1px var(--ink); }
        .card-text.kdc-desc { font-size: 0.95rem; }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 100;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: var(--green);
            padding: 3rem;
            border: var(--border);
            text-align: center;
            box-shadow: 12px 12px 0 var(--ink);
            transform: rotate(-2deg);
            max-width: 400px;
            width: 90%;
        }

        .modal-content h2 {
            font-family: 'Nanum Myeongjo', serif;
            color: var(--ink);
            font-size: 2.5rem;
            margin: 0.5rem 0;
            text-shadow: 2px 2px 0 #fff;
        }
    </style>
</head>
<body>

    <header>
        <h1>짝맞추기 탐험대</h1>
        <div class="dashboard">
            <div class="controls-row">
                <div style="display: flex; gap: 0.8rem;">
                    <select id="themeSelect">
                        <option value="animal">동물 그림</option>
                        <option value="kdc">도서관 탐험 (KDC)</option>
                    </select>
                    <select id="difficultySelect">
                        <option value="4">쉬움 (4쌍)</option>
                        <option value="6" selected>보통 (6쌍)</option>
                        <option value="8">어려움 (8쌍)</option>
                    </select>
                </div>
                <button class="btn-icon" id="restartBtn">
                    <i class="ph ph-arrow-counter-clockwise"></i> 다시 시작
                </button>
            </div>
            
            <div class="controls-row" style="margin-top: 0.5rem;">
                <div class="stats">
                    <div class="score-board">점수: <span id="scoreDisplay">0</span></div>
                    <div class="combo-board" id="comboDisplay">2 COMBO! 🔥</div>
                </div>
                <div id="loadingText" style="font-size: 0.9rem; font-weight: 900; color: var(--pink); display: none;">
                    그림 불러오는 중...
                </div>
            </div>
            
            <div class="progress-container" id="progressContainer">
                <div class="progress-bar" id="progressBar"></div>
            </div>
        </div>
    </header>

    <main class="game-board" id="gameBoard"></main>

    <div class="modal-overlay" id="successModal">
        <div class="modal-content">
            <i class="ph ph-medal" style="font-size: 4rem; color: var(--ink);"></i>
            <h2>PERFECT!</h2>
            <p style="font-size: 1.3rem; font-weight: 900; margin-top: 0.5rem;">최종 점수: <span id="finalScore" style="color: var(--pink);">0</span>점</p>
            <button class="btn-icon" id="modalRestartBtn" style="margin: 2rem auto 0; background: var(--yellow);">
                <i class="ph ph-play-circle"></i> 한 번 더 하기
            </button>
        </div>
    </div>

<script>
    const animalData = [
        { id: 1, pair1: { image: 'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f436.svg', text: '' }, pair2: { text: '강아지' } },
        { id: 2, pair1: { image: 'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f431.svg', text: '' }, pair2: { text: '고양이' } },
        { id: 3, pair1: { image: 'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f426.svg', text: '' }, pair2: { text: '새' } },
        { id: 4, pair1: { image: 'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f41f.svg', text: '' }, pair2: { text: '물고기' } },
        { id: 5, pair1: { image: 'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f430.svg', text: '' }, pair2: { text: '토끼' } },
        { id: 6, pair1: { image: 'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f422.svg', text: '' }, pair2: { text: '거북이' } },
        { id: 7, pair1: { image: 'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f41e.svg', text: '' }, pair2: { text: '무당벌레' } },
        { id: 8, pair1: { image: 'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f98b.svg', text: '' }, pair2: { text: '나비' } }
    ];

    const kdcData = [
        { id: 1, pair1: { text: '000', type: 'kdc-num' }, pair2: { text: '백과사전\n(총류)', type: 'kdc-desc' } },
        { id: 2, pair1: { text: '100', type: 'kdc-num' }, pair2: { text: '생각/마음\n(철학)', type: 'kdc-desc' } },
        { id: 3, pair1: { text: '300', type: 'kdc-num' }, pair2: { text: '사회/직업\n(사회과학)', type: 'kdc-desc' } },
        { id: 4, pair1: { text: '400', type: 'kdc-num' }, pair2: { text: '자연/과학\n(자연과학)', type: 'kdc-desc' } },
        { id: 5, pair1: { text: '500', type: 'kdc-num' }, pair2: { text: '기술/컴퓨터\n(기술과학)', type: 'kdc-desc' } },
        { id: 6, pair1: { text: '600', type: 'kdc-num' }, pair2: { text: '예술/체육\n(예술)', type: 'kdc-desc' } },
        { id: 7, pair1: { text: '800', type: 'kdc-num' }, pair2: { text: '동화/시\n(문학)', type: 'kdc-desc' } },
        { id: 8, pair1: { text: '900', type: 'kdc-num' }, pair2: { text: '역사/인물\n(역사)', type: 'kdc-desc' } }
    ];

    const gameBoard = document.getElementById('gameBoard');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const comboDisplay = document.getElementById('comboDisplay');
    const themeSelect = document.getElementById('themeSelect');
    const difficultySelect = document.getElementById('difficultySelect');
    const successModal = document.getElementById('successModal');
    const progressContainer = document.getElementById('progressContainer');
    const progressBar = document.getElementById('progressBar');
    const loadingText = document.getElementById('loadingText');
    
    let flippedCards = [];
    let matchedPairs = 0;
    let score = 0;
    let combo = 0;
    let isLocked = true;
    let totalPairs = 6;
    let audioCtx;

    function playSound(type) {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        if (type === 'match') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25 + (combo * 50), audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(880 + (combo * 50), audioCtx.currentTime + 0.1);
            gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.start(); osc.stop(audioCtx.currentTime + 0.2);
        } else if (type === 'error') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.start(); osc.stop(audioCtx.currentTime + 0.2);
        }
    }

    function createCardHTML(cardData) {
        let html = '';
        if (cardData.image) {
            html += `<div class="loading-spinner"></div>`;
            html += `<img src="${cardData.image}" class="card-image" alt="그림">`;
        }
        if (cardData.text) {
            const cssClass = cardData.type ? `card-text ${cardData.type}` : 'card-text';
            html += `<span class="${cssClass}">${cardData.text.replace('\n', '<br>')}</span>`;
        }
        return html;
    }

    function initGame() {
        gameBoard.innerHTML = '';
        flippedCards = [];
        matchedPairs = 0;
        score = 0;
        combo = 0;
        isLocked = true;
        
        scoreDisplay.textContent = score;
        comboDisplay.classList.remove('active');
        successModal.classList.remove('active');
        
        totalPairs = parseInt(difficultySelect.value);
        let cols = totalPairs === 8 ? 4 : 4; 
        gameBoard.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;

        const baseData = themeSelect.value === 'animal' ? animalData : kdcData;
        const selectedData = [...baseData].sort(() => 0.5 - Math.random()).slice(0, totalPairs);
        
        let deck = [];
        selectedData.forEach(item => {
            deck.push({ id: item.id, ...item.pair1 });
            deck.push({ id: item.id, ...item.pair2 });
        });

        deck.sort(() => 0.5 - Math.random());

        deck.forEach((cardData) => {
            const cardElement = document.createElement('div');
            cardElement.classList.add('card', 'flipped'); 
            cardElement.dataset.id = cardData.id;

            cardElement.innerHTML = `
                <div class="card-face card-back"><i class="ph ph-star-four"></i></div>
                <div class="card-face card-front">${createCardHTML(cardData)}</div>
            `;
            
            cardElement.addEventListener('click', () => flipCard(cardElement));
            gameBoard.appendChild(cardElement);
        });

        checkImagesLoaded();
    }

    function checkImagesLoaded() {
        const images = gameBoard.querySelectorAll('.card-image');
        let loadedCount = 0;
        
        if (images.length === 0) {
            startMemorizePhase();
            return;
        }

        loadingText.style.display = 'block';

        images.forEach(img => {
            if (img.complete) {
                imageLoaded(img);
            } else {
                img.addEventListener('load', () => imageLoaded(img));
                img.addEventListener('error', () => imageLoaded(img));
            }
        });

        function imageLoaded(img) {
            img.classList.add('loaded');
            const spinner = img.previousElementSibling;
            if(spinner && spinner.classList.contains('loading-spinner')) {
                spinner.style.display = 'none';
            }

            loadedCount++;
            if (loadedCount === images.length) {
                loadingText.style.display = 'none';
                startMemorizePhase();
            }
        }
    }

    function startMemorizePhase() {
        progressContainer.style.display = 'block';
        progressBar.style.width = '100%';
        progressBar.style.transition = 'none';

        setTimeout(() => {
            progressBar.style.transition = 'width 3s linear';
            progressBar.style.width = '0%';
        }, 50);

        setTimeout(() => {
            document.querySelectorAll('.card').forEach(card => card.classList.remove('flipped'));
            progressContainer.style.display = 'none';
            isLocked = false;
        }, 3000);
    }

    function flipCard(card) {
        if (isLocked) return;
        if (card === flippedCards[0]) return;
        if (card.classList.contains('matched')) return;

        card.classList.add('flipped');
        flippedCards.push(card);

        if (flippedCards.length === 2) checkMatch();
    }

    function checkMatch() {
        isLocked = true;
        const [card1, card2] = flippedCards;
        const isMatch = card1.dataset.id === card2.dataset.id;

        if (isMatch) {
            playSound('match');
            card1.classList.add('matched');
            card2.classList.add('matched');
            
            combo++;
            score += 10 * combo;
            scoreDisplay.textContent = score;
            
            if (combo > 1) {
                comboDisplay.textContent = `${combo} COMBO! 🔥`;
                comboDisplay.classList.add('active');
            }

            matchedPairs++;
            resetBoard();

            if (matchedPairs === totalPairs) setTimeout(gameWin, 500);
        } else {
            playSound('error');
            card1.classList.add('error');
            card2.classList.add('error');
            
            combo = 0;
            comboDisplay.classList.remove('active');
            score = Math.max(0, score - 2);
            scoreDisplay.textContent = score;
            
            setTimeout(() => {
                card1.classList.remove('flipped', 'error');
                card2.classList.remove('flipped', 'error');
                resetBoard();
            }, 1000);
        }
    }

    function resetBoard() {
        [flippedCards, isLocked] = [[], false];
    }

    function gameWin() {
        document.getElementById('finalScore').textContent = score;
        successModal.classList.add('active');
        
        var duration = 3 * 1000;
        var end = Date.now() + duration;

        (function frame() {
            confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#ffde00', '#ff007b', '#00f0ff'] });
            confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#ffde00', '#ff007b', '#00f0ff'] });
            if (Date.now() < end) requestAnimationFrame(frame);
        }());
    }

    document.getElementById('restartBtn').addEventListener('click', initGame);
    document.getElementById('modalRestartBtn').addEventListener('click', initGame);
    themeSelect.addEventListener('change', initGame);
    difficultySelect.addEventListener('change', initGame);

    initGame();
</script>
</body>
</html>
