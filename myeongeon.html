<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마음의 문장들</title>
    <!-- 에디토리얼 테마용 폰트 및 벡터 아이콘 라이브러리 -->
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <style>
        /* 미니멀 에디토리얼 테마 설정 */
        :root {
            --bg-color: #FCFAF8; /* 상아색 종이 질감 */
            --text-main: #2C2C2C; /* 짙은 먹물색 */
            --text-muted: #888888;
            --accent-color: #E65100; /* 오렌지색 포인트 */
            --border-color: #E5E0D8;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Noto Sans KR', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            word-break: keep-all;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            padding: 2rem;
            box-sizing: border-box;
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        h1 {
            font-family: 'Nanum Myeongjo', serif;
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0 0 0.5rem 0;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin: 0;
        }

        /* 아이콘 위주의 감정 선택 버튼 */
        .emotion-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            margin-bottom: 2.5rem;
        }

        .emotion-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        .emotion-btn {
            background: none;
            border: 1px solid var(--border-color);
            border-radius: 50%;
            width: 3.5rem;
            height: 3.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            color: var(--text-main);
            transition: all 0.2s ease;
        }

        .emotion-btn i {
            font-size: 1.6rem;
        }

        .emotion-btn:hover, .emotion-btn.active {
            border-color: var(--accent-color);
            color: var(--accent-color);
            background-color: rgba(230, 81, 0, 0.05);
        }

        .emotion-label {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        /* 명언 카드 디자인 */
        .quote-card {
            background-color: #FFFFFF;
            border: 1px solid var(--border-color);
            padding: 3rem 2rem;
            text-align: center;
            display: none;
            position: relative;
        }

        .quote-card.active {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .quote-text {
            font-family: 'Nanum Myeongjo', serif;
            font-size: 1.25rem;
            line-height: 1.7;
            margin-bottom: 1.5rem;
        }

        .quote-source {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
        }

        /* 키워드 태그 */
        .keyword-list {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 2.5rem;
            flex-wrap: wrap;
        }

        .keyword-btn {
            background: none;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .keyword-btn:hover {
            background-color: var(--accent-color);
            color: #FFF;
        }

        /* 하단 아이콘 액션바 */
        .action-bar {
            display: flex;
            justify-content: center;
            gap: 2.5rem;
            border-top: 1px solid var(--border-color);
            padding-top: 2rem;
        }

        .action-btn {
            background: none;
            border: none;
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.4rem;
            transition: color 0.2s;
        }

        .action-btn i {
            font-size: 1.5rem;
        }

        .action-btn span {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .action-btn:hover {
            color: var(--accent-color);
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>마음의 문장들</h1>
        <p class="subtitle">지금 당신의 감정을 선택해 주세요</p>
    </header>

    <!-- 핵심기능: 4가지 감정 상태[cite: 1] -->
    <div class="emotion-grid">
        <div class="emotion-item">
            <button class="emotion-btn" data-emotion="happy" title="기쁘고 행복함"><i class="ph ph-sun"></i></button>
            <span class="emotion-label">행복</span>
        </div>
        <div class="emotion-item">
            <button class="emotion-btn" data-emotion="sad" title="슬프고 우울함"><i class="ph ph-cloud-rain"></i></button>
            <span class="emotion-label">우울</span>
        </div>
        <div class="emotion-item">
            <button class="emotion-btn" data-emotion="burnout" title="지치고 번아웃"><i class="ph ph-battery-warning"></i></button>
            <span class="emotion-label">번아웃</span>
        </div>
        <div class="emotion-item">
            <button class="emotion-btn" data-emotion="anxious" title="불안하고 스트레스"><i class="ph ph-waves"></i></button>
            <span class="emotion-label">불안</span>
        </div>
    </div>

    <!-- 명언 및 발언자 표시 영역[cite: 1] -->
    <main class="quote-card" id="quoteCard">
        <div class="quote-text" id="quoteText">명언이 이곳에 표시됩니다.</div>
        <div class="quote-source" id="quoteSource">- 발언자 -</div>
        
        <div class="keyword-list" id="keywordList">
            <!-- 키워드 태그가 동적으로 추가됩니다 -->
        </div>

        <div class="action-bar">
            <!-- 다른 명언 보기 기능[cite: 1] -->
            <button class="action-btn" id="nextBtn">
                <i class="ph ph-arrows-clockwise"></i>
                <span>다른 문장</span>
            </button>
            <button class="action-btn" id="searchBtn">
                <i class="ph ph-google-logo"></i>
                <span>구글 검색</span>
            </button>
        </div>
    </main>
</div>

<script>
    // 다양성을 위해 영화, 문학, 철학 등 다양한 출처의 데이터를 구성했습니다.
    // 각 감정별 20개 이상의 데이터 확장을 원하실 경우 아래 배열에 객체를 추가하시면 됩니다.[cite: 1]
    const quotesData = [
        { id: 1, emotion: 'happy', text: "행복은 목적지가 아니라 여행 그 자체이다.", source: "랄프 왈도 에머슨", keyword: "행복" },
        { id: 2, emotion: 'happy', text: "우리가 가진 것을 즐기는 것이야말로 진정한 풍요로움이다.", source: "에피쿠로스 (철학자)", keyword: "감사" },
        { id: 3, emotion: 'happy', text: "가장 어두운 밤도 언젠가는 끝나고 해는 떠오른다.", source: "영화 <레미제라블>", keyword: "희망" },
        { id: 4, emotion: 'happy', text: "단순하게 살아라. 현대인은 쓸데없는 일 때문에 얼마나 복잡한 삶을 살아가는가?", source: "이다 사우엘", keyword: "단순함" },
        { id: 5, emotion: 'sad', text: "슬픔이 그대의 삶을 삼키려 할 때, 그것이 지나갈 것임을 기억하라.", source: "에이브러햄 링컨", keyword: "시간" },
        { id: 6, emotion: 'sad', text: "눈물을 흘려라. 눈물은 영혼을 씻어내는 비누다.", source: "조세프 루", keyword: "위로" },
        { id: 7, emotion: 'sad', text: "때로는 무너져도 괜찮다. 별들도 무너져 내려야 새로운 은하를 만드니까.", source: "영화 <인터스텔라>", keyword: "위로" },
        { id: 8, emotion: 'sad', text: "울지 마라, 지나간 것은 지나간 대로 의미가 있다.", source: "이적 (노래 가사)", keyword: "시간" },
        { id: 9, emotion: 'burnout', text: "휴식은 게으름이 아니다. 때로는 아무것도 하지 않는 것이 가장 큰 생산성이다.", source: "존 러복", keyword: "휴식" },
        { id: 10, emotion: 'burnout', text: "모든 것을 완벽하게 하려는 강박을 내려놓아라. 당신은 이미 충분하다.", source: "브레네 브라운", keyword: "용인" },
        { id: 11, emotion: 'burnout', text: "가끔은 멈춰 서서 자신이 얼마나 멀리 왔는지 돌아볼 필요가 있다.", source: "영화 <월터의 상상은 현실이 된다>", keyword: "성장" },
        { id: 12, emotion: 'burnout', text: "지쳤다면 잠시 쉬어가도 좋다. 방향만 잃지 않는다면.", source: "무명", keyword: "휴식" },
        { id: 13, emotion: 'anxious', text: "걱정의 40%는 절대 일어나지 않을 일이고, 30%는 이미 일어난 일이다.", source: "어니 젤린스키", keyword: "걱정" },
        { id: 14, emotion: 'anxious', text: "두려움은 환상이다. 용기는 선택이다.", source: "윈스턴 처칠", keyword: "용기" },
        { id: 15, emotion: 'anxious', text: "포스(Force)와 함께 하길. 불안은 미지의 것에 대한 저항일 뿐이다.", source: "영화 <스타워즈>", keyword: "마음챙김" },
        { id: 16, emotion: 'anxious', text: "인생은 폭풍우가 지나가기를 기다리는 것이 아니라, 빗속에서 춤추는 법을 배우는 것이다.", source: "비비안 그린", keyword: "용기" }
    ];

    const emotionBtns = document.querySelectorAll('.emotion-btn');
    const quoteCard = document.getElementById('quoteCard');
    const quoteText = document.getElementById('quoteText');
    const quoteSource = document.getElementById('quoteSource');
    const keywordList = document.getElementById('keywordList');
    const nextBtn = document.getElementById('nextBtn');
    const searchBtn = document.getElementById('searchBtn');

    let currentEmotion = '';
    let currentQuote = null;
    let lastShownId = -1; // 동일 문장 연속 출현 방지용 변수[cite: 1]

    // 명언 렌더링 함수
    function displayQuote(quoteArray) {
        if (quoteArray.length === 0) return;

        // 동일한 명언이 연속으로 나오지 않도록 필터링[cite: 1]
        let availableQuotes = quoteArray;
        if (quoteArray.length > 1) {
            availableQuotes = quoteArray.filter(q => q.id !== lastShownId);
        }

        // 무작위 명언 선택[cite: 1]
        const randomIndex = Math.floor(Math.random() * availableQuotes.length);
        currentQuote = availableQuotes[randomIndex];
        lastShownId = currentQuote.id;

        quoteText.textContent = `"${currentQuote.text}"`;
        quoteSource.textContent = `- ${currentQuote.source} -`;
        
        // 키워드 버튼 생성 (클릭 시 동일 키워드의 다른 명언 탐색)
        keywordList.innerHTML = '';
        const keywordBtn = document.createElement('button');
        keywordBtn.className = 'keyword-btn';
        keywordBtn.textContent = `#${currentQuote.keyword}`;
        keywordBtn.title = "같은 키워드의 다른 명언 보기";
        
        keywordBtn.addEventListener('click', () => {
            const relatedQuotes = quotesData.filter(q => q.keyword === currentQuote.keyword);
            displayQuote(relatedQuotes);
        });
        
        keywordList.appendChild(keywordBtn);
        quoteCard.classList.add('active');
    }

    // 감정 버튼 클릭 이벤트
    emotionBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            emotionBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            currentEmotion = btn.getAttribute('data-emotion');
            const filteredQuotes = quotesData.filter(q => q.emotion === currentEmotion);
            displayQuote(filteredQuotes);
        });
    });

    // 다른 명언 보기 버튼[cite: 1]
    nextBtn.addEventListener('click', () => {
        if (!currentEmotion) return;
        const filteredQuotes = quotesData.filter(q => q.emotion === currentEmotion);
        displayQuote(filteredQuotes);
    });

    // 구글 검색 연동 (현재 명언의 키워드로 검색)
    searchBtn.addEventListener('click', () => {
        if (currentQuote && currentQuote.keyword) {
            const searchQuery = encodeURIComponent(`${currentQuote.keyword} 명언`);
            window.open(`https://www.google.com/search?q=${searchQuery}`, '_blank');
        }
    });
</script>
</body>
</html>
