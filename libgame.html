<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>도서관 지식 라운지</title>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- 폭죽 파티클 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --bg-color: #F4F6F8;
            --text-main: #2D3748;
            --text-muted: #718096;
            --primary-color: #3182CE; /* 중학생 타겟으로 차분한 블루톤 적용 */
            --accent-color: #DD6B20;
            --card-bg: #FFFFFF;
            --border-color: #E2E8F0;
            --success-color: #38A169;
            --error-color: #E53E3E;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Noto Sans KR', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem 1rem;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 700px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            padding: 2.5rem;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
        }

        /* 뷰 전환용 클래스 */
        .view-section { display: none; animation: fadeIn 0.4s ease; }
        .view-section.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 공통 헤더 */
        .header {
            text-align: center;
            margin-bottom: 2rem;
            position: relative;
        }

        .header h1 {
            font-family: 'Nanum Myeongjo', serif;
            font-size: 2rem;
            margin: 0 0 0.5rem 0;
            color: var(--text-main);
        }

        .header p { color: var(--text-muted); margin: 0; }

        .btn-back {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            font-size: 1.5rem;
            color: var(--text-muted);
            cursor: pointer;
            transition: color 0.2s;
        }
        .btn-back:hover { color: var(--primary-color); }

        /* 메인 메뉴 */
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .menu-card {
            background: var(--bg-color);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            padding: 2rem 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .menu-card:hover {
            border-color: var(--primary-color);
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(49, 130, 206, 0.15);
        }

        .menu-card i {
            font-size: 3.5rem;
            color: var(--primary-color);
            margin-bottom: 1rem;
        }

        .menu-card h3 { margin: 0 0 0.5rem 0; font-size: 1.25rem; }
        .menu-card p { font-size: 0.9rem; color: var(--text-muted); margin: 0; word-break: keep-all; }

        /* ===== KDC 짝맞추기 스타일 ===== */
        .game-dashboard {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-color);
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            font-weight: 700;
        }

        .game-board {
            display: grid;
            gap: 12px;
            perspective: 1000px;
        }

        .card {
            aspect-ratio: 1 / 1.1;
            position: relative;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
        }
        .card.flipped, .card.matched { transform: rotateY(180deg); }
        .card.error { animation: wiggle 0.4s; }

        @keyframes wiggle {
            0%, 100% { transform: rotateY(180deg) rotateZ(0); }
            25% { transform: rotateY(180deg) rotateZ(-5deg); }
            75% { transform: rotateY(180deg) rotateZ(5deg); }
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 12px;
            border: 2px solid var(--border-color);
            background-color: var(--card-bg);
            text-align: center;
            padding: 0.5rem;
            box-sizing: border-box;
            word-break: keep-all;
        }

        .card-front { transform: rotateY(180deg); }
        .card-back {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            color: #FFF;
        }
        .card-back i { font-size: 2.5rem; }

        .kdc-num { font-family: 'Nanum Myeongjo', serif; font-size: 1.8rem; color: var(--primary-color); font-weight: 800; }
        .kdc-desc { font-size: 1.05rem; font-weight: 700; color: var(--text-main); }
        .kdc-sub { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.3rem; }

        /* ===== 퀴즈 앱 스타일[cite: 3] ===== */
        .quiz-progress {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        
        .progress-bar-bg {
            flex: 1;
            height: 8px;
            background: var(--border-color);
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            background: var(--primary-color);
            width: 0%;
            transition: width 0.3s ease;
        }
        .quiz-count { font-weight: 700; color: var(--primary-color); font-size: 1.1rem; }

        .question-box {
            background: var(--bg-color);
            padding: 2rem;
            border-radius: 12px;
            font-size: 1.3rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 1.5rem;
            word-break: keep-all;
            line-height: 1.5;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .option-btn {
            background: #FFF;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            padding: 1.2rem 1rem;
            font-size: 1.05rem;
            font-family: inherit;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
            word-break: keep-all;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary-color);
            background: rgba(49, 130, 206, 0.05);
        }

        .option-btn.correct { background: var(--success-color); color: #FFF; border-color: var(--success-color); }
        .option-btn.wrong { background: var(--error-color); color: #FFF; border-color: var(--error-color); }

        .feedback-msg {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 1.1rem;
            font-weight: 700;
            min-height: 1.5rem;
        }
        .feedback-msg.error { color: var(--error-color); }
        .feedback-msg.success { color: var(--success-color); }

        /* 결과 모달 */
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 100;
            border-radius: 20px;
        }

        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        
        .modal-content { text-align: center; }
        .modal-content h2 { color: var(--primary-color); font-size: 2rem; margin: 1rem 0; }
        .modal-content p { font-size: 1.2rem; font-weight: 700; }
        
        .btn-primary {
            background: var(--primary-color);
            color: #FFF;
            border: none;
            padding: 0.8rem 2rem;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 1.5rem;
            transition: background 0.2s;
        }
        .btn-primary:hover { background: #2B6CB0; }

        @media (max-width: 600px) {
            .menu-grid { grid-template-columns: 1fr; }
            .options-grid { grid-template-columns: 1fr; }
            .app-container { padding: 1.5rem; }
        }
    </style>
</head>
<body>

<div class="app-container">
    
    <!-- 1. 메인 메뉴 화면 -->
    <div id="view-menu" class="view-section active">
        <div class="header">
            <h1>도서관 지식 라운지</h1>
            <p>원하는 탐험을 선택하세요 (중등부)</p>
        </div>
        <div class="menu-grid">
            <div class="menu-card" onclick="switchView('view-matching')">
                <i class="ph ph-cards"></i>
                <h3>KDC 강목 짝맞추기</h3>
                <p>한국문학은 몇 번일까? 세부 분류 기호를 찾아 짝을 맞춰보세요.</p>
            </div>
            <div class="menu-card" onclick="switchView('view-quiz')">
                <i class="ph ph-check-square-offset"></i>
                <h3>도서관 골든벨 퀴즈</h3>
                <p>도서관 상식부터 KDC까지! 4지선다 객관식 퀴즈에 도전하세요.</p>
            </div>
        </div>
    </div>

    <!-- 2. KDC 짝맞추기 게임 화면 -->
    <div id="view-matching" class="view-section">
        <div class="header">
            <button class="btn-back" onclick="switchView('view-menu')"><i class="ph ph-caret-left"></i></button>
            <h1>KDC 강목 짝맞추기</h1>
        </div>
        <div class="game-dashboard">
            <div>난이도: 8쌍 (강목 10단위)</div>
            <div style="color: var(--primary-color);">점수: <span id="matchScore">0</span></div>
        </div>
        <div class="game-board" id="matchBoard"></div>
    </div>

    <!-- 3. 객관식 퀴즈 게임 화면[cite: 3] -->
    <div id="view-quiz" class="view-section">
        <div class="header">
            <button class="btn-back" onclick="switchView('view-menu')"><i class="ph ph-caret-left"></i></button>
            <h1>도서관 골든벨 퀴즈</h1>
        </div>
        
        <div class="quiz-progress">
            <span class="quiz-count">Q. <span id="currentQNum">1</span> / 10</span>
            <div class="progress-bar-bg"><div class="progress-bar-fill" id="quizProgress"></div></div>
        </div>

        <div class="question-box" id="questionText">문제 불러오는 중...</div>
        
        <div class="options-grid" id="optionsContainer">
            <!-- 보기 버튼 동적 생성 -->
        </div>

        <div class="feedback-msg" id="quizFeedback"></div>
    </div>

    <!-- 결과 모달 공통 -->
    <div class="modal-overlay" id="resultModal">
        <div class="modal-content">
            <i class="ph ph-trophy" style="font-size: 4rem; color: var(--accent-color);"></i>
            <h2 id="modalTitle">완료!</h2>
            <p id="modalDesc">최종 점수: 100점</p>
            <button class="btn-primary" id="modalBtn">다시 하기</button>
        </div>
    </div>

</div>

<script>
    // ===== 공통 오디오 컨텍스트 (효과음)[cite: 3] =====
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;
    
    function playSound(type) {
        if (!audioCtx) audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        if (type === 'correct') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(659.25, audioCtx.currentTime); // E5
            osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.1); // A5
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        } else if (type === 'wrong') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.2);
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        }
    }

    // ===== 뷰 전환 로직 =====
    function switchView(viewId) {
        document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
        document.getElementById(viewId).classList.add('active');
        
        if (viewId === 'view-matching') initMatchGame();
        if (viewId === 'view-quiz') initQuizGame();
    }


    // ==========================================
    // 1. KDC 강목 짝맞추기 로직
    // ==========================================
    const kdcGangmokData = [
        { id: 1, pair1: { text: '070', type: 'kdc-num' }, pair2: { text: '신문 / 저널리즘', sub: '총류', type: 'kdc-desc' } },
        { id: 2, pair1: { text: '320', type: 'kdc-num' }, pair2: { text: '경제학', sub: '사회과학', type: 'kdc-desc' } },
        { id: 3, pair1: { text: '410', type: 'kdc-num' }, pair2: { text: '수학', sub: '자연과학', type: 'kdc-desc' } },
        { id: 4, pair1: { text: '510', type: 'kdc-num' }, pair2: { text: '의학', sub: '기술과학', type: 'kdc-desc' } },
        { id: 5, pair1: { text: '690', type: 'kdc-num' }, pair2: { text: '오락 / 스포츠', sub: '예술', type: 'kdc-desc' } },
        { id: 6, pair1: { text: '740', type: 'kdc-num' }, pair2: { text: '사진예술', sub: '언어', type: 'kdc-desc' } },
        { id: 7, pair1: { text: '810', type: 'kdc-num' }, pair2: { text: '한국문학', sub: '문학', type: 'kdc-desc' } },
        { id: 8, pair1: { text: '910', type: 'kdc-num' }, pair2: { text: '아시아 (역사)', sub: '역사', type: 'kdc-desc' } }
    ];

    let matchCards = [], flippedCards = [], matchedPairs = 0, matchScore = 0, isLocked = false;
    
    function initMatchGame() {
        const board = document.getElementById('matchBoard');
        board.innerHTML = '';
        board.style.gridTemplateColumns = 'repeat(4, 1fr)';
        
        flippedCards = []; matchedPairs = 0; matchScore = 0; isLocked = false;
        document.getElementById('matchScore').textContent = matchScore;

        let deck = [];
        kdcGangmokData.forEach(item => {
            deck.push({ id: item.id, ...item.pair1 });
            deck.push({ id: item.id, ...item.pair2 });
        });
        deck.sort(() => 0.5 - Math.random());

        deck.forEach(data => {
            const card = document.createElement('div');
            card.className = 'card';
            card.dataset.id = data.id;
            
            let contentHTML = `<span class="${data.type}">${data.text}</span>`;
            if (data.sub) contentHTML += `<span class="kdc-sub">(${data.sub})</span>`;

            card.innerHTML = `
                <div class="card-face card-back"><i class="ph ph-books"></i></div>
                <div class="card-face card-front">${contentHTML}</div>
            `;
            card.addEventListener('click', () => flipCard(card));
            board.appendChild(card);
        });
    }

    function flipCard(card) {
        if (isLocked || card === flippedCards[0] || card.classList.contains('matched')) return;
        
        card.classList.add('flipped');
        flippedCards.push(card);

        if (flippedCards.length === 2) {
            isLocked = true;
            const isMatch = flippedCards[0].dataset.id === flippedCards[1].dataset.id;
            
            if (isMatch) {
                playSound('correct');
                flippedCards.forEach(c => c.classList.add('matched'));
                matchScore += 10;
                matchedPairs++;
                document.getElementById('matchScore').textContent = matchScore;
                resetMatchBoard();
                
                if (matchedPairs === kdcGangmokData.length) setTimeout(() => showResult('KDC 마스터!', matchScore, initMatchGame), 500);
            } else {
                playSound('wrong');
                flippedCards.forEach(c => c.classList.add('error'));
                matchScore = Math.max(0, matchScore - 2);
                document.getElementById('matchScore').textContent = matchScore;
                
                setTimeout(() => {
                    flippedCards.forEach(c => c.classList.remove('flipped', 'error'));
                    resetMatchBoard();
                }, 1000);
            }
        }
    }
    function resetMatchBoard() { flippedCards = []; isLocked = false; }


    // ==========================================
    // 2. 도서관 골든벨 퀴즈 로직[cite: 3]
    // ==========================================
    // 총 10문제를 요구사항에 맞게 구성. (독도의 날 포함)
    const rawQuizData = [
        { q: "도서관에서 책의 위치를 알려주는 고유 번호를 무엇이라고 할까요?", options: ["청구기호", "바코드", "ISBN", "등록번호"], ans: 0 },
        { q: "KDC(한국십진분류법)에서 '한국 문학(소설, 시 등)'을 찾으려면 몇 번대로 가야 할까요?", options: ["400번대", "810번대", "910번대", "100번대"], ans: 1 },
        { q: "다음 중 KDC 분류 중 '자연과학(400)'에 속하지 않는 것은?", options: ["우주의 이해", "식물 도감", "파이썬 프로그래밍", "미적분학"], ans: 2 },
        { q: "전 세계 모든 책에 부여되는 고유한 13자리 국제 표준 번호는?", options: ["KDC", "ISSN", "청구기호", "ISBN"], ans: 3 },
        { q: "대한민국 영토인 독도의 날은 언제일까요?", options: ["8월 15일", "10월 9일", "10월 25일", "3월 1일"], ans: 2 }, //[cite: 3] 요구사항 반영
        { q: "도서관에서 저작권법상 '이것'은 허용되지 않습니다. 무엇일까요?", options: ["책의 일부(10%) 복사", "책 전체 복사", "과제 참고용 인용", "도서관 내 열람"], ans: 1 },
        { q: "백과사전, 사전, 연감 등은 KDC 분류상 어디에 속할까요?", options: ["총류 (000)", "철학 (100)", "언어 (700)", "문학 (800)"], ans: 0 },
        { q: "다음 중 '역사(900)' 분류에 포함되는 학문은?", options: ["경제학", "수학", "지리학", "물리학"], ans: 2 },
        { q: "우리나라 최초의 한글 소설은 무엇일까요?", options: ["구운몽", "홍길동전", "춘향전", "심청전"], ans: 1 },
        { q: "인터넷 정보 검색 시 가장 먼저 확인해야 할 사항은?", options: ["글의 길이", "작성자의 감정", "출처와 신뢰성", "댓글의 개수"], ans: 2 }
    ];

    let currentQuizList = [];
    let qIndex = 0;
    let quizScore = 0;
    let quizLocked = false;

    function initQuizGame() {
        // 문제 순서 셔플 (동일한 문제 순서 출제 방지[cite: 3])
        currentQuizList = [...rawQuizData].sort(() => 0.5 - Math.random());
        qIndex = 0;
        quizScore = 0;
        loadQuestion();
    }

    function loadQuestion() {
        if (qIndex >= currentQuizList.length) {
            showResult('퀴즈 완료!', quizScore, initQuizGame);
            return;
        }

        quizLocked = false;
        const qData = currentQuizList[qIndex];
        
        document.getElementById('currentQNum').textContent = qIndex + 1;
        document.getElementById('quizProgress').style.width = `${((qIndex) / currentQuizList.length) * 100}%`;
        document.getElementById('questionText').textContent = qData.q;
        
        const feedback = document.getElementById('quizFeedback');
        feedback.textContent = '';
        feedback.className = 'feedback-msg';

        const container = document.getElementById('optionsContainer');
        container.innerHTML = '';

        // 4지선다 렌더링[cite: 3]
        qData.options.forEach((optText, i) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.textContent = optText;
            btn.onclick = () => selectAnswer(btn, i, qData.ans);
            container.appendChild(btn);
        });
    }

    // 정/오답 판정 및 즉각적 피드백[cite: 3]
    function selectAnswer(btn, selectedIdx, correctIdx) {
        if (quizLocked) return;
        
        const isCorrect = (selectedIdx === correctIdx);
        const feedback = document.getElementById('quizFeedback');
        const allBtns = document.querySelectorAll('.option-btn');

        if (isCorrect) {
            playSound('correct');
            quizLocked = true; // 정답일 경우만 넘어감
            btn.classList.add('correct');
            feedback.textContent = '정답입니다! 🎉';
            feedback.className = 'feedback-msg success';
            quizScore += 10;
            
            setTimeout(() => {
                qIndex++;
                loadQuestion();
            }, 1200);
        } else {
            playSound('wrong');
            btn.classList.add('wrong');
            btn.disabled = true; // 틀린 버튼 비활성화
            feedback.textContent = '다시 생각해보세요.'; // 오답 메시지 출력[cite: 3]
            feedback.className = 'feedback-msg error';
            quizScore = Math.max(0, quizScore - 2); // 오답 감점
        }
    }

    // ==========================================
    // 공통 결과 모달 처리 (총점 산출 및 재도전[cite: 3])
    // ==========================================
    function showResult(title, finalScore, restartCallback) {
        document.getElementById('quizProgress').style.width = `100%`;
        
        const modal = document.getElementById('resultModal');
        document.getElementById('modalTitle').textContent = title;
        document.getElementById('modalDesc').textContent = `최종 점수: ${finalScore}점`;
        
        const btn = document.getElementById('modalBtn');
        btn.onclick = () => {
            modal.classList.remove('active');
            restartCallback();
        };

        modal.classList.add('active');
        fireConfetti();
    }

    function fireConfetti() {
        var duration = 2.5 * 1000;
        var end = Date.now() + duration;
        (function frame() {
            confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#3182CE', '#DD6B20'] });
            confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#3182CE', '#DD6B20'] });
            if (Date.now() < end) requestAnimationFrame(frame);
        }());
    }

</script>
</body>
