<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오늘의 할 일 - Neo Brutalism</title>
<style>
/* 네오 브루탈리즘 팔레트 및 전역 변수 */
:root {
  --bg: #dfdcd3;
  --black: #0f0f0f;
  --yellow: #ffde00;
  --pink: #ff007b;
  --cyan: #00f0ff;
  --green: #00ff55;
  --border: 4px solid var(--black);
  --shadow-sm: 4px 4px 0 var(--black);
  --shadow-lg: 8px 8px 0 var(--black);
  --shadow-xl: 14px 14px 0 var(--black);
  --tx: var(--black);
  --mu: #555;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }
html { font-size: clamp(14px, calc(10px + 0.4vw), 22px); }

/* 전역 노이즈 텍스처 (실험적 효과) */
body::after {
  content: "";
  position: fixed; inset: 0;
  pointer-events: none; z-index: 9999;
  background: url('data:image/svg+xml;utf8,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="n"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="1.5" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23n)" opacity="0.3"/%3E%3C/svg%3E');
  opacity: 0.12;
  mix-blend-mode: overlay;
}

body {
  min-height: 100vh;
  background-color: var(--bg);
  color: var(--tx);
  font-family: "Pretendard", "Apple SD Gothic Neo", monospace; /* 모노스페이스 혼합 느낌 */
  padding: 2rem clamp(1rem, 3vw, 4rem) 3rem;
  transition: filter 0.15s, background-color 0.15s;
  overflow-x: hidden;
}

/* =========================================================
   [실험적 마우스 호버 효과] 
   특정 영역에 커서를 올리면 화면 전체가 반전되거나 왜곡됩니다. 
========================================================= */
/* 1. 타이틀(h1)에 마우스 오버 시 화면 전체 글리치 & 색상 반전 */
body:has(h1:hover) {
  animation: global-glitch 0.2s infinite;
  filter: invert(1) hue-rotate(180deg) contrast(1.5);
  background-color: #222;
}

/* 2. 할 일 목록 중 하나에 마우스를 올리면, 선택 안 된 나머지 항목들은 흑백+블러 처리 */
#list:has(.item:hover) .item:not(:hover) {
  filter: grayscale(1) blur(2px) contrast(2);
  opacity: 0.4;
  transform: scale(0.98);
}

/* 3. 우측 사이드바 통계(원형 그래프)에 마우스 오버 시 화면 반전 */
body:has(.ringbox:hover) {
  filter: invert(1) hue-rotate(90deg);
  background-color: var(--black);
}

@keyframes global-glitch {
  0% { transform: translate(3px, 1px) rotate(0.5deg); }
  50% { transform: translate(-3px, -2px) rotate(-0.5deg); }
  100% { transform: translate(1px, 3px) rotate(0deg); }
}
/* ========================================================= */

.wrap { max-width: 112rem; margin: 0 auto; position: relative; z-index: 1; }
.top { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 2.5rem; border-bottom: var(--border); padding-bottom: 1rem; }

h1 {
  font-size: 3.5rem;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: -0.05em;
  color: var(--black);
  text-shadow: 4px 4px 0 var(--pink), 8px 8px 0 var(--cyan);
  transform: skew(-3deg);
  transition: transform 0.2s;
  cursor: crosshair;
}
h1:hover { transform: skew(3deg) scale(1.05); }

#sub { font-weight: 800; font-size: 1.2rem; margin-top: 0.5rem; color: var(--black); background: var(--yellow); display: inline-block; padding: 2px 10px; border: 2px solid var(--black); box-shadow: 2px 2px 0 var(--black); }

.dn { display: flex; gap: 0.5rem; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 4px solid var(--pink); outline-offset: 0; }

.ib, .btn {
  background: #fff; border: var(--border); font-weight: 900;
  padding: 0.6rem 1.2rem; box-shadow: var(--shadow-sm);
  transition: transform 0.1s, box-shadow 0.1s, background 0.1s;
  text-transform: uppercase;
}
.ib:hover, .btn:hover { background: var(--yellow); color: var(--black); animation: text-glitch 0.2s infinite; }
.ib:active, .btn:active { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--black); }

@keyframes text-glitch {
  0% { transform: translate(0, 0); }
  25% { transform: translate(-2px, 2px); }
  50% { transform: translate(2px, -2px); }
  75% { transform: translate(-2px, -2px); }
  100% { transform: translate(0, 0); }
}

.app { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 2rem; align-items: start; }

.card {
  background: #fff;
  border: var(--border);
  padding: 1.5rem;
  box-shadow: var(--shadow-lg);
}

.side { display: grid; gap: 1.5rem; position: sticky; top: 1.5rem; }
.add { display: grid; gap: 1rem; margin-bottom: 2rem; background: var(--cyan); }
.r1, .r2, .r3 { display: flex; gap: 0.8rem; flex-wrap: wrap; align-items: center; }

.add input, .add select {
  background: #fff; border: var(--border); box-shadow: var(--shadow-sm);
  padding: 0.6rem 1rem; font-weight: 800; border-radius: 0;
}
.add input:focus, .add select:focus { background: var(--yellow); }

#title { flex: 1; min-width: 12rem; font-size: 1.3rem; }
.btn { background: var(--pink); color: #fff; font-size: 1.1rem; }
.btn:hover { background: var(--black); color: var(--green); }

.shake { animation: brutal-shake 0.3s forwards; }
@keyframes brutal-shake {
  0%, 100% { transform: translateX(0) skew(0deg); }
  25% { transform: translateX(-10px) skew(10deg); }
  75% { transform: translateX(10px) skew(-10deg); }
}

.add label { display: flex; align-items: center; gap: 0.5rem; font-weight: 900; font-size: 0.95rem; }

.seg { display: flex; background: var(--black); border: var(--border); box-shadow: var(--shadow-sm); padding: 4px; gap: 4px; }
.seg button, .chip, .tab, .wd { background: #fff; border: 2px solid var(--black); font-weight: 900; padding: 0.5rem 1rem; transition: 0.1s; }
.seg button.on { background: var(--yellow); color: var(--black); transform: scale(1.05); border: 2px solid var(--black); }

.chip { box-shadow: 2px 2px 0 var(--black); }
.chip:hover, .tab:hover, .wd:hover { background: var(--black); color: var(--cyan); }
.chip.on { background: var(--black); color: var(--pink); border-color: var(--black); }

#urg.on { background: var(--red, #ff2a2a); color: #fff; box-shadow: 4px 4px 0 var(--black); animation: alert-blink 0.5s infinite alternate; }
@keyframes alert-blink { from { filter: invert(0); } to { filter: invert(1); } }

.wk { display: flex; gap: 0.4rem; }
.wd.on { background: var(--black); color: var(--yellow); }

.filters { display: flex; flex-direction: column; gap: 1rem; margin-bottom: 1.5rem; border-left: 6px solid var(--black); padding-left: 1rem; }
.tabs { display: flex; gap: 0.5rem; align-items: center; }
.tab.on { background: var(--pink); color: #fff; box-shadow: 3px 3px 0 var(--black); transform: translate(-2px, -2px); }
.cnt { margin-left: auto; font-weight: 900; font-size: 1rem; background: var(--black); color: var(--green); padding: 4px 12px; }
.chips { display: flex; gap: 0.5rem; flex-wrap: wrap; }

#list { list-style: none; display: grid; gap: 1rem; padding: 0; perspective: 1000px; }

.item {
  display: flex; align-items: center; gap: 1rem;
  background: #fff; border: var(--border); padding: 1rem 1.2rem;
  box-shadow: var(--shadow-sm);
  transition: transform 0.15s, box-shadow 0.15s, filter 0.2s, opacity 0.2s, background 0.1s;
  position: relative;
  transform-style: preserve-3d;
}
.item:hover {
  background: var(--yellow);
  transform: translate(-6px, -6px) rotateY(-5deg) rotateX(2deg);
  box-shadow: 14px 14px 0 var(--black);
  z-index: 10;
  border-color: var(--pink);
}

.item.enter { animation: brutal-enter 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
@keyframes brutal-enter { from { opacity: 0; transform: translateX(-100%) skew(20deg); box-shadow: 0 0 0 var(--black); } }
.item.leave { animation: brutal-leave 0.3s forwards; }
@keyframes brutal-leave { to { opacity: 0; transform: scale(1.1) rotate(10deg) translateY(50px); filter: blur(10px) invert(1); } }

.item.urgent:not(.done) {
  background: var(--pink); color: #fff; border-color: var(--black);
  box-shadow: var(--shadow-sm), inset 0 0 20px rgba(0,0,0,0.5);
}

.chk {
  flex: none; width: 34px; height: 34px; background: #fff;
  border: var(--border); box-shadow: 3px 3px 0 var(--black);
  display: grid; place-items: center; transition: 0.1s; cursor: crosshair;
}
.chk svg { width: 22px; stroke: var(--black); stroke-width: 4; fill: none; stroke-dasharray: 24; stroke-dashoffset: 24; transition: stroke-dashoffset 0.2s; }
.item:not(.done) .chk:hover { background: var(--cyan); transform: scale(1.2) rotate(-10deg); box-shadow: 4px 4px 0 var(--pink); }

.item.done {
  background: repeating-linear-gradient(45deg, #ccc, #ccc 10px, #bbb 10px, #bbb 20px);
  box-shadow: 0 0 0 var(--black);
  transform: translate(4px, 4px);
  opacity: 0.8;
  border-color: var(--black);
}
.item.done:hover { filter: invert(1); transform: translate(4px, 4px) scale(0.98); }
.item.done .chk { background: var(--black); box-shadow: 0 0 0 var(--black); transform: translate(3px, 3px); }
.item.done .chk svg { stroke-dashoffset: 0; stroke: var(--green); }

.item.pop .chk { animation: brutal-pop 0.3s; }
@keyframes brutal-pop { 50% { transform: scale(1.8) rotate(20deg); background: var(--pink); } }

.body { flex: 1; min-width: 0; display: grid; gap: 0.4rem; }
.t { font-size: 1.35rem; font-weight: 900; position: relative; width: fit-content; max-width: 100%; overflow-wrap: anywhere; text-transform: uppercase; }
.t::after { content: ""; position: absolute; left: -2%; top: 50%; height: 6px; width: 104%; background: var(--black); transform: scaleX(0); transform-origin: left; transition: transform 0.2s; }
.item.done .t::after { transform: scaleX(1); background: var(--pink); mix-blend-mode: hard-light; }

.meta { display: flex; gap: 0.5rem; flex-wrap: wrap; font-size: 0.85rem; font-weight: 800; color: var(--black); }
.meta span { padding: 0.2rem 0.6rem; border: 2px solid var(--black); background: #fff; box-shadow: 2px 2px 0 var(--black); }
.item.urgent .meta span { background: var(--black); color: var(--yellow); border-color: #fff; box-shadow: 2px 2px 0 #fff; }

.p3 { background: var(--red, #ff2a2a) !important; color: #fff !important; }
.p2 { background: var(--yellow) !important; }
.p1 { background: var(--cyan) !important; }
.dday { background: var(--black) !important; color: var(--pink) !important; }

.del { background: #fff; border: 3px solid var(--black); box-shadow: 3px 3px 0 var(--black); color: var(--black); font-size: 1.2rem; font-weight: 900; padding: 0.3rem 0.6rem; transition: 0.1s; }
.del:hover { background: var(--black); color: var(--red, #ff2a2a); transform: translate(-2px, -2px); box-shadow: 5px 5px 0 var(--pink); }

#empty { text-align: center; font-weight: 900; font-size: 1.5rem; color: var(--black); padding: 4rem 1rem; border: var(--border); background: var(--yellow); box-shadow: var(--shadow-lg); text-transform: uppercase; transform: rotate(1deg); }

/* 도넛 차트 (진행률) */
.ringbox { display: flex; align-items: center; gap: 1.5rem; background: var(--black); color: #fff; transform: rotate(-1deg); }
.ring { position: relative; width: 9rem; flex: none; filter: drop-shadow(4px 4px 0 var(--cyan)); }
.ring svg { width: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 14; }
.ring .bg { stroke: #333; }
.ring .fg { stroke: var(--pink); stroke-linecap: square; stroke-dasharray: 327; stroke-dashoffset: 327; transition: stroke-dashoffset 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 2.2rem; color: var(--yellow); font-weight: 900; text-shadow: 3px 3px 0 var(--black); }
.ringbox p { font-weight: 800; font-size: 1.1rem; line-height: 1.5; }
.ringbox p strong { color: var(--green); font-size: 1.5rem; display: block; margin-bottom: 5px; }

.hd { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; font-weight: 900; font-size: 1.3rem; border-bottom: 4px solid var(--black); padding-bottom: 0.5rem; text-transform: uppercase; }
#msg { min-height: 4.6rem; font-size: 1.2rem; font-weight: 800; line-height: 1.6; color: var(--black); }
#msg::after { content: ""; display: inline-block; width: 10px; height: 1.1em; background: var(--pink); margin-left: 4px; vertical-align: -0.15em; animation: brutal-blink 0.8s steps(2) infinite; }
@keyframes brutal-blink { 50% { opacity: 0; background: var(--cyan); } }

/* 주간 차트 */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0.5rem; align-items: end; height: 10rem; border-bottom: 4px solid var(--black); padding-bottom: 0.5rem; }
.wb { background: #fff; border: 2px solid var(--black); display: grid; gap: 0.3rem; height: 100%; grid-template-rows: 1fr auto auto; color: var(--black); font-weight: 900; font-size: 0.85rem; text-align: center; padding: 0; box-shadow: 2px 2px 0 var(--black); transition: 0.1s; }
.bar { align-self: end; width: 100%; height: calc(var(--h) * 1%); min-height: 8px; background: var(--black); border-top: 4px solid var(--black); transition: height 0.4s, background 0.1s; }
.wb:hover { transform: translateY(-4px); background: var(--cyan); box-shadow: 4px 8px 0 var(--black); }
.wb.full .bar { background: var(--pink); }
.wb.sel { background: var(--black); color: var(--yellow); box-shadow: 4px 4px 0 var(--pink); }
.wb.sel .bar { background: var(--green); border-color: var(--yellow); }
.wb.none .bar { background: transparent; border-top: 4px dashed var(--black); opacity: 0.5; }

.ins { display: grid; gap: 0.8rem; color: var(--black); font-size: 1rem; font-weight: 800; }
.ins div { display: flex; justify-content: space-between; border-bottom: 2px dashed var(--black); padding-bottom: 0.3rem; }
.ins b { color: var(--pink); font-size: 1.1rem; text-shadow: 1px 1px 0 var(--black); }

/* 파티클 효과 (Glitch Burst) */
.pt { position: fixed; width: 12px; height: 12px; border: 2px solid var(--black); pointer-events: none; z-index: 999; }

@media(max-width:1000px){ .app{grid-template-columns:1fr} .side{position:static} }
@media(prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }

.cw { position: relative; }
#catlist { position: absolute; top: calc(100% + 6px); left: 0; z-index: 20; min-width: 15rem; max-height: 17rem; overflow: auto; list-style: none; padding: 0; background: var(--cyan); border: var(--border); box-shadow: var(--shadow-lg); animation: brutal-drop 0.2s; }
@keyframes brutal-drop { from { transform: translateY(-10px) scaleY(0); } }
#catlist li { padding: 0.6rem 1rem; border-bottom: 2px solid var(--black); font-weight: 900; cursor: crosshair; }
#catlist li.on, #catlist li:hover { background: var(--black); color: var(--yellow); }
#catlist mark { background: var(--pink); color: #fff; font-weight: 900; padding: 0 2px; border: 2px solid var(--black); }
.rec { color: var(--black); background: var(--yellow); padding: 4px 8px; border: 2px solid var(--black); font-weight: 900; font-size: 0.95rem; box-shadow: 2px 2px 0 var(--black); display: inline-block; margin-top: -10px; }

.t[contenteditable=true] { outline: 4px dashed var(--pink); background: #fff; color: var(--black); padding: 0 0.5rem; min-width: 6rem; text-transform: none; }

/* 토스트 메시지 */
#toast { position: fixed; left: 50%; bottom: 3rem; transform: translateX(-50%) rotate(-2deg); display: flex; gap: 1rem; align-items: center; background: var(--yellow); border: var(--border); padding: 1.2rem 2rem; box-shadow: 12px 12px 0 var(--pink); z-index: 100; font-weight: 900; font-size: 1.2rem; color: var(--black); text-transform: uppercase; animation: brutal-toast 0.4s; }
#toast button { background: var(--black); color: var(--cyan); border: 2px solid var(--black); padding: 4px 12px; box-shadow: 4px 4px 0 #fff; transition: 0.1s; }
#toast button:hover { background: var(--pink); color: #fff; transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--black); }
@keyframes brutal-toast { from { opacity: 0; transform: translate(-50%, 30px) rotate(5deg) scale(0.8); } }

.ft { display: flex; gap: 1rem; justify-content: flex-end; margin-top: 3rem; }
body { padding-top: max(2rem, env(safe-area-inset-top, 0px)); padding-bottom: max(3rem, env(safe-area-inset-bottom, 0px)); }
#toast { bottom: calc(3rem + env(safe-area-inset-bottom, 0px)); }
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <div><h1 title="실험적 글리치 효과">오늘의 할 일</h1><p id="sub"></p></div>
  <nav class="dn"><button class="ib" id="prev" aria-label="이전 날">‹</button><button class="ib" id="tdy">오늘</button><button class="ib" id="next" aria-label="다음 날">›</button></nav>
</header>
<main class="app">
<section>
  <form id="f" class="card add" autocomplete="off">
    <div class="r1"><input id="title" placeholder="무엇을 해야 하나요?" maxlength="80" aria-label="할 일"><button class="btn" type="submit">추가</button></div>
    <div class="r2">
      <label>종류<select id="type">
        <option value="once">1회성</option><option value="daily">매일 반복</option><option value="weekly">요일 반복</option><option value="period">기간 동안 반복</option><option value="window">기간 내 완료</option></select></label>
      <div class="cw"><label>분류<input id="cat" placeholder="입력하면 좁혀져요" size="16" role="combobox" aria-controls="catlist"></label><ul id="catlist" hidden></ul></div>
      <div class="seg" id="pri"><button type="button" data-v="1">낮음</button><button type="button" data-v="2" class="on">보통</button><button type="button" data-v="3">높음</button></div>
      <button type="button" class="chip" id="urg">🔥 긴급</button>
    </div>
    <div class="r3">
      <label data-s="once period window"><span id="l1">날짜</span><input type="date" id="d1"></label>
      <label data-s="period window">끝<input type="date" id="d2"></label>
      <div class="wk" id="wk" data-s="weekly period"></div>
    </div>
  <p id="rec" class="rec" hidden></p></form>
  
  <div class="filters">
    <div class="tabs" id="tabs"><button class="tab on" data-v="all">전체</button><button class="tab" data-v="urgent">🔥 긴급</button><button class="tab" data-v="left">남은 일</button><span class="cnt" id="cnt"></span></div>
    <div class="chips" id="chips"></div>
  </div>
  <ul id="list"></ul>
  <div id="empty" hidden></div>
</section>
<aside class="side">
  <div class="card ringbox" title="마우스 오버 시 화면 반전 (실험적 기능)"><div class="ring"><svg viewBox="0 0 120 120"><circle class="bg" cx="60" cy="60" r="52"/><circle class="fg" id="fg" cx="60" cy="60" r="52"/></svg><b id="pct">0%</b></div><p id="rs"></p></div>
  <div class="card"><div class="hd">오늘의 한마디</div><p id="msg"></p><button class="ib" id="more" style="margin-top:1.2rem">다른 말 듣기</button></div>
  <div class="card"><div class="hd">최근 7일</div><div class="week" id="week"></div></div>
  <div class="card"><div class="hd">나의 흐름</div><div class="ins" id="ins"></div></div>
</aside>
</main>
<footer class="ft"><button class="ib" id="exp">백업 저장</button><button class="ib" id="imp">백업 불러오기</button><input type="file" id="file" accept=".json" hidden></footer>
<div id="toast" hidden></div>
</div>
<script>
const $=s=>document.querySelector(s),KEY='today-todo-v1',DOW=['일','월','화','수','목','금','토'];
const ICON={학업:'📚',과제:'📝',시험:'🎯',수업:'🏫',팀플:'🤝',동아리:'🎭',취업:'💼',자격증:'🏅',어학:'🔤',운동:'🏃',건강:'💊',식사:'🍚',수면:'🌙',생활:'🏠',청소:'🧹',빨래:'🧺',쇼핑:'🛒',약속:'👥',가족:'👪',금융:'💳',행정:'📄',여가:'🎬',취미:'🎨',독서:'📖',자기계발:'🌱',이동:'🚌',기타:'🏷️'};
let S={tasks:[],done:{}};try{S=Object.assign(S,JSON.parse(localStorage.getItem(KEY)))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const pad=n=>String(n).padStart(2,'0'),fmt=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const TD=()=>fmt(new Date()),P=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};

function lines(){const st=dstat(vk),r=st.total?st.done/st.total:null,left=st.total-st.done,h=new Date().getHours(),sk=streak(),y=rate(AD(TD(),-1)),L=[];

  if(/나중에|여유|언젠가/.test(s))r.pri=1;
  const wk=s.match(/매주\s*([월화수목금토일][월화수목금토일 ·,]*)/)||s.match(/([월화수목금토일][월화수목금토일 ·,]*)요일마다/);
  if(/매일|날마다|하루도/.test(s))r.type='daily';
  else if(wk){r.type='weekly';r.days=[...wk[1]].filter(c=>W.includes(c)).map(c=>W.indexOf(c))}
  else if(/평일마다|매 ?평일/.test(s)){r.type='weekly';r.days=[1,2,3,4,5]}
  else if(/매주|주 ?\d회/.test(s)){r.type='weekly';r.days=[P(vk).getDay()]}
  else{const d=dateOf(s);if(d){if(/까지|마감|기한|전에/.test(s)){r.type='window';r.d2=d}else{r.type='once';r.d1=d}}}
  return r}
function recommend(){const r=infer($('#title').value),T=TD(),b=vk>T?vk:T;
  if(!touched.cat)ci.value=r.cat||'';
  if(!touched.pri)setPri(r.pri||2);
  if(!touched.urg)setUrg(!!r.urg);
  if(!touched.type){$('#type').value=r.type||'once';typeUI()}
  if(!touched.date){$('#d1').value=r.d1||($('#type').value==='once'?vk:b);$('#d2').value=r.d2||AD($('#d1').value,6)}
  if(!touched.days)setDays(r.days||[]);
  const p=[];if(r.cat)p.push((ICON[r.cat]||'')+' '+r.cat);if(r.type)p.push($('#type').selectedOptions[0].text);if(r.pri===3)p.push('HIGH-PRIORITY');if(r.urg)p.push('URGENT');
  const h=$('#rec');h.hidden=!p.length;h.textContent=p.length?'[AI DETECTED]: '+p.join(' // '):''}
$('#title').addEventListener('input',recommend);

const hl=(c,q)=>{const i=q?c.toLowerCase().indexOf(q.toLowerCase()):-1;return i<0?esc(c):esc(c.slice(0,i))+'<mark>'+esc(c.slice(i,i+q.length))+'</mark>'+esc(c.slice(i+q.length))};
function catShow(){const raw=ci.value.trim(),q=raw.toLowerCase(),s=new Set(Object.keys(ICON)),ul=$('#catlist');S.tasks.forEach(t=>t.cat&&s.add(t.cat));
  const a=[...s].filter(c=>!q||c.toLowerCase().includes(q)||cho(c).includes(q));
  ul.innerHTML=a.map((c,i)=>`<li data-c="${esc(c)}"${i===cidx?' class="on"':''}>${ICON[c]||'🏷️'} ${hl(c,raw)}</li>`).join('')+(raw&&!a.includes(raw)?`<li class="new" data-c="${esc(raw)}">＋ “${esc(raw)}” 새 분류 만들기</li>`:'');
  ul.hidden=!ul.children.length}
const pick=c=>{ci.value=c;touched.cat=true;$('#catlist').hidden=true};
ci.addEventListener('input',()=>{touched.cat=true;cidx=-1;catShow()});
ci.addEventListener('focus',()=>{cidx=-1;catShow()});
ci.addEventListener('blur',()=>$('#catlist').hidden=true);
ci.addEventListener('keydown',e=>{const li=[...$('#catlist').children];
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!li.length)return;cidx=(cidx+(e.key==='ArrowDown'?1:-1)+li.length)%li.length;li.forEach((x,i)=>x.classList.toggle('on',i===cidx))}
  else if(e.key==='Enter'&&cidx>=0&&!$('#catlist').hidden){e.preventDefault();pick(li[cidx].dataset.c)}
  else if(e.key==='Escape')$('#catlist').hidden=true});
$('#catlist').addEventListener('mousedown',e=>{const li=e.target.closest('li');if(li){e.preventDefault();pick(li.dataset.c)}});

list.addEventListener('dblclick',e=>{const s=e.target.closest('.t');if(!s||s.isContentEditable)return;const t=S.tasks.find(x=>x.id==s.closest('li').dataset.id);if(!t)return;
  s.contentEditable='true';s.focus();getSelection().selectAllChildren(s);
  s.onkeydown=k=>{if(k.key==='Enter'){k.preventDefault();s.blur()}if(k.key==='Escape'){s.textContent=t.title;s.blur()}};
  s.onblur=()=>{s.contentEditable='false';const v=s.textContent.trim().slice(0,80);if(v&&v!==t.title){t.title=v;save()}else s.textContent=t.title;render()}});
let tt;function toast(msg,btn,fn){const el=$('#toast');el.innerHTML=`<span>${msg}</span>`+(btn?`<button>${btn}</button>`:'');el.hidden=false;if(btn)el.lastChild.onclick=()=>{fn();el.hidden=true};clearTimeout(tt);tt=setTimeout(()=>el.hidden=true,5000)}
$('#exp').onclick=async()=>{try{const d=await window.claude.use('downloads');if(!d)return toast('ERROR: 저장 실패');await d.save({filename:`todo-backup-${TD()}.json`,data:JSON.stringify(S)})}catch(e){if(!e||e.code!=='declined')toast('ERROR: 저장 실패')}};
(async()=>{try{if(!(await window.claude.use('downloads')))$('#exp').hidden=true}catch(e){$('#exp').hidden=true}})();
$('#imp').onclick=()=>$('#file').click();
$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(x=>{try{const d=JSON.parse(x);if(!Array.isArray(d.tasks))throw 0;S={tasks:d.tasks,done:d.done||{}};save();render();toast('SUCCESS: 백업 복원됨')}catch(_){toast('ERROR: 파일 손상')}});e.target.value=''};
document.addEventListener('keydown',e=>{const a=document.activeElement;if(e.key==='/'&&!/INPUT|SELECT/.test(a.tagName)&&!a.isContentEditable){e.preventDefault();$('#title').focus()}});
$('#d1').value=vk;$('#d2').value=AD(vk,6);typeUI();allCats();render();
</script>
</body>
</html>
