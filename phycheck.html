<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>문태양 - 운동 체크리스트 앱</title>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css');
    
    :root {
      --bg: #fdfbf7;
      --black: #111111;
      --border: 3px solid var(--black);
      --border-thick: 4px solid var(--black);
      
      --yellow: #ffd83b;
      --red: #ff4757;
      --blue: #3e51ff;
      --green: #2ed573;
      --pink: #ff9ff3;
      --cyan: #48dbfb;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background: var(--bg); 
      color: var(--black); 
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      position: relative;
      padding-top: 70px;
    }
    
    .fixed-top-bar {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 60px;
      background: var(--yellow);
      border-bottom: var(--border-thick);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 24px;
      z-index: 2000;
      box-shadow: 0 4px 0 var(--black);
    }

    .fixed-top-bar .current-time {
      font-weight: 900;
      font-size: 0.95rem;
      background: white;
      border: var(--border);
      padding: 4px 10px;
      box-shadow: 2px 2px 0 var(--black);
    }

    .fixed-top-bar .icon-group {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .fixed-top-bar .icon-btn {
      width: 38px; height: 38px;
      background: white;
      border: var(--border);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 3px 3px 0 var(--black);
      cursor: pointer;
      font-weight: 900; font-size: 0.9rem;
      transition: all 0.1s ease;
      text-decoration: none;
      color: var(--black);
      position: relative;
    }

    .fixed-top-bar .icon-btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 5px 5px 0 var(--black);
      background: var(--cyan);
    }

    .wrap { max-width: 900px; margin: 0 auto; padding: 0 24px 80px; }
    a { color: inherit; text-decoration: none; }
    
    .top {
      display: flex; justify-content: space-between; align-items: baseline;
      padding: 24px 0; 
      border-bottom: var(--border-thick);
      font-size: 1rem; font-weight: 800;
    }
    .top b { 
      font-size: 1.4rem; 
      letter-spacing: 0.05em; 
      text-transform: uppercase; 
      background: var(--black); 
      color: var(--yellow);
      padding: 4px 12px;
      transform: skew(-5deg);
    }
    .top nav { display: flex; gap: 24px; }
    .top nav a { position: relative; padding: 4px 8px; }
    .top nav a:hover { background: var(--black); color: var(--bg); }

    .hero { padding: 60px 0 40px; border-bottom: var(--border-thick); }
    .hero .small { 
      display: inline-block; font-size: 1rem; font-weight: 800; 
      background: var(--cyan); border: var(--border); padding: 4px 12px;
      box-shadow: 4px 4px 0 var(--black); margin-bottom: 20px;
    }
    .hero h1 {
      font-size: clamp(2rem, 5vw, 3.5rem);
      line-height: 1.2; font-weight: 900;
    }
    .hero h1 span { 
      display: inline-block;
      color: var(--black); 
      background: var(--yellow);
      border: var(--border-thick);
      padding: 0 16px;
      box-shadow: 6px 6px 0 var(--black);
    }
    .hero p { 
      max-width: 38em; margin-top: 20px; font-size: 1.05rem; font-weight: 600;
      border-left: 6px solid var(--black); padding-left: 20px;
    }

    .game-card {
      background: white;
      border: var(--border-thick);
      box-shadow: 8px 8px 0 var(--black);
      padding: 40px;
      margin-top: 48px;
    }

    .status-banner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--yellow);
      border: var(--border);
      padding: 16px 20px;
      font-weight: 900;
      font-size: 1.1rem;
      box-shadow: 4px 4px 0 var(--black);
      margin-bottom: 24px;
    }

    .add-form {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }
    .add-form input {
      flex: 1;
      padding: 14px 16px;
      font-size: 1.05rem;
      font-weight: 900;
      border: var(--border-thick);
      box-shadow: 4px 4px 0 var(--black);
      background: white;
    }

    .btn {
      font-family: inherit;
      font-size: 1.1rem;
      font-weight: 900;
      padding: 14px 28px;
      background: var(--yellow);
      border: var(--border);
      box-shadow: 4px 4px 0 var(--black);
      cursor: pointer;
      transition: all 0.1s;
    }
    .btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0 var(--black);
      background: var(--cyan);
    }
    .btn-green { background: var(--green); }
    .btn-red { background: var(--red); color: white; }

    .checklist {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .check-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fdfbf7;
      border: var(--border);
      padding: 16px 20px;
      box-shadow: 4px 4px 0 var(--black);
      font-weight: 900;
      font-size: 1.1rem;
    }
    .check-item.completed {
      background: #e2f0d9;
      text-decoration: line-through;
      color: #666;
    }
    .check-info {
      display: flex;
      align-items: center;
      gap: 16px;
      cursor: pointer;
    }
    .check-info input[type="checkbox"] {
      width: 22px;
      height: 22px;
      cursor: pointer;
      accent-color: var(--black);
    }

    footer { 
      padding: 40px 0; color: white; background: var(--black);
      font-size: 1rem; font-weight: 800; text-align: center;
      border-top: var(--border-thick); margin-top: 80px;
    }
  </style>
</head>
<body>

<div class="fixed-top-bar">
  <div class="current-time" id="currentTimeDisplay">--:--:--</div>
  <div class="icon-group">
    <a href="https://github.com/nlasdnfkl2" target="_blank" rel="noopener noreferrer" class="icon-btn" title="GitHub">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"></path><path d="M9 18c-4.51 2-5-2-7-2"></path></svg>
    </a>
    <a href="mailto:nn80300@naver.com" class="icon-btn" title="Email">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"></rect><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></svg>
    </a>
    <a href="https://blog.naver.com/nn80300" target="_blank" rel="noopener noreferrer" class="icon-btn" title="Blog">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"></path><path d="M6 6h10"></path><path d="M6 10h10"></path></svg>
    </a>
    <div class="icon-btn music-wrap" id="muteToggleBtn" title="음소거 토글" style="cursor: pointer;">
      <svg id="soundOnIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
      <svg id="soundOffIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display: none;"><line x1="1" y1="1" x2="23" y2="23"></line><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
    </div>
  </div>
</div>

<div id="youtubePlayerContainer" style="display:none;"></div>

<div class="wrap">
  <div class="top">
    <b>문태양</b>
    <nav>
      <a href="#phyCheck">실습 17 · 운동 체크리스트 앱</a>
    </nav>
  </div>

  <header class="hero">
    <p class="small">실습 17[cite: 8] · 11주차 중상급 앱 만들기</p>
    <h1>매일의 운동 기록을 관리하는<br><span>운동 체크리스트 앱</span></h1>
    <p>오늘의 운동 목록을 추가·삭제하고 완료 상태를 점검하여 달성 현황을 한눈에 확인하는 앱입니다[cite: 8].</p>
  </header>

  <div class="game-card" id="phyCheck">
    <div class="status-banner">
      <span>오늘의 운동 달성 현황</span>
      <span id="statusCount">0 / 0 완료 (0%)</span>
    </div>

    <form class="add-form" id="addForm">
      <input type="text" id="exerciseInput" placeholder="추가할 운동 종목 입력 (예: 팔굽혀펴기 50회)" autocomplete="off">
      <button type="submit" class="btn btn-green">운동 추가</button>
    </form>

    <div class="checklist" id="checklistContainer">
      <!-- 동적 렌더링 -->
    </div>
  </div>

  <footer>
    © 문태양. 바이브코딩 실습 17 포트폴리오.
  </footer>
</div>

<script>
  let ytPlayer;
  let isUserPaused = false;
  function onYouTubeIframeAPIReady() {
    ytPlayer = new YT.Player('youtubePlayerContainer', {
      height: '0', width: '0',
      videoId: 'PkVmztKY9PU',
      playerVars: { 'autoplay': 1, 'loop': 1, 'playlist': 'PkVmztKY9PU', 'controls': 0 },
      events: {
        'onReady': (event) => { event.target.playVideo(); event.target.setVolume(50); }
      }
    });
  }
  const tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  document.getElementsByTagName('script')[0].parentNode.insertBefore(tag, document.getElementsByTagName('script')[0]);

  document.addEventListener("DOMContentLoaded", () => {
    const timeDisplay = document.getElementById('currentTimeDisplay');
    function updateClock() {
      const now = new Date();
      timeDisplay.textContent = `${now.getFullYear()}.${String(now.getMonth() + 1).padStart(2, '0')}.${String(now.getDate()).padStart(2, '0')} ${now.toLocaleTimeString('ko-KR', { hour12: false })}`;
    }
    updateClock();
    setInterval(updateClock, 1000);

    const muteToggleBtn = document.getElementById('muteToggleBtn');
    const soundOnIcon = document.getElementById('soundOnIcon');
    const soundOffIcon = document.getElementById('soundOffIcon');
    let isMuted = false;
    muteToggleBtn.addEventListener('click', () => {
      if (!ytPlayer || typeof ytPlayer.isMuted !== 'function') return;
      if (isMuted) {
        ytPlayer.unMute();
        soundOnIcon.style.display = 'block';
        soundOffIcon.style.display = 'none';
        isMuted = false;
      } else {
        ytPlayer.mute();
        soundOnIcon.style.display = 'none';
        soundOffIcon.style.display = 'block';
        isMuted = true;
      }
    });

    window.addEventListener('blur', () => { if (ytPlayer?.pauseVideo) ytPlayer.pauseVideo(); });
    window.addEventListener('focus', () => { if (!isUserPaused && ytPlayer?.playVideo) ytPlayer.playVideo(); });

    // 실습 17: 운동 체크리스트 로직
    let exercises = [
      { name: "푸시업 50개", completed: true },
      { name: "스쿼트 100개", completed: false },
      { name: "러닝머신 30분", completed: false },
      { name: "플랭크 3분", completed: false }
    ];

    const checklistContainer = document.getElementById('checklistContainer');
    const statusCount = document.getElementById('statusCount');
    const addForm = document.getElementById('addForm');
    const exerciseInput = document.getElementById('exerciseInput');

    function renderList() {
      checklistContainer.innerHTML = '';
      let completedCount = 0;

      exercises.forEach((ex, index) => {
        if (ex.completed) completedCount++;

        const item = document.createElement('div');
        item.className = `check-item ${ex.completed ? 'completed' : ''}`;
        item.innerHTML = `
          <label class="check-info">
            <input type="checkbox" data-index="${index}" ${ex.completed ? 'checked' : ''}>
            <span>${ex.name}</span>
          </label>
          <button class="btn btn-red" data-index="${index}" style="padding: 6px 12px; font-size: 0.85rem;">삭제</button>
        `;
        checklistContainer.appendChild(item);
      });

      const total = exercises.length;
      const percent = total > 0 ? Math.round((completedCount / total) * 100) : 0;
      statusCount.textContent = `${completedCount} / ${total} 완료 (${percent}%)`;
    }

    checklistContainer.addEventListener('change', (e) => {
      if (e.target.type === 'checkbox') {
        const idx = e.target.dataset.index;
        exercises[idx].completed = e.target.checked;
        renderList();
      }
    });

    checklistContainer.addEventListener('click', (e) => {
      if (e.target.tagName === 'BUTTON') {
        const idx = e.target.dataset.index;
        exercises.splice(idx, 1);
        renderList();
      }
    });

    addForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const val = exerciseInput.value.trim();
      if (val) {
        exercises.push({ name: val, completed: false });
        exerciseInput.value = '';
        renderList();
      }
    });

    renderList();
  });
</script>

</body>
</html>
