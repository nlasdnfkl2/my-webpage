<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>문태양 - 운동 체크리스트 앱</title>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css');
    
    :root {
      --bg: #fdfbf7;
      --black: #111111;
      --border: 3px solid var(--black);
      --border-thick: 4px solid var(--black);
      
      --yellow: #ffd83b;
      --red: #ff4757;
      --blue: #3e51ff;
      --green: #2ed573;
      --pink: #ff9ff3;
      --cyan: #48dbfb;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background: var(--bg); color: var(--black); line-height: 1.7;
      -webkit-font-smoothing: antialiased; position: relative; padding-top: 70px;
    }
    
    .fixed-top-bar {
      position: fixed; top: 0; left: 0; width: 100%; height: 60px;
      background: var(--yellow); border-bottom: var(--border-thick);
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 24px; z-index: 2000; box-shadow: 0 4px 0 var(--black);
    }
    .fixed-top-bar .current-time {
      font-weight: 900; font-size: 0.95rem; background: white;
      border: var(--border); padding: 4px 10px; box-shadow: 2px 2px 0 var(--black);
    }
    .fixed-top-bar .icon-group { display: flex; gap: 12px; align-items: center; }
    .fixed-top-bar .icon-btn {
      width: 38px; height: 38px; background: white; border: var(--border); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 3px 3px 0 var(--black); cursor: pointer; font-weight: 900;
      transition: all 0.1s ease; text-decoration: none; color: var(--black);
    }
    .fixed-top-bar .icon-btn:hover {
      transform: translate(-2px, -2px); box-shadow: 5px 5px 0 var(--black); background: var(--cyan);
    }

    .wrap { max-width: 800px; margin: 0 auto; padding: 0 24px 80px; }
    a { color: inherit; text-decoration: none; }
    
    .top {
      display: flex; justify-content: space-between; align-items: baseline;
      padding: 24px 0; border-bottom: var(--border-thick); font-size: 1rem; font-weight: 800;
    }
    .top b { 
      font-size: 1.4rem; letter-spacing: 0.05em; text-transform: uppercase; 
      background: var(--black); color: var(--yellow); padding: 4px 12px; transform: skew(-5deg);
    }
    .top nav { display: flex; gap: 24px; }
    .top nav a:hover { background: var(--black); color: var(--bg); }

    .hero { padding: 60px 0 40px; border-bottom: var(--border-thick); }
    .hero .small { 
      display: inline-block; font-size: 1rem; font-weight: 800; 
      background: var(--cyan); border: var(--border); padding: 4px 12px;
      box-shadow: 4px 4px 0 var(--black); margin-bottom: 20px;
    }
    .hero h1 { font-size: clamp(2rem, 5vw, 3.5rem); line-height: 1.2; font-weight: 900; }
    .hero h1 span { 
      display: inline-block; color: var(--black); background: var(--yellow);
      border: var(--border-thick); padding: 0 16px; box-shadow: 6px 6px 0 var(--black);
    }
    .hero p { max-width: 42em; margin-top: 20px; font-size: 1.05rem; font-weight: 600; border-left: 6px solid var(--black); padding-left: 20px; }

    .game-card {
      background: white; border: var(--border-thick); box-shadow: 8px 8px 0 var(--black);
      padding: 40px; margin-top: 48px;
    }
    @media(max-width: 600px) { .game-card { padding: 24px; } }

    /* 대시보드 진행률 스타일 */
    .dashboard {
      background: #f0f3f6; border: var(--border); padding: 24px; margin-bottom: 32px;
      box-shadow: 4px 4px 0 var(--black); text-align: center;
    }
    .dashboard h2 { font-size: 1.5rem; font-weight: 900; margin-bottom: 16px; }
    
    .progress-container {
      width: 100%; height: 32px; border: var(--border-thick); background: white;
      position: relative; margin-bottom: 12px;
    }
    .progress-bar {
      height: 100%; background: var(--green); width: 0%; transition: width 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .progress-text {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      font-weight: 900; font-size: 1.1rem; color: var(--black); text-shadow: 1px 1px 0 white, -1px -1px 0 white, 1px -1px 0 white, -1px 1px 0 white;
    }
    .status-msg { font-weight: 800; font-size: 1.1rem; color: var(--blue); }

    /* 입력 폼 */
    .add-form {
      display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap;
    }
    .input-box { flex: 2; min-width: 200px; }
    .input-box-sub { flex: 1; min-width: 120px; }
    
    input[type="text"] {
      width: 100%; padding: 14px 16px; font-family: inherit; font-size: 1.05rem;
      font-weight: 800; border: var(--border-thick); box-shadow: 4px 4px 0 var(--black);
      background: white; outline: none; transition: transform 0.1s;
    }
    input[type="text"]:focus { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--black); }

    .btn {
      font-family: inherit; font-size: 1.1rem; font-weight: 900; padding: 14px 28px;
      background: var(--yellow); border: var(--border-thick); box-shadow: 4px 4px 0 var(--black);
      cursor: pointer; transition: all 0.1s; display: inline-flex; align-items: center; justify-content: center;
      white-space: nowrap;
    }
    .btn:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--black); background: var(--cyan); }
    .btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--black); }

    /* 체크리스트 영역 */
    .todo-list { list-style: none; display: flex; flex-direction: column; gap: 16px; }
    
    .todo-item {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      background: white; border: var(--border-thick); padding: 16px 20px;
      box-shadow: 6px 6px 0 var(--black); transition: all 0.2s;
    }
    .todo-item:hover { transform: translateX(4px); }
    .todo-item.completed { background: #e0e0e0; border-color: #555; box-shadow: 4px 4px 0 #555; }
    
    .todo-content { flex: 1; display: flex; align-items: center; gap: 16px; cursor: pointer; overflow: hidden; }
    
    /* 커스텀 체크박스 */
    .checkbox {
      width: 28px; height: 28px; flex-shrink: 0; border: var(--border); background: white;
      display: flex; align-items: center; justify-content: center; transition: all 0.2s;
    }
    .todo-item.completed .checkbox { background: var(--green); }
    .todo-item.completed .checkbox::after {
      content: '✔'; font-weight: 900; color: var(--black); font-size: 1.2rem;
    }

    .todo-text { display: flex; flex-direction: column; }
    .todo-title { font-weight: 900; font-size: 1.2rem; transition: color 0.2s; }
    .todo-item.completed .todo-title { text-decoration: line-through; color: #666; }
    .todo-sub { font-weight: 600; font-size: 0.95rem; color: #555; margin-top: 4px; }
    
    .delete-btn {
      background: var(--red); color: white; border: var(--border); font-weight: 900;
      padding: 8px 12px; cursor: pointer; box-shadow: 3px 3px 0 var(--black); transition: all 0.1s;
    }
    .delete-btn:hover { transform: translate(-2px, -2px); box-shadow: 5px 5px 0 var(--black); }
    .delete-btn:active { transform: translate(1px, 1px); box-shadow: 2px 2px 0 var(--black); }

    .empty-state { text-align: center; padding: 40px 20px; font-weight: 800; color: #555; }

    footer { padding: 40px 0; color: white; background: var(--black); font-size: 1rem; font-weight: 800; text-align: center; border-top: var(--border-thick); margin-top: 80px; }
  </style>
</head>
<body>

<div class="fixed-top-bar">
  <div class="current-time" id="currentTimeDisplay">--:--:--</div>
  <div class="icon-group">
    <a href="https://github.com/nlasdnfkl2" target="_blank" class="icon-btn" title="GitHub">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"></path><path d="M9 18c-4.51 2-5-2-7-2"></path></svg>
    </a>
  </div>
</div>

<div class="wrap">
  <div class="top">
    <b>문태양</b>
    <nav>
      <a href="#phyCheck">실습 17 · 운동 체크리스트 앱</a>
    </nav>
  </div>

  <header class="hero">
    <p class="small">실습 17 · 기록이 남는 공유형 웹 앱</p>
    <h1>오운완!<br><span>매일 운동 체크리스트</span></h1>
    <p>계획한 운동 중 완료한 항목을 직관적으로 확인하세요. 브라우저 저장소(LocalStorage)를 사용하여 창을 닫아도 나의 운동 기록과 달성 현황이 그대로 유지됩니다.</p>
  </header>

  <div class="game-card" id="phyCheck">
    
    <!-- 달성도 대시보드 -->
    <div class="dashboard">
      <h2>🔥 오늘의 운동 달성도</h2>
      <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
        <div class="progress-text" id="progressText">0 / 0 완료</div>
      </div>
      <div class="status-msg" id="statusMsg">오늘의 운동 계획을 추가해 보세요!</div>
    </div>

    <!-- 입력 폼 -->
    <form class="add-form" id="todoForm">
      <div class="input-box">
        <input type="text" id="todoInput" placeholder="운동 이름 (예: 스쿼트, 런닝)" required>
      </div>
      <div class="input-box-sub">
        <!-- 횟수나 시간을 추가해야 할 때를 대비한 서브 입력란 -->
        <input type="text" id="todoSubInput" placeholder="목표 (예: 15회 3세트, 30분)">
      </div>
      <button type="submit" class="btn">추가하기</button>
    </form>

    <!-- 체크리스트 -->
    <ul class="todo-list" id="todoList">
      <!-- 자바스크립트로 리스트가 생성됩니다. -->
    </ul>
    
  </div>

  <footer>
    © 문태양. 바이브코딩 실습 17 포트폴리오.
  </footer>
</div>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    // 실시간 시계 업데이트
    const timeDisplay = document.getElementById('currentTimeDisplay');
    function updateClock() {
      const now = new Date();
      timeDisplay.textContent = `${now.getFullYear()}.${String(now.getMonth() + 1).padStart(2, '0')}.${String(now.getDate()).padStart(2, '0')} ${now.toLocaleTimeString('ko-KR', { hour12: false })}`;
    }
    updateClock();
    setInterval(updateClock, 1000);

    // DOM 요소
    const todoForm = document.getElementById('todoForm');
    const todoInput = document.getElementById('todoInput');
    const todoSubInput = document.getElementById('todoSubInput');
    const todoList = document.getElementById('todoList');
    
    const progressBar = document.getElementById('progressBar');
    const progressText = document.getElementById('progressText');
    const statusMsg = document.getElementById('statusMsg');

    // 상태 관리 (localStorage 사용)
    const STORAGE_KEY = 'vibe_exercise_checklist';
    let todos = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

    // 데이터 저장
    function saveTodos() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
      renderTodos();
    }

    // 통계 업데이트
    function updateStats() {
      const total = todos.length;
      const completed = todos.filter(t => t.done).length;
      const percentage = total === 0 ? 0 : Math.round((completed / total) * 100);

      progressBar.style.width = `${percentage}%`;
      progressText.textContent = `${completed} / ${total} 완료 (${percentage}%)`;

      if (total === 0) {
        statusMsg.textContent = "오늘의 운동 계획을 추가해 보세요!";
        statusMsg.style.color = "var(--blue)";
      } else if (percentage === 100) {
        statusMsg.textContent = "🎉 완벽해요! 오늘의 운동을 모두 마쳤습니다!";
        statusMsg.style.color = "var(--green)";
      } else if (percentage >= 50) {
        statusMsg.textContent = "💪 절반 이상 해냈어요! 조금만 더 힘내세요!";
        statusMsg.style.color = "var(--black)";
      } else {
        statusMsg.textContent = "🏃 시작이 반입니다! 운동을 하나씩 클리어해보세요.";
        statusMsg.style.color = "var(--red)";
      }
    }

    // 렌더링
    function renderTodos() {
      todoList.innerHTML = '';

      if (todos.length === 0) {
        todoList.innerHTML = '<div class="empty-state">아직 등록된 운동이 없습니다.<br>위 입력창에서 새로운 운동을 추가해주세요.</div>';
      } else {
        todos.forEach((todo, index) => {
          const li = document.createElement('li');
          li.className = `todo-item ${todo.done ? 'completed' : ''}`;
          
          li.innerHTML = `
            <div class="todo-content" data-index="${index}">
              <div class="checkbox"></div>
              <div class="todo-text">
                <span class="todo-title">${todo.title}</span>
                ${todo.sub ? `<span class="todo-sub">🎯 목표: ${todo.sub}</span>` : ''}
              </div>
            </div>
            <button class="delete-btn" data-index="${index}">삭제</button>
          `;
          todoList.appendChild(li);
        });
      }

      updateStats();
    }

    // 아이템 추가
    todoForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const title = todoInput.value.trim();
      const sub = todoSubInput.value.trim();
      
      if (title) {
        todos.push({ title, sub, done: false });
        todoInput.value = '';
        todoSubInput.value = '';
        todoInput.focus();
        saveTodos();
      }
    });

    // 아이템 완료/해제 및 삭제 (이벤트 위임)
    todoList.addEventListener('click', (e) => {
      const deleteBtn = e.target.closest('.delete-btn');
      const contentBtn = e.target.closest('.todo-content');

      if (deleteBtn) {
        const index = deleteBtn.dataset.index;
        if(confirm('이 운동 항목을 삭제하시겠습니까?')) {
          todos.splice(index, 1);
          saveTodos();
        }
      } else if (contentBtn) {
        const index = contentBtn.dataset.index;
        todos[index].done = !todos[index].done; // 상태 토글
        saveTodos();
      }
    });

    // 초기 화면 렌더링
    renderTodos();
  });
</script>

</body>
</html>
