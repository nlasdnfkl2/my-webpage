<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>문태양 - 서명 및 도장 생성기 (Neo-Brutalism)</title>
    
    <!-- Google Fonts 확장 목록 로드 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Caveat:wght@400..700&family=Dancing+Script:wght@400..700&family=Do+Hyeon&family=Dongle:wght@300;400;700&family=Gamja+Flower&family=Gowun+Batang:wght@400;700&family=Hahmlet:wght@100..900&family=Jua&family=Nanum+Myeongjo:wght@400;700;800&family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@100..900&family=Noto+Serif+KR:wght@200..900&family=Pacifico&family=Song+Myung&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* 네오 브루탈리즘 테마 변수 (기존 프로젝트들과 통일) */
        :root {
            --bg: #dfdcd3;
            --black: #0f0f0f;
            --yellow: #ffd83b;
            --pink: #ff4757;
            --cyan: #48dbfb;
            --green: #2ed573;
            --stamp-color: #E53935; /* 아시아 전통 도장 붉은색 */
            --border-thick: 4px solid var(--black);
            --border: 3px solid var(--black);
            --shadow-sm: 4px 4px 0 var(--black);
            --shadow-lg: 8px 8px 0 var(--black);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans KR', sans-serif;
        }

        /* 전역 노이즈 텍스처 */
        body::after {
            content: "";
            position: fixed; inset: 0;
            pointer-events: none; z-index: 9999;
            background: url('data:image/svg+xml;utf8,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="n"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="1.5" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23n)" opacity="0.3"/%3E%3C/svg%3E');
            opacity: 0.12;
            mix-blend-mode: overlay;
        }

        body {
            background-color: var(--bg);
            color: var(--black);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            /* 닷 패턴 배경 */
            background-image: radial-gradient(var(--black) 1.5px, transparent 1.5px);
            background-size: 24px 24px;
            padding-top: calc(80px + 2rem);
        }

        /* 상단 고정 바 */
        .fixed-top-bar {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 60px;
            background: var(--yellow);
            border-bottom: var(--border-thick);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            z-index: 2000;
            box-shadow: 0 4px 0 var(--black);
        }

        .current-time {
            font-weight: 900;
            font-size: 0.95rem;
            background: white;
            border: var(--border);
            padding: 4px 10px;
            box-shadow: 2px 2px 0 var(--black);
        }

        .app-container {
            width: 100%;
            max-width: 520px;
            background-color: #ffffff;
            border: var(--border-thick);
            box-shadow: var(--shadow-lg);
            padding: 30px;
        }

        /* 탭 버튼 네비게이션 */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            font-size: 18px;
            font-weight: 900;
            background-color: #ffffff;
            color: var(--black);
            border: var(--border);
            box-shadow: var(--shadow-sm);
            cursor: pointer;
            transition: all 0.1s ease;
            text-align: center;
            text-transform: uppercase;
        }

        .tab-btn.active {
            background-color: var(--yellow);
            color: var(--black);
            box-shadow: 2px 2px 0 var(--black);
            transform: translate(2px, 2px);
        }

        /* 컨텐츠 영역 */
        .content-box {
            display: none;
            animation: fadeIn 0.2s ease-in-out;
        }

        .content-box.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 서브 탭 (모드 토글) */
        .mode-toggle {
            display: flex;
            margin-bottom: 20px;
            border: var(--border);
            background: var(--black);
            padding: 3px;
            gap: 3px;
            box-shadow: var(--shadow-sm);
        }

        .mode-btn {
            flex: 1;
            padding: 10px;
            font-weight: 900;
            background: #ffffff;
            color: var(--black);
            border: 2px solid var(--black);
            cursor: pointer;
            text-transform: uppercase;
        }
        
        .mode-btn.active {
            background: var(--yellow);
            color: var(--black);
        }

        /* 컨트롤 그룹 및 입력 폼 */
        .control-group {
            margin-bottom: 20px;
        }

        .control-group label {
            display: block;
            font-weight: 900;
            margin-bottom: 8px;
            font-size: 15px;
            text-transform: uppercase;
        }

        .brutal-input {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: var(--border);
            background-color: #ffffff;
            color: var(--black);
            border-radius: 0;
            box-shadow: var(--shadow-sm);
            font-weight: 800;
            transition: all 0.1s ease;
            appearance: none;
        }

        .brutal-input:focus {
            outline: none;
            background-color: var(--yellow);
            box-shadow: 2px 2px 0 var(--black);
            transform: translate(2px, 2px);
        }

        /* 캔버스 래퍼 */
        .canvas-wrapper {
            border: var(--border-thick);
            background-color: #ffffff;
            box-shadow: var(--shadow-lg);
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px 0;
            position: relative;
            touch-action: none;
            overflow: hidden;
        }

        /* 체커보드 배경 (투명 표시) */
        .canvas-wrapper::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 0;
            background-image: 
                linear-gradient(45deg, #e0e0e0 25%, transparent 25%), 
                linear-gradient(-45deg, #e0e0e0 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #e0e0e0 75%), 
                linear-gradient(-45deg, transparent 75%, #e0e0e0 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            pointer-events: none;
        }

        canvas {
            position: relative;
            z-index: 1;
        }
        
        #sigCanvas { cursor: crosshair; }

        /* 액션 버튼 */
        .btn-group {
            display: flex;
            gap: 15px;
        }

        .btn-action {
            flex: 1;
            padding: 14px;
            font-size: 16px;
            font-weight: 900;
            border: var(--border-thick);
            background-color: #ffffff;
            color: var(--black);
            box-shadow: var(--shadow-sm);
            cursor: pointer;
            transition: all 0.1s ease;
            text-align: center;
            text-transform: uppercase;
        }

        .btn-action.primary {
            background-color: var(--pink);
            color: #ffffff;
        }

        .btn-action:hover {
            background-color: var(--black);
            color: var(--yellow);
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 var(--pink);
        }
        
        .btn-action.primary:hover {
            background-color: var(--black);
            color: var(--green);
            box-shadow: 6px 6px 0 var(--yellow);
        }

        .btn-action:active {
            box-shadow: 0 0 0 var(--black);
            transform: translate(4px, 4px);
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<!-- 상단 고정 바 -->
<div class="fixed-top-bar">
    <div class="current-time" id="currentTimeDisplay">--:--:--</div>
    <div style="font-weight: 900; text-transform: uppercase;">문태양 · 서명 및 도장 생성기</div>
</div>

<div class="app-container">
    <!-- 메인 탭 -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('signature')">서명 만들기</button>
        <button class="tab-btn" onclick="switchTab('stamp')">도장 만들기</button>
    </div>

    <!-- 1. 서명 탭 -->
    <div id="tab-signature" class="content-box active">
        <!-- 모드 토글 -->
        <div class="mode-toggle">
            <button class="mode-btn active" onclick="setSigMode('draw')">직접 그리기</button>
            <button class="mode-btn" onclick="setSigMode('type')">텍스트 입력</button>
        </div>

        <!-- 텍스트 입력용 컨트롤 -->
        <div id="sig-type-controls" class="hidden">
            <div class="control-group">
                <input type="text" id="sigTextInput" class="brutal-input" placeholder="서명할 텍스트 입력" value="Moon Tae Yang">
            </div>
            <div class="control-group">
                <select id="sigFontSelect" class="brutal-input">
                    <optgroup label="Handwriting / Scripts">
                        <option value="'Nanum Pen Script', cursive">나눔 펜 스크립트 (Nanum Pen)</option>
                        <option value="'Caveat', cursive">캐비엇 (Caveat)</option>
                        <option value="'Pacifico', cursive">파시피코 (Pacifico)</option>
                        <option value="'Dancing Script', cursive">댄싱 스크립트 (Dancing Script)</option>
                        <option value="'Gamja Flower', cursive">감자꽃 (Gamja Flower)</option>
                        <option value="'Dongle', sans-serif">동글 (Dongle)</option>
                    </optgroup>
                    <optgroup label="Formal / Standard">
                        <option value="'Noto Sans KR', sans-serif">노토 산스 (Noto Sans)</option>
                        <option value="'Noto Serif KR', serif">노토 세리프 (Noto Serif)</option>
                    </optgroup>
                </select>
            </div>
        </div>

        <div class="canvas-wrapper">
            <canvas id="sigCanvas" width="400" height="200"></canvas>
        </div>

        <div class="btn-group">
            <button class="btn-action" id="sigClearBtn" onclick="clearSignature()">초기화</button>
            <button class="btn-action primary" onclick="downloadImage('sigCanvas', 'Signature')">서명 다운로드</button>
        </div>
    </div>

    <!-- 2. 도장 탭 -->
    <div id="tab-stamp" class="content-box">
        <div class="control-group">
            <label for="stampText">도장 문구 (2~4자 추천)</label>
            <input type="text" id="stampText" class="brutal-input" value="문태양" maxlength="4" placeholder="이름 입력">
        </div>
        
        <div class="control-group">
            <label for="stampShape">도장 모양</label>
            <select id="stampShape" class="brutal-input">
                <option value="square">사각형 (직인)</option>
                <option value="circle">원형 (둥근 도장)</option>
            </select>
        </div>

        <div class="control-group">
            <label for="stampFont">글꼴 선택</label>
            <select id="stampFont" class="brutal-input">
                <option value="'Nanum Myeongjo', serif">나눔명조 (Nanum Myeongjo)</option>
                <option value="'Gowun Batang', serif">고운바탕 (Gowun Batang)</option>
                <option value="'Noto Serif KR', serif">노토세리프 (Noto Serif KR)</option>
                <option value="'Black Han Sans', sans-serif">검은고딕 (Black Han Sans)</option>
                <option value="'Do Hyeon', sans-serif">도현 (Do Hyeon)</option>
                <option value="'Jua', sans-serif">주아 (Jua)</option>
                <option value="'Hahmlet', serif">함초롬 (Hahmlet)</option>
                <option value="'Song Myung', serif">송명 (Song Myung)</option>
            </select>
        </div>

        <div class="canvas-wrapper" style="width: 230px; margin: 20px auto;">
            <canvas id="stampCanvas" width="200" height="200"></canvas>
        </div>

        <button class="btn-action primary" style="width:100%" onclick="downloadImage('stampCanvas', 'Stamp')">도장 다운로드</button>
    </div>
</div>

<script>
    /* --- 실시간 시계 연동 --- */
    function updateClock() {
        const now = new Date();
        const yyyy = now.getFullYear();
        const mm = String(now.getMonth() + 1).padStart(2, '0');
        const dd = String(now.getDate()).padStart(2, '0');
        const timeStr = now.toLocaleTimeString('ko-KR', { hour12: false });
        const timeEl = document.getElementById('currentTimeDisplay');
        if (timeEl) timeEl.textContent = `${yyyy}.${mm}.${dd} ${timeStr}`;
    }
    updateClock();
    setInterval(updateClock, 1000);

    /* --- 탭 관리 --- */
    function switchTab(tabId) {
        document.querySelectorAll('.content-box').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        
        document.getElementById(`tab-${tabId}`).classList.add('active');
        event.target.classList.add('active');
    }

    function downloadImage(canvasId, prefix) {
        const canvas = document.getElementById(canvasId);
        const link = document.createElement('a');
        link.download = `${prefix}_${Date.now()}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
    }

    /* --- 서명(Signature) 영역 --- */
    const sigCanvas = document.getElementById('sigCanvas');
    const sigCtx = sigCanvas.getContext('2d');
    let isDrawing = false;
    let currentSigMode = 'draw';

    sigCtx.lineWidth = 5;
    sigCtx.lineCap = 'round';
    sigCtx.lineJoin = 'round';
    sigCtx.strokeStyle = '#000000';

    function setSigMode(mode) {
        currentSigMode = mode;
        document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');

        const typeControls = document.getElementById('sig-type-controls');
        const clearBtn = document.getElementById('sigClearBtn');

        if (mode === 'type') {
            typeControls.classList.remove('hidden');
            clearBtn.classList.add('hidden');
            sigCanvas.style.cursor = 'default';
            renderTypedSignature();
        } else {
            typeControls.classList.add('hidden');
            clearBtn.classList.remove('hidden');
            sigCanvas.style.cursor = 'crosshair';
            clearSignature();
        }
    }

    function getPointerPos(e) {
        const rect = sigCanvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const scaleX = sigCanvas.width / rect.width;
        const scaleY = sigCanvas.height / rect.height;
        return {
            x: (clientX - rect.left) * scaleX,
            y: (clientY - rect.top) * scaleY
        };
    }

    function startDrawing(e) {
        if (currentSigMode !== 'draw') return;
        e.preventDefault();
        isDrawing = true;
        const pos = getPointerPos(e);
        sigCtx.beginPath();
        sigCtx.moveTo(pos.x, pos.y);
    }

    function draw(e) {
        if (!isDrawing || currentSigMode !== 'draw') return;
        e.preventDefault();
        const pos = getPointerPos(e);
        sigCtx.lineTo(pos.x, pos.y);
        sigCtx.stroke();
    }

    function stopDrawing() {
        if (isDrawing && currentSigMode === 'draw') {
            sigCtx.closePath();
            isDrawing = false;
        }
    }

    function clearSignature() {
        sigCtx.clearRect(0, 0, sigCanvas.width, sigCanvas.height);
    }

    const sigTextInput = document.getElementById('sigTextInput');
    const sigFontSelect = document.getElementById('sigFontSelect');

    function renderTypedSignature() {
        if (currentSigMode !== 'type') return;
        const text = sigTextInput.value || ' ';
        const font = sigFontSelect.value;
        
        clearSignature();
        
        let fontSize = 120;
        sigCtx.font = `${fontSize}px ${font}`;
        sigCtx.textBaseline = 'middle';
        sigCtx.textAlign = 'center';
        sigCtx.fillStyle = '#000000';
        
        let textWidth = sigCtx.measureText(text).width;
        while (textWidth > sigCanvas.width - 40 && fontSize > 10) {
            fontSize -= 2;
            sigCtx.font = `${fontSize}px ${font}`;
            textWidth = sigCtx.measureText(text).width;
        }
        
        sigCtx.fillText(text, sigCanvas.width / 2, sigCanvas.height / 2);
    }

    sigCanvas.addEventListener('mousedown', startDrawing);
    sigCanvas.addEventListener('mousemove', draw);
    sigCanvas.addEventListener('mouseup', stopDrawing);
    sigCanvas.addEventListener('mouseout', stopDrawing);
    sigCanvas.addEventListener('touchstart', startDrawing, {passive: false});
    sigCanvas.addEventListener('touchmove', draw, {passive: false});
    sigCanvas.addEventListener('touchend', stopDrawing);

    sigTextInput.addEventListener('input', renderTypedSignature);
    sigFontSelect.addEventListener('change', renderTypedSignature);

    /* --- 도장(Stamp) 영역 --- */
    const stampCanvas = document.getElementById('stampCanvas');
    const stampCtx = stampCanvas.getContext('2d');
    
    const stampTextEl = document.getElementById('stampText');
    const stampFontEl = document.getElementById('stampFont');
    const stampShapeEl = document.getElementById('stampShape');

    function drawStamp() {
        const text = stampTextEl.value.trim() || " ";
        const font = stampFontEl.value;
        const shape = stampShapeEl.value;
        
        stampCtx.clearRect(0, 0, stampCanvas.width, stampCanvas.height);
        
        const size = stampCanvas.width;
        const center = size / 2;
        const computedColor = getComputedStyle(document.body).getPropertyValue('--stamp-color').trim() || '#E53935';
        
        stampCtx.strokeStyle = computedColor;
        stampCtx.fillStyle = computedColor;
        stampCtx.lineCap = 'butt';
        stampCtx.lineJoin = 'miter';
        
        if (shape === 'circle') {
            stampCtx.lineWidth = 7;
            stampCtx.beginPath();
            stampCtx.arc(center, center, center - 10, 0, Math.PI * 2);
            stampCtx.stroke();
        } else if (shape === 'square') {
            stampCtx.lineWidth = 10;
            stampCtx.strokeRect(12, 12, size - 24, size - 24);
        }
        
        stampCtx.textBaseline = 'middle';
        stampCtx.textAlign = 'center';
        
        if (text.length === 1) {
            stampCtx.font = `bold 100px ${font}`;
            stampCtx.fillText(text, center, center + 5);
        } else if (text.length === 2) {
            stampCtx.font = `bold 70px ${font}`;
            stampCtx.fillText(text[0], center - 38, center + 5);
            stampCtx.fillText(text[1], center + 38, center + 5);
        } else if (text.length === 3) {
            stampCtx.font = `bold 50px ${font}`;
            stampCtx.fillText(text[0], center - 50, center + 3);
            stampCtx.fillText(text[1], center, center + 3);
            stampCtx.fillText(text[2], center + 50, center + 3);
        } else if (text.length >= 4) {
            stampCtx.font = `bold 55px ${font}`;
            stampCtx.fillText(text[0], center + 38, center - 35);
            stampCtx.fillText(text[1], center + 38, center + 45);
            stampCtx.fillText(text[2], center - 38, center - 35);
            stampCtx.fillText(text[3], center - 38, center + 45);
        }
    }

    stampTextEl.addEventListener('input', drawStamp);
    stampFontEl.addEventListener('change', drawStamp);
    stampShapeEl.addEventListener('change', drawStamp);

    document.fonts.ready.then(() => {
        drawStamp();
        if (currentSigMode === 'type') {
            renderTypedSignature();
        }
    });

    drawStamp();
</script>
</body>
</html>
