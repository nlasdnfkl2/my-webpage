<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>서명 및 도장 생성기 (Neo-Brutalism)</title>
    
    <!-- Google Fonts 확장 목록 로드 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Caveat:wght@400..700&family=Dancing+Script:wght@400..700&family=Do+Hyeon&family=Dongle:wght@300;400;700&family=Gamja+Flower&family=Gowun+Batang:wght@400;700&family=Hahmlet:wght@100..900&family=Jua&family=Nanum+Myeongjo:wght@400;700;800&family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@100..900&family=Noto+Serif+KR:wght@200..900&family=Pacifico&family=Song+Myung&display=swap" rel="stylesheet">
    
    <style>
        /* 네오 브루탈리즘 테마 변수 */
        :root {
            --bg-color: #ffffff;
            --main-color: #000000;
            --white: #ffffff;
            --stamp-color: #E53935; /* 아시아 전통 도장 붉은색 */
            --border-width: 3px;
            --shadow-offset: 6px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans KR', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--main-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            /* 도트 패턴 배경으로 브루탈리즘 감성 추가 */
            background-image: radial-gradient(#000 1px, transparent 0);
            background-size: 20px 20px;
        }

        .app-container {
            width: 100%;
            max-width: 500px;
            background-color: var(--white);
            border: var(--border-width) solid var(--main-color);
            box-shadow: var(--shadow-offset) var(--shadow-offset) 0px var(--main-color);
            padding: 25px;
        }

        /* 탭 버튼 네비게이션 */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            font-size: 18px;
            font-weight: 800;
            background-color: var(--white);
            color: var(--main-color);
            border: var(--border-width) solid var(--main-color);
            box-shadow: 4px 4px 0px var(--main-color);
            cursor: pointer;
            transition: all 0.1s ease;
            text-align: center;
        }

        .tab-btn.active {
            background-color: var(--main-color);
            color: var(--white);
            box-shadow: 2px 2px 0px var(--main-color);
            transform: translate(2px, 2px);
        }

        /* 컨텐츠 영역 */
        .content-box {
            display: none;
            animation: fadeIn 0.2s ease-in-out;
        }

        .content-box.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 서브 탭 (모드 토글) */
        .mode-toggle {
            display: flex;
            margin-bottom: 20px;
            border: var(--border-width) solid var(--main-color);
        }

        .mode-btn {
            flex: 1;
            padding: 10px;
            font-weight: 700;
            background: var(--white);
            color: var(--main-color);
            border: none;
            cursor: pointer;
            border-right: var(--border-width) solid var(--main-color);
        }
        
        .mode-btn:last-child {
            border-right: none;
        }

        .mode-btn.active {
            background: var(--main-color);
            color: var(--white);
        }

        /* 컨트롤 그룹 및 입력 폼 */
        .control-group {
            margin-bottom: 20px;
        }

        .control-group label {
            display: block;
            font-weight: 800;
            margin-bottom: 8px;
            font-size: 15px;
        }

        .brutal-input {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: var(--border-width) solid var(--main-color);
            background-color: var(--white);
            color: var(--main-color);
            border-radius: 0;
            box-shadow: 4px 4px 0px var(--main-color);
            transition: all 0.1s ease;
            appearance: none;
        }

        .brutal-input:focus {
            outline: none;
            box-shadow: 2px 2px 0px var(--main-color);
            transform: translate(2px, 2px);
        }

        /* 캔버스 래퍼 */
        .canvas-wrapper {
            border: var(--border-width) solid var(--main-color);
            background-color: var(--white);
            box-shadow: var(--shadow-offset) var(--shadow-offset) 0px var(--main-color);
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px 0;
            position: relative;
            touch-action: none; /* 모바일 드로잉 스크롤 방지 */
            overflow: hidden;
        }

        /* 체커보드 배경 - 캔버스가 투명함을 나타내기 위함 */
        .canvas-wrapper::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 0;
            background-image: 
                linear-gradient(45deg, #e0e0e0 25%, transparent 25%), 
                linear-gradient(-45deg, #e0e0e0 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #e0e0e0 75%), 
                linear-gradient(-45deg, transparent 75%, #e0e0e0 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            pointer-events: none;
        }

        canvas {
            position: relative;
            z-index: 1;
        }
        
        #sigCanvas { cursor: crosshair; }

        /* 액션 버튼 */
        .btn-group {
            display: flex;
            gap: 15px;
        }

        .btn-action {
            flex: 1;
            padding: 14px;
            font-size: 16px;
            font-weight: 800;
            border: var(--border-width) solid var(--main-color);
            background-color: var(--white);
            color: var(--main-color);
            box-shadow: var(--shadow-offset) var(--shadow-offset) 0px var(--main-color);
            cursor: pointer;
            transition: all 0.1s ease;
            text-align: center;
            text-transform: uppercase;
        }

        .btn-action.primary {
            background-color: var(--main-color);
            color: var(--white);
        }

        .btn-action:hover {
            background-color: var(--main-color);
            color: var(--white);
        }
        
        .btn-action.primary:hover {
            background-color: var(--white);
            color: var(--main-color);
        }

        .btn-action:active {
            box-shadow: 2px 2px 0px var(--main-color);
            transform: translate(4px, 4px);
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="app-container">
    <!-- 메인 탭 -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('signature')">서명 만들기</button>
        <button class="tab-btn" onclick="switchTab('stamp')">도장 만들기</button>
    </div>

    <!-- 1. 서명 탭 -->
    <div id="tab-signature" class="content-box active">
        <!-- 모드 토글 -->
        <div class="mode-toggle">
            <button class="mode-btn active" onclick="setSigMode('draw')">직접 그리기</button>
            <button class="mode-btn" onclick="setSigMode('type')">텍스트 입력</button>
        </div>

        <!-- 텍스트 입력용 컨트롤 (Type 모드 시 표시) -->
        <div id="sig-type-controls" class="hidden">
            <div class="control-group">
                <input type="text" id="sigTextInput" class="brutal-input" placeholder="서명할 텍스트 입력" value="Hong Gil Dong">
            </div>
            <div class="control-group">
                <select id="sigFontSelect" class="brutal-input">
                    <!-- 영문/필기체 추천 폰트 -->
                    <optgroup label="Handwriting / Scripts">
                        <option value="'Nanum Pen Script', cursive">나눔 펜 스크립트 (Nanum Pen)</option>
                        <option value="'Caveat', cursive">캐비엇 (Caveat)</option>
                        <option value="'Pacifico', cursive">파시피코 (Pacifico)</option>
                        <option value="'Dancing Script', cursive">댄싱 스크립트 (Dancing Script)</option>
                        <option value="'Gamja Flower', cursive">감자꽃 (Gamja Flower)</option>
                        <option value="'Dongle', sans-serif">동글 (Dongle)</option>
                    </optgroup>
                    <!-- 일반 서체 -->
                    <optgroup label="Formal / Standard">
                        <option value="'Noto Sans KR', sans-serif">노토 산스 (Noto Sans)</option>
                        <option value="'Noto Serif KR', serif">노토 세리프 (Noto Serif)</option>
                    </optgroup>
                </select>
            </div>
        </div>

        <div class="canvas-wrapper">
            <canvas id="sigCanvas" width="400" height="200"></canvas>
        </div>

        <div class="btn-group">
            <button class="btn-action" id="sigClearBtn" onclick="clearSignature()">초기화</button>
            <button class="btn-action primary" onclick="downloadImage('sigCanvas', 'Signature')">서명 다운로드</button>
        </div>
    </div>

    <!-- 2. 도장 탭 -->
    <div id="tab-stamp" class="content-box">
        <div class="control-group">
            <label for="stampText">도장 문구 (2~4자 추천)</label>
            <input type="text" id="stampText" class="brutal-input" value="홍길동" maxlength="4" placeholder="이름 입력">
        </div>
        
        <div class="control-group">
            <label for="stampShape">도장 모양</label>
            <select id="stampShape" class="brutal-input">
                <option value="square">사각형 (직인)</option>
                <option value="circle">원형 (둥근 도장)</option>
            </select>
        </div>

        <div class="control-group">
            <label for="stampFont">글꼴 선택</label>
            <select id="stampFont" class="brutal-input">
                <option value="'Nanum Myeongjo', serif">나눔명조 (Nanum Myeongjo)</option>
                <option value="'Gowun Batang', serif">고운바탕 (Gowun Batang)</option>
                <option value="'Noto Serif KR', serif">노토세리프 (Noto Serif KR)</option>
                <option value="'Black Han Sans', sans-serif">검은고딕 (Black Han Sans)</option>
                <option value="'Do Hyeon', sans-serif">도현 (Do Hyeon)</option>
                <option value="'Jua', sans-serif">주아 (Jua)</option>
                <option value="'Hahmlet', serif">함초롬 (Hahmlet)</option>
                <option value="'Song Myung', serif">송명 (Song Myung)</option>
            </select>
        </div>

        <div class="canvas-wrapper" style="width: 250px; margin: 20px auto;">
            <canvas id="stampCanvas" width="200" height="200"></canvas>
        </div>

        <button class="btn-action primary" style="width:100%" onclick="downloadImage('stampCanvas', 'Stamp')">도장 다운로드</button>
    </div>
</div>

<script>
    /* ==========================================
       1. 공통 및 탭 관리
    ========================================== */
    function switchTab(tabId) {
        document.querySelectorAll('.content-box').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        
        document.getElementById(`tab-${tabId}`).classList.add('active');
        event.target.classList.add('active');
    }

    function downloadImage(canvasId, prefix) {
        const canvas = document.getElementById(canvasId);
        const link = document.createElement('a');
        link.download = `${prefix}_${Date.now()}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
    }

    /* ==========================================
       2. 서명(Signature) 영역
    ========================================== */
    const sigCanvas = document.getElementById('sigCanvas');
    const sigCtx = sigCanvas.getContext('2d');
    let isDrawing = false;
    let currentSigMode = 'draw'; // 'draw' or 'type'

    // 브러시 설정
    sigCtx.lineWidth = 5;
    sigCtx.lineCap = 'round';
    sigCtx.lineJoin = 'round';
    sigCtx.strokeStyle = '#000000'; // 서명 흑백 테마

    // 서명 모드 전환
    function setSigMode(mode) {
        currentSigMode = mode;
        
        // 토글 UI 업데이트
        document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');

        const typeControls = document.getElementById('sig-type-controls');
        const clearBtn = document.getElementById('sigClearBtn');

        if (mode === 'type') {
            typeControls.classList.remove('hidden');
            clearBtn.classList.add('hidden'); // Type 모드에선 지우기 버튼 불필요
            sigCanvas.style.cursor = 'default';
            renderTypedSignature();
        } else {
            typeControls.classList.add('hidden');
            clearBtn.classList.remove('hidden');
            sigCanvas.style.cursor = 'crosshair';
            clearSignature();
        }
    }

    // 마우스/터치 좌표 변환
    function getPointerPos(e) {
        const rect = sigCanvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const scaleX = sigCanvas.width / rect.width;
        const scaleY = sigCanvas.height / rect.height;
        return {
            x: (clientX - rect.left) * scaleX,
            y: (clientY - rect.top) * scaleY
        };
    }

    // 그리기 이벤트 (Draw 모드일 때만 동작)
    function startDrawing(e) {
        if (currentSigMode !== 'draw') return;
        e.preventDefault();
        isDrawing = true;
        const pos = getPointerPos(e);
        sigCtx.beginPath();
        sigCtx.moveTo(pos.x, pos.y);
    }

    function draw(e) {
        if (!isDrawing || currentSigMode !== 'draw') return;
        e.preventDefault();
        const pos = getPointerPos(e);
        sigCtx.lineTo(pos.x, pos.y);
        sigCtx.stroke();
    }

    function stopDrawing() {
        if (isDrawing && currentSigMode === 'draw') {
            sigCtx.closePath();
            isDrawing = false;
        }
    }

    function clearSignature() {
        sigCtx.clearRect(0, 0, sigCanvas.width, sigCanvas.height);
    }

    // Type 모드 자동 렌더링 및 Auto-Scaling
    const sigTextInput = document.getElementById('sigTextInput');
    const sigFontSelect = document.getElementById('sigFontSelect');

    function renderTypedSignature() {
        if (currentSigMode !== 'type') return;
        
        const text = sigTextInput.value || ' ';
        const font = sigFontSelect.value;
        
        clearSignature(); // 화면 정리
        
        let fontSize = 120; // 초기 최대 폰트 사이즈
        sigCtx.font = `${fontSize}px ${font}`;
        sigCtx.textBaseline = 'middle';
        sigCtx.textAlign = 'center';
        sigCtx.fillStyle = '#000000';
        
        // Auto-scaling 로직: 텍스트가 캔버스 폭(-40px 마진)보다 크면 사이즈 축소
        let textWidth = sigCtx.measureText(text).width;
        while (textWidth > sigCanvas.width - 40 && fontSize > 10) {
            fontSize -= 2;
            sigCtx.font = `${fontSize}px ${font}`;
            textWidth = sigCtx.measureText(text).width;
        }
        
        // 캔버스 중앙에 텍스트 배치
        sigCtx.fillText(text, sigCanvas.width / 2, sigCanvas.height / 2);
    }

    // 이벤트 리스너: 그리기
    sigCanvas.addEventListener('mousedown', startDrawing);
    sigCanvas.addEventListener('mousemove', draw);
    sigCanvas.addEventListener('mouseup', stopDrawing);
    sigCanvas.addEventListener('mouseout', stopDrawing);
    sigCanvas.addEventListener('touchstart', startDrawing, {passive: false});
    sigCanvas.addEventListener('touchmove', draw, {passive: false});
    sigCanvas.addEventListener('touchend', stopDrawing);

    // 이벤트 리스너: 텍스트 입력
    sigTextInput.addEventListener('input', renderTypedSignature);
    sigFontSelect.addEventListener('change', renderTypedSignature);

    /* ==========================================
       3. 도장(Stamp) 영역
    ========================================== */
    const stampCanvas = document.getElementById('stampCanvas');
    const stampCtx = stampCanvas.getContext('2d');
    
    const stampTextEl = document.getElementById('stampText');
    const stampFontEl = document.getElementById('stampFont');
    const stampShapeEl = document.getElementById('stampShape');

    function drawStamp() {
        const text = stampTextEl.value.trim() || " ";
        const font = stampFontEl.value;
        const shape = stampShapeEl.value;
        
        stampCtx.clearRect(0, 0, stampCanvas.width, stampCanvas.height);
        
        const size = stampCanvas.width;
        const center = size / 2;
        const stampColor = "var(--stamp-color)";
        const computedColor = getComputedStyle(document.body).getPropertyValue('--stamp-color').trim();
        
        stampCtx.strokeStyle = computedColor;
        stampCtx.fillStyle = computedColor;
        stampCtx.lineCap = 'butt';
        stampCtx.lineJoin = 'miter';
        
        // 1. 테두리 그리기
        if (shape === 'circle') {
            stampCtx.lineWidth = 7;
            stampCtx.beginPath();
            stampCtx.arc(center, center, center - 10, 0, Math.PI * 2);
            stampCtx.stroke();
        } else if (shape === 'square') {
            stampCtx.lineWidth = 10;
            stampCtx.strokeRect(12, 12, size - 24, size - 24);
        }
        
        // 2. 텍스트 배치
        stampCtx.textBaseline = 'middle';
        stampCtx.textAlign = 'center';
        
        if (text.length === 1) {
            stampCtx.font = `bold 100px ${font}`;
            stampCtx.fillText(text, center, center + 5); // 폰트별 미세 보정 (+5)
        } 
        else if (text.length === 2) {
            stampCtx.font = `bold 70px ${font}`;
            stampCtx.fillText(text[0], center - 38, center + 5);
            stampCtx.fillText(text[1], center + 38, center + 5);
        } 
        else if (text.length === 3) {
            stampCtx.font = `bold 50px ${font}`;
            stampCtx.fillText(text[0], center - 50, center + 3);
            stampCtx.fillText(text[1], center, center + 3);
            stampCtx.fillText(text[2], center + 50, center + 3);
        } 
        else if (text.length >= 4) {
            // 4자 이상일 경우 우상, 우하, 좌상, 좌하 (전통 인장 순서)
            stampCtx.font = `bold 55px ${font}`;
            stampCtx.fillText(text[0], center + 38, center - 35);
            stampCtx.fillText(text[1], center + 38, center + 45);
            stampCtx.fillText(text[2], center - 38, center - 35);
            stampCtx.fillText(text[3], center - 38, center + 45);
        }
    }

    stampTextEl.addEventListener('input', drawStamp);
    stampFontEl.addEventListener('change', drawStamp);
    stampShapeEl.addEventListener('change', drawStamp);

    /* ==========================================
       4. 초기 폰트 로드 및 렌더링
    ========================================== */
    // Google Fonts 다운로드가 완료되면 캔버스를 최신화합니다.
    document.fonts.ready.then(() => {
        drawStamp();
        if (currentSigMode === 'type') {
            renderTypedSignature();
        }
    });

    // 초기 실행
    drawStamp();

</script>
</body>
</html>
