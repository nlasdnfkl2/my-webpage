<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>디지털 도장 생성기</title>
    <!-- 구글 웹폰트 로드 (도장 스타일용 한글 폰트) -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f7fa;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        h1 {
            color: #333;
            margin-bottom: 25px;
            font-size: 24px;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
            font-size: 14px;
        }
        input[type="text"], select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus, select:focus {
            border-color: #ff4d4d;
            outline: none;
        }
        .preview-box {
            background-color: #fafafa;
            border: 1px dashed #ccc;
            border-radius: 8px;
            padding: 30px;
            margin: 25px 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            background-color: transparent;
            max-width: 100%;
            height: auto;
        }
        .btn-download {
            background-color: #ff4d4d;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }
        .btn-download:hover {
            background-color: #e63939;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>디지털 도장 생성기</h1>
    
    <!-- 이름 입력 -->
    <div class="form-group">
        <label for="stampText">도장 문구 (2~4자 추천)</label>
        <input type="text" id="stampText" value="홍길동" maxlength="4" placeholder="이름을 입력하세요">
    </div>
    
    <!-- 글꼴 선택 -->
    <div class="form-group">
        <label for="stampFont">글꼴 선택</label>
        <select id="stampFont">
            <option value="'Nanum Myeongjo', serif">나눔명조 (기본형)</option>
            <option value="'Gowun Batang', serif">고운바탕 (부드러운 서체)</option>
            <option value="'Noto Serif KR', serif">노토세리프 (진중한 서체)</option>
            <option value="'East Sea Dokdo', cursive">독도체 (캘리그라피 스타일)</option>
        </select>
    </div>

    <!-- 모양 선택 -->
    <div class="form-group">
        <label for="stampShape">도장 모양</label>
        <select id="stampShape">
            <option value="circle">원형 (둥근 도장)</option>
            <option value="square">사각형 (직인 스타일)</option>
        </select>
    </div>

    <!-- 실시간 미리보기 영역 -->
    <div class="preview-box">
        <canvas id="stampCanvas" width="200" height="200"></canvas>
    </div>

    <!-- 다운로드 버튼 -->
    <button class="btn-download" id="downloadBtn">도장 이미지 다운로드</button>
</div>

<script>
    const canvas = document.getElementById('stampCanvas');
    const ctx = canvas.getContext('2d');

    const stampText = document.getElementById('stampText');
    const stampFont = document.getElementById('stampFont');
    const stampShape = document.getElementById('stampShape');
    const downloadBtn = document.getElementById('downloadBtn');

    // 도장 그리기 함수
    function drawStamp() {
        const text = stampText.value.trim() || "이름";
        const font = stampFont.value;
        const shape = stampShape.value;
        
        // 캔버스 초기화 (투명 배경)
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        const size = canvas.width;
        const center = size / 2;
        const color = "#ff4d4d"; // 인절미/도장 붉은색
        
        ctx.strokeStyle = color;
        ctx.fillStyle = color;
        
        // 1. 테두리 선 그리기
        if (shape === 'circle') {
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.arc(center, center, center - 10, 0, Math.PI * 2);
            ctx.stroke();
        } else if (shape === 'square') {
            ctx.lineWidth = 8;
            ctx.strokeRect(10, 10, size - 20, size - 20);
        }
        
        // 2. 텍스트 배치 및 그리기
        ctx.textBaseline = 'middle';
        ctx.textAlign = 'center';
        
        if (text.length === 1) {
            ctx.font = `bold 90px ${font}`;
            ctx.fillText(text, center, center);
        } 
        else if (text.length === 2) {
            ctx.font = `bold 65px ${font}`;
            ctx.fillText(text[0], center - 35, center);
            ctx.fillText(text[1], center + 35, center);
        } 
        else if (text.length === 3) {
            // 3글자일 경우 일반적으로 오른쪽에 성, 왼쪽에 이름 위아래 배치 or 일렬 배치
            // 여기서는 깔끔한 가로/세로 균형을 위해 폰트 크기 조정 후 중앙 배치
            ctx.font = `bold 45px ${font}`;
            ctx.fillText(text[0], center - 45, center);
            ctx.fillText(text[1], center, center);
            ctx.fillText(text[2], center + 45, center);
        } 
        else if (text.length === 4) {
            // 4글자 (우상 -> 우하 -> 좌상 -> 좌하 전통 배열 순서 배치)
            ctx.font = `bold 50px ${font}`;
            ctx.fillText(text[0], center + 35, center - 35); // 성 (우상)
            ctx.fillText(text[1], center + 35, center + 35); // 이름1 (우하)
            ctx.fillText(text[2], center - 35, center - 35); // 이름2 (좌상)
            ctx.fillText(text[3], center - 35, center + 35); // '인' 또는 이름3 (좌하)
        }
    }

    // 이벤트 리스너 등록 (입력 변경 시 실시간 반영)
    stampText.addEventListener('input', drawStamp);
    stampFont.addEventListener('change', drawStamp);
    stampShape.addEventListener('change', drawStamp);

    // 웹폰트가 로드된 후 도장을 다시 그려주기 위한 처리
    document.fonts.ready.then(drawStamp);

    // 이미지 다운로드 기능 (배경이 투명한 PNG 파일로 저장)
    downloadBtn.addEventListener('click', () => {
        const link = document.createElement('a');
        link.download = `${stampText.value || '디지털도장'}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
    });

    // 초기 실행
    drawStamp();
</script>

</body>
</html>
