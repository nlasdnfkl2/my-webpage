
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>크리에이티브 평면도형 스튜디오 - 중학 수학 고도화 버전</title>
    <style>
        /* Neo Brutalism Base Theme */
        :root {
            --bg-color: #f0ebe1;
            --main-yellow: #ffde00;
            --main-pink: #ff007b;
            --main-cyan: #00f0ff;
            --main-green: #00ff66;
            --dark: #000000;
            --border-size: 4px;
            --shadow-offset: 5px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Arial Black', ui-sans-serif, system-ui, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--dark);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .brutal-card {
            background: #ffffff;
            border: var(--border-size) solid var(--dark);
            box-shadow: var(--shadow-offset) var(--shadow-offset) 0px var(--dark);
            padding: 20px;
            margin-bottom: 25px;
            width: 100%;
            max-width: 900px;
        }

        h1 {
            font-size: 2.3rem;
            text-transform: uppercase;
            background: var(--main-yellow);
            padding: 10px 20px;
            border: var(--border-size) solid var(--dark);
            box-shadow: var(--shadow-offset) var(--shadow-offset) 0px var(--dark);
            margin-bottom: 30px;
            display: inline-block;
            transform: rotate(-1deg);
        }

        h2 {
            font-size: 1.5rem;
            margin-bottom: 15px;
            text-transform: uppercase;
            display: inline-block;
            border-bottom: 3px solid var(--dark);
        }

        .tab-container {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 900px;
        }

        .brutal-btn {
            background: #ffffff;
            border: var(--border-size) solid var(--dark);
            padding: 10px 20px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 3px 3px 0px var(--dark);
            transition: all 0.1s ease;
        }

        .brutal-btn:active, .brutal-btn.active {
            transform: translate(3px, 3px);
            box-shadow: 0px 0px 0px var(--dark);
        }

        .brutal-btn.active {
            background: var(--main-cyan);
        }

        .grid-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .grid-layout { grid-template-columns: 1fr; }
        }

        .canvas-area {
            position: relative;
            background: #fff;
            border: var(--border-size) solid var(--dark);
            height: 350px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        svg {
            width: 100%;
            height: 100%;
        }

        .controls-panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .shape-selector, .option-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .control-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .color-picker-group {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        input[type="color"] {
            -webkit-appearance: none;
            border: var(--border-size) solid var(--dark);
            width: 50px;
            height: 40px;
            cursor: pointer;
        }

        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: none; }

        .quiz-status {
            background: var(--main-pink);
            color: white;
            font-size: 1.5rem;
            padding: 10px;
            border: var(--border-size) solid var(--dark);
            box-shadow: 3px 3px 0px var(--dark);
            margin-bottom: 15px;
            text-align: center;
        }

        .quiz-success-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 255, 102, 0.95);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: var(--border-size) solid var(--dark);
            z-index: 10;
            text-align: center;
            padding: 20px;
        }

        .key-hint {
            font-size: 0.85rem;
            color: #333;
            margin-top: 5px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Creative Geometry Studio</h1>

    <div class="tab-container">
        <button class="brutal-btn active" id="btn-practice" onclick="setMode('practice')">자유 연습 모드</button>
        <button class="brutal-btn" id="btn-quiz" onclick="setMode('quiz')">도형 맞추기 퀴즈</button>
    </div>

    <!-- PRACTICE MODE -->
    <div id="practice-mode" class="brutal-card">
        <h2>자유 연습 모드</h2>
        <p style="margin-bottom: 15px; font-weight: bold;">도형의 회전, 대칭, 각도 및 중학 기하 성질을 시각적으로 탐구하세요.</p>
        
        <div class="grid-layout">
            <div class="canvas-area" id="practice-container">
                <svg id="practice-svg"></svg>
            </div>
            
            <div class="controls-panel">
                <div>
                    <label style="display:block; margin-bottom:5px; font-weight: bold;">도형 선택 (중학 수학 과정)</label>
                    <div class="shape-selector">
                        <button class="brutal-btn active" onclick="changeShape('triangle', this)">정삼각형</button>
                        <button class="brutal-btn" onclick="changeShape('square', this)">정사각형</button>
                        <button class="brutal-btn" onclick="changeShape('parallelogram', this)">평행사변형</button>
                        <button class="brutal-btn" onclick="changeShape('rhombus', this)">마름모</button>
                        <button class="brutal-btn" onclick="changeShape('trapezoid', this)">사다리꼴</button>
                        <button class="brutal-btn" onclick="changeShape('lshape', this)">L자형 변형도형</button>
                    </div>
                </div>

                <div>
                    <label style="display:block; margin-bottom:5px; font-weight: bold;">시각화 옵션</label>
                    <div class="option-selector">
                        <button class="brutal-btn" id="opt-axis" onclick="toggleOption('axis')">대칭축 표시</button>
                        <button class="brutal-btn" id="opt-angle" onclick="toggleOption('angle')">내각 표시</button>
                    </div>
                </div>

                <div>
                    <label style="display:block; margin-bottom:5px; font-weight: bold;">조작 컨트롤</label>
                    <div class="control-grid">
                        <button class="brutal-btn" onclick="manipulate('rotate-ccw')">반시계 회전 (←)</button>
                        <button class="brutal-btn" onclick="manipulate('rotate-cw')">시계 회전 (→)</button>
                        <button class="brutal-btn" onclick="manipulate('flip-h')">좌우 뒤집기 (↑)</button>
                        <button class="brutal-btn" onclick="manipulate('flip-v')">상하 뒤집기 (↓)</button>
                    </div>
                    <div class="key-hint">💡 키보드 방향키 조작 지원 (화면 스크롤 방지 완료) / 리셋: Space</div>
                </div>

                <div class="color-picker-group">
                    <div>
                        <label style="display:block; margin-bottom:2px; font-size:0.9rem;">도형 채우기</label>
                        <input type="color" id="color-fill" value="#ffde00" onchange="updateColors()">
                    </div>
                    <div>
                        <label style="display:block; margin-bottom:2px; font-size:0.9rem;">기준점(A)</label>
                        <input type="color" id="color-point" value="#ff007b" onchange="updateColors()">
                    </div>
                    <button class="brutal-btn" style="margin-left:auto; background:var(--main-pink); color:white;" onclick="resetState()">공간 리셋</button>
                </div>
            </div>
        </div>
    </div>

    <!-- QUIZ MODE -->
    <div id="quiz-mode" class="brutal-card" style="display: none;">
        <div class="quiz-status">🔥 COMBO: <span id="combo-count">0</span></div>
        <h2>도형 합동 및 대칭 맞추기 퀴즈</h2>
        <p style="margin-bottom: 15px; font-weight: bold;">🛠 나의 도형을 조작하여 🎯 목표 도형과 완전히 일치(합동)시키세요! (기준점 A 매칭 필수)</p>

        <div class="grid-layout">
            <div style="text-align: center;">
                <div style="background:var(--main-cyan); padding:5px; border:3px solid #000; font-weight:bold; margin-bottom:10px;">🎯 목표 도형 (TARGET)</div>
                <div class="canvas-area">
                    <svg id="quiz-target-svg"></svg>
                </div>
            </div>
            <div style="text-align: center; position: relative;">
                <div style="background:var(--main-yellow); padding:5px; border:3px solid #000; font-weight:bold; margin-bottom:10px;">🛠 나의 도형 (USER)</div>
                <div class="canvas-area" id="quiz-user-container">
                    <div class="quiz-success-overlay" id="success-overlay">
                        <span style="font-size: 2.2rem; font-weight: bold; background: white; border:3px solid #000; padding:5px 15px; box-shadow:3px 3px 0 #000;">PERFECT!</span>
                        <p style="margin: 15px 0; font-weight: bold;">공간지각 능력이 대단하시군요!</p>
                        <button class="brutal-btn" style="background: var(--main-green);" onclick="nextQuiz()">다음 문제 도전 (Enter)</button>
                    </div>
                    <svg id="quiz-user-svg"></svg>
                </div>
            </div>
        </div>

        <div style="margin-top: 20px;" class="controls-panel">
            <div class="control-grid">
                <button class="brutal-btn" onclick="manipulate('rotate-ccw')">반시계 회전 (←)</button>
                <button class="brutal-btn" onclick="manipulate('rotate-cw')">시계 회전 (→)</button>
                <button class="brutal-btn" onclick="manipulate('flip-h')">좌우 뒤집기 (↑)</button>
                <button class="brutal-btn" onclick="manipulate('flip-v')">상하 뒤집기 (↓)</button>
            </div>
            <button class="brutal-btn" style="width: 100%; background: var(--main-green); font-size: 1.3rem;" onclick="checkAnswer()">정답 확인 (Enter)</button>
        </div>
    </div>

    <script>
        // State Management
        let currentMode = 'practice';
        let currentShapeType = 'triangle';

        // Geometry Transform Tracking
        let transformState = { rotation: 0, flipH: 1, flipV: 1 };
        let targetState = { rotation: 0, flipH: 1, flipV: 1, shapeType: 'triangle' };

        // Visualization Options
        let options = { axis: false, angle: false };
        let combo = 0;
        let isQuizCleared = false;

        // Shape Coordinate & Geometric Properties (Centered at 0,0)
        const shapes = {
            triangle: {
                points: [[0, -65], [56, 32], [-56, 32]],
                angles: [60, 60, 60],
                name: "정삼각형"
            },
            square: {
                points: [[-45, -45], [45, -45], [45, 45], [-45, 45]],
                angles: [90, 90, 90, 90],
                name: "정사각형"
            },
            parallelogram: {
                points: [[-25, -45], [55, -45], [25, 45], [-55, 45]],
                angles: [60, 120, 60, 120],
                name: "평행사변형"
            },
            rhombus: {
                points: [[0, -65], [50, 0], [0, 65], [-50, 0]],
                angles: [70, 110, 70, 110],
                name: "마름모"
            },
            trapezoid: {
                points: [[-30, -40], [30, -40], [60, 40], [-60, 40]],
                angles: [70, 70, 110, 110],
                name: "등변사다리꼴"
            },
            lshape: {
                points: [[-40, -40], [10, -40], [10, 0], [40, 0], [40, 40], [-40, 40]],
                angles: [90, 90, 270, 90, 90, 90],
                name: "L자형 변형도형"
            }
        };

        window.onload = function() {
            initSVGs();
            resetState();
            bindGlobalKeys();
        };

        function initSVGs() {
            const svgs = ['practice-svg', 'quiz-target-svg', 'quiz-user-svg'];
            svgs.forEach(id => {
                const svg = document.getElementById(id);
                svg.innerHTML = `<g id="${id}-g" transform="translate(150, 175)"></g>`;
            });
        }

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('btn-practice').classList.toggle('active', mode === 'practice');
            document.getElementById('btn-quiz').classList.toggle('active', mode === 'quiz');
            document.getElementById('practice-mode').style.display = mode === 'practice' ? 'block' : 'none';
            document.getElementById('quiz-mode').style.display = mode === 'quiz' ? 'block' : 'none';

            if (mode === 'quiz') {
                generateQuiz();
            } else {
                resetState();
            }
        }

        function changeShape(shapeType, btn) {
            currentShapeType = shapeType;
            const buttons = btn.parentElement.querySelectorAll('.brutal-btn');
            buttons.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            resetState();
        }

        function toggleOption(opt) {
            options[opt] = !options[opt];
            document.getElementById(`opt-${opt}`).classList.toggle('active', options[opt]);
            render();
        }

        function resetState() {
            transformState = { rotation: 0, flipH: 1, flipV: 1 };
            render();
        }

        function manipulate(action) {
            if (isQuizCleared && currentMode === 'quiz') return;

            if (action === 'rotate-cw') transformState.rotation = (transformState.rotation + 45) % 360;
            if (action === 'rotate-ccw') transformState.rotation = (transformState.rotation - 45 + 360) % 360;
            if (action === 'flip-h') transformState.flipH *= -1;
            if (action === 'flip-v') transformState.flipV *= -1;

            render();
        }

        function updateColors() {
            render();
        }

        function bindGlobalKeys() {
            window.addEventListener('keydown', function(e) {
                if(['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].indexOf(e.code) > -1) {
                    e.preventDefault();
                }
            }, {passive: false});

            document.addEventListener('keydown', function(e) {
                if (currentMode === 'practice') {
                    if (e.key === 'ArrowLeft') manipulate('rotate-ccw');
                    if (e.key === 'ArrowRight') manipulate('rotate-cw');
                    if (e.key === 'ArrowUp') manipulate('flip-h');
                    if (e.key === 'ArrowDown') manipulate('flip-v');
                    if (e.key === ' ' || e.code === 'Space') resetState();
                } else if (currentMode === 'quiz') {
                    if (isQuizCleared) {
                        if (e.key === 'Enter') nextQuiz();
                        return;
                    }
                    if (e.key === 'ArrowLeft') manipulate('rotate-ccw');
                    if (e.key === 'ArrowRight') manipulate('rotate-cw');
                    if (e.key === 'ArrowUp') manipulate('flip-h');
                    if (e.key === 'ArrowDown') manipulate('flip-v');
                    if (e.key === 'Enter') checkAnswer();
                }
            });
        }

        function render() {
            if (currentMode === 'practice') {
                const group = document.getElementById('practice-svg-g');
                renderShapeInGroup(group, currentShapeType, transformState, false);
            } else {
                const userGroup = document.getElementById('quiz-user-svg-g');
                renderShapeInGroup(userGroup, targetState.shapeType, transformState, false);
            }
        }

        function renderShapeInGroup(group, shapeType, state, isTarget = false) {
            group.innerHTML = '';
            const shape = shapes[shapeType];
            const fillColor = isTarget ? '#d0d0d0' : document.getElementById('color-fill').value;
            const pointColor = isTarget ? '#ff003c' : document.getElementById('color-point').value;

            const transformG = document.createElementNS('http://www.w3.org/2000/svg', 'g');
            transformG.setAttribute('transform', `scale(${state.flipH}, ${state.flipV}) rotate(${state.rotation})`);

            const polygon = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
            const pointsStr = shape.points.map(p => p.join(',')).join(' ');
            polygon.setAttribute('points', pointsStr);
            polygon.setAttribute('fill', fillColor);
            polygon.setAttribute('stroke', '#000000');
            polygon.setAttribute('stroke-width', '4');
            transformG.appendChild(polygon);

            if (options.angle && !isTarget && currentMode === 'practice') {
                shape.points.forEach((p, idx) => {
                    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                    text.setAttribute('x', p[0] * 0.6);
                    text.setAttribute('y', p[1] * 0.6);
                    text.setAttribute('font-size', '14px');
                    text.setAttribute('font-weight', 'bold');
                    text.setAttribute('fill', '#000000');
                    text.setAttribute('text-anchor', 'middle');
                    text.setAttribute('dominant-baseline', 'central');
                    text.textContent = `${shape.angles[idx]}°`;
                    transformG.appendChild(text);
                });
            }

            const ptA = shape.points[0];
            const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            circle.setAttribute('cx', ptA[0]);
            circle.setAttribute('cy', ptA[1]);
            circle.setAttribute('r', '9');
            circle.setAttribute('fill', pointColor);
            circle.setAttribute('stroke', '#000000');
            circle.setAttribute('stroke-width', '3');
            transformG.appendChild(circle);

            const textA = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            textA.setAttribute('x', ptA[0]);
            textA.setAttribute('y', ptA[1] - 15);
            textA.setAttribute('font-size', '14px');
            textA.setAttribute('font-weight', 'bold');
            textA.setAttribute('text-anchor', 'middle');
            textA.textContent = 'A';
            transformG.appendChild(textA);

            group.appendChild(transformG);

            if (options.axis && !isTarget && currentMode === 'practice') {
                const axisH = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                axisH.setAttribute('x1', '-140'); axisH.setAttribute('y1', '0');
                axisH.setAttribute('x2', '140'); axisH.setAttribute('y2', '0');
                axisH.setAttribute('stroke', '#00f0ff'); axisH.setAttribute('stroke-width', '2');
                axisH.setAttribute('stroke-dasharray', '6,4');
                group.appendChild(axisH);

                const axisV = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                axisV.setAttribute('x1', '0'); axisV.setAttribute('y1', '-140');
                axisV.setAttribute('x2', '0'); axisV.setAttribute('y2', '140');
                axisV.setAttribute('stroke', '#ff007b'); axisV.setAttribute('stroke-width', '2');
                axisV.setAttribute('stroke-dasharray', '6,4');
                group.appendChild(axisV);
            }
        }

        function generateQuiz() {
            isQuizCleared = false;
            document.getElementById('success-overlay').style.display = 'none';

            const shapeKeys = Object.keys(shapes);
            targetState.shapeType = shapeKeys[Math.floor(Math.random() * shapeKeys.length)];

            const rotations = [0, 45, 90, 135, 180, 225, 270, 315];
            targetState.rotation = rotations[Math.floor(Math.random() * rotations.length)];
            targetState.flipH = Math.random() > 0.5 ? 1 : -1;
            targetState.flipV = Math.random() > 0.5 ? 1 : -1;

            transformState = { rotation: 0, flipH: 1, flipV: 1 };

            const targetGroup = document.getElementById('quiz-target-svg-g');
            renderShapeInGroup(targetGroup, targetState.shapeType, targetState, true);

            render();
        }

        function checkAnswer() {
            if (isQuizCleared) return;

            const shape = shapes[targetState.shapeType];
            const ptA = shape.points[0];

            const getTransformedPt = (pt, state) => {
                let x = pt[0] * state.flipH;
                let y = pt[1] * state.flipV;
                let rad = (state.rotation * Math.PI) / 180;
                return [
                    x * Math.cos(rad) - y * Math.sin(rad),
                    x * Math.sin(rad) + y * Math.cos(rad)
                ];
            };

            const userPt = getTransformedPt(ptA, transformState);
            const targetPt = getTransformedPt(ptA, targetState);

            const distance = Math.hypot(userPt[0] - targetPt[0], userPt[1] - targetPt[1]);

            if (distance < 1e-1) {
                isQuizCleared = true;
                combo++;
                document.getElementById('combo-count').textContent = combo;
                document.getElementById('success-overlay').style.display = 'flex';
            } else {
                alert("도형의 방향이나 기준점(A)의 위치가 일치하지 않습니다. 대칭과 회전을 다시 이용해 맞춰보세요!");
                combo = 0;
                document.getElementById('combo-count').textContent = combo;
            }
        }

        function nextQuiz() {
            generateQuiz();
        }
    </script>
</body>
</html>
